name: PHASE 1 - Zerochain Genesis
description: Initialize ROOT nodes, create token and emission

includes:
  - common/set_net_default.yml

network:
  topology: default
  name: stagenet

setup:

  # Enable seed_mode for ROOT nodes to create genesis events
  # seed_mode controls genesis acceptance, NOT networking (seed_nodes handles that)
  - config: "cellframe-node"
    nodes: [root-1, root-2, root-3]
    set:
      seed_mode: "true"

  # CRITICAL: Start ALL nodes (root + master) at once to avoid container restart between phases
  # Restart loses emission from ledger memory, causing "Specified emission not found"
  # NOTE: ROOT nodes start with seed_mode=true by default (configured in generator.py)
  - docker_op: start
    services: [root-1, root-2, root-3, master-1, master-2, master-3]
    detach: true
  
  - wait_network: online
    nodes: [root-1, root-2, root-3, master-1, master-2, master-3]
    timeout: 60
  
  # Allow brief stabilization after coming online before executing commands
  - wait: "5s"
  
  # Note: Link establishment requires node registration which happens in the 'test' section.
  # So we cannot wait for links here.

test:
  # Register ROOT nodes - get addresses (IPs already in context as node_ip map)
  # Available: node_ip['node1'], node_ip['node2'], node_ip['node3']
  # Or as array: node_ips[0], node_ips[1], node_ips[2]
  - group: Get node addresses
    steps:
      - cli: "node dump"
        node: root-1
        save_node: root_addr_0
      
      - cli: "node dump"
        node: root-2
        save_node: root_addr_1
      
      - cli: "node dump"
        node: root-3
        save_node: root_addr_2
  
  # Register all nodes on each root node with IP and port (each node registers others, not itself)
  # Using node_ip map for readable access by node ID
  - group: Register nodes on root-1
    defaults:
      node: root-1
    steps:
      # root-1 registers root-2 and root-3 with their IP addresses and ports
      - cli: "node add -addr {{root_addr_1}} -alias root-2 -host {{node_ip['node2']}} -port 8079"
      
      - cli: "node add -addr {{root_addr_2}} -alias root-3 -host {{node_ip['node3']}} -port 8079"
  
  - group: Register nodes on root-2
    defaults:
      node: root-2
    steps:
      # root-2 registers root-1 and root-3 with their IP addresses and ports
      - cli: "node add -addr {{root_addr_0}} -alias root-1 -host {{node_ip['node1']}} -port 8079"
      
      - cli: "node add -addr {{root_addr_2}} -alias root-3 -host {{node_ip['node3']}} -port 8079"
  
  - group: Register nodes on root-3
    defaults:
      node: root-3
    steps:
      # root-3 registers root-1 and root-2 with their IP addresses and ports
      - cli: "node add -addr {{root_addr_0}} -alias root-1 -host {{node_ip['node1']}} -port 8079"
      
      - cli: "node add -addr {{root_addr_1}} -alias root-2 -host {{node_ip['node2']}} -port 8079"
  
  # CRITICAL: Restart nodes after adding to nodelist
  # tests-in-docker does: docker compose restart after node add
  # This allows nodes to reload nodelist and establish connections
  - docker_op: restart
    services: [root-1, root-2, root-3]
  
  # Wait for nodes to restart and establish connections
  - wait: "20s"
  
  # Wait for CLI to be responsive on all root nodes
  - wait: cli_ready
    nodes: [root-1, root-2, root-3]
    timeout: 40

  # Wait for network links to be established between nodes
  # This is critical for DAG-PoA round signing to work
  # DAG-PoA requires GlobalDB sync between nodes for round notifications
  - wait: "45s"

  # Create fee wallet (preparatory step, not genesis operation)
  - cli: "wallet new -w fee_collector"
    node: root-1
  
  # Get fee wallet address
  - cli: "wallet info -w fee_collector"
    node: root-1
    save_wallet: fee_addr

  # =================================================================
  # GENESIS EVENT CREATION IN SEED MODE
  # =================================================================
  # ROOT nodes started with seed_mode=true 
  # Only token_decl is the genesis event - everything else happens after seed_mode is disabled
  
  
  # GENESIS OPERATION: Create TCELL token declaration with 2/3 consensus
  # This is the ONLY genesis event for zerochain - signed by all 3 root validators
  - group: Genesis Event - Token Declaration
    defaults:
      node: root-1
    steps:
      - cli: "token_decl -token TCELL -chain zerochain -total_supply 1000000.0e+18 -decimals 18 -signs_emission 2 -signs_total 3 -certs pvt.stagenet.root.0,pvt.stagenet.root.1,pvt.stagenet.root.2"
        save_hash: token_hash
      
      # Allow propagation
      - wait: "3s"
      
      # CRITICAL: Process mempool to add token to DAG
      # Specify datum hash to trigger processing with auto_confirmation
      - cli: "mempool proc -net stagenet -chain zerochain -datum {{token_hash}}"
        node: root-1
      
      - wait: "2s"

      # Wait for DAG-PoA round to complete (typically 15-20s with 3 root nodes)
      # Note: datum may remain in mempool after finalization due to node behavior
      # We wait and verify via token list instead of mempool check
      - wait: "30s"
      
      # Verify token was created in ledger
      - cli: "token list"
        node: root-1
        expect_output: "tokens: 1"
      
      # Flush GDB to ensure token is synced
      - cli: "global_db flush"
        node: root-1
      
      - wait: "5s"
      
      # GENESIS OPERATION: Create emission in seed_mode
      # This ensures emission is created before restart and token is in ledger
      - cli: "token_emit -chain zerochain -token TCELL -emission_value 1000000.0e+18 -addr {{fee_addr}} -certs pvt.stagenet.root.0,pvt.stagenet.root.1,pvt.stagenet.root.2"
        save_hash: emission_hash
        expect: success
      
      - wait: "5s"
      
      # Process emission in mempool with specific datum hash
      # This triggers auto_confirmation from other ROOT nodes
      - cli: "mempool proc -net stagenet -chain zerochain -datum {{emission_hash}}"
        node: root-1
      - wait: "5s"
      
      # Wait for emission to be finalized (DAG-PoA consensus needs ~20-30s for round)
      # CRITICAL: Emission MUST be in DAG before restart, otherwise it will be lost!
      - wait: "45s"
      
      # Verify emission is finalized by checking DAG events count (should be 2: token + emission)
      - cli: "dag event list -chain zerochain"
        node: root-1
        expect_output: "total_events: 2"
      
      # CRITICAL: Get the FIRST EVENT HASH (genesis) from DAG
      # Event hash != datum hash! Event includes signatures, timestamps, etc.
      # Use dag event find to get the event hash that contains token datum
      - cli: "dag event find -chain zerochain -datum {{token_hash}}"
        node: root-1
        save_hash: genesis_event_hash
  
  # Genesis events (token + emission) created! Now disable seed_mode and set static genesis hash
  # Apply to ALL nodes so they all have the same genesis
  - config: "cellframe-node"
    nodes: [root-1, root-2, root-3, master-1, master-2, master-3]
    set:
      seed_mode: "false"
  
  - config: "stagenet/zerochain"
    nodes: [root-1, root-2, root-3, master-1, master-2, master-3]
    set:
      static_genesis_event: "{{genesis_event_hash}}"
      is_static_genesis_event: "true"
  
  # Restart ALL nodes to apply new configs (seed_mode=false, static_genesis_event set)
  - docker_op: restart
    services: [root-1, root-2, root-3, master-1, master-2, master-3]
  
  - wait_network: online
    nodes: [root-1, root-2, root-3, master-1, master-2, master-3]
    timeout: 60
  
  # Wait for network to stabilize after restart (links take time to establish)
  - wait: "60s"
  
  # Wait for CLI to be responsive
  - wait: cli_ready
    nodes: [root-1, root-2, root-3, master-1, master-2, master-3]
    timeout: 40
  
  # Sync GDB and mempool after restart to ensure all nodes are synchronized
  - group: GDB and Mempool sync
    steps:
      - loop: 3
        steps:
          - set: node_name = "root-{{iteration}}"
          - cli: "global_db sync -net stagenet"
            node: "{{node_name}}"
      
      - wait: "5s"
      
      - loop: 3
        steps:
          - set: node_name = "root-{{iteration}}"
          - cli: "mempool proc -net stagenet -chain zerochain"
            node: "{{node_name}}"
      
      - wait: "5s"
  
  # =================================================================
  # REGULAR OPERATIONS (NOT IN SEED MODE)  
  # =================================================================
  # Token and emission were created in seed_mode. Now create wallets and fund them.
  
  - group: Wallet Funding
    defaults:
      node: root-1
    steps:
      # Sync state after restart
      - cli: "global_db flush"
      
      - wait: "5s"
  
  # Create master wallets and fund them
  # These are regular operations performed with seed_mode=false
  - group: Create master wallets and fund them
    defaults:
      node: root-1
    steps:
      # Create all wallets first
      - loop: 3
        steps:
          - set: master_idx = "{{i}}"
          - set: wallet_name = "stagenet_master_{{i}}"
          
          - cli: "wallet new -w {{wallet_name}}"
          
          - cli: "wallet info -w {{wallet_name}} -net stagenet"
            save_wallet: "master_wallet_addr_{{i}}"
      
      # Transfer tokens to master wallets
      - loop: 3
        steps:
          - set: master_idx = "{{i}}"
          - set: wallet_name = "stagenet_master_{{i}}"
          
          # Get wallet address dynamically
          - cli: "wallet info -w {{wallet_name}} -net stagenet"
            save_wallet: current_master_addr
          
          - cli: "tx_create -from_emission {{emission_hash}} -value 10000.0 -to_addr {{current_master_addr}} -token TCELL -chain zerochain -fee 1 -wallet_fee fee_collector"
            save_hash: "master_tx_{{i}}"
          
          # Wait for DAG-PoA consensus (15-20s per round)
          - wait: "25s"
      
      # CRITICAL: Wait for DAG-PoA to process ALL transfers into ledger
      # Finalized transactions are in mempool, need DAG rounds + consensus + ledger processing
      # This requires multiple round cycles (15s each) + ledger updates
      # Total: 3 transactions * ~20s/tx + buffer = 90s minimum
      - wait: "90s"
      
      # Force offline/online cycle to flush state
      - cli: "net go offline"
      - wait: "5s"
      
      - cli: "net go online"
      - wait: "10s"
  
  # Save genesis configuration for all nodes (root + master)
  # Update zerochain config with static genesis event
  - config: "{{network_name}}/zerochain"
    nodes: [root-1, root-2, root-3, master-1, master-2, master-3]
    set:
      static_genesis_event: "{{token_hash}}"
      is_static_genesis_event: "true"
  
  # Update mainchain config with fee address
  - config: "{{network_name}}/main"
    nodes: [root-1, root-2, root-3, master-1, master-2, master-3]
    set:
      fee_addr: "{{fee_addr}}"
  
  # Phase1 complete - genesis event created, emission done, wallets funded
  # Masters already running - continue directly to Phase2 for delegation
  # Seed mode properly managed: enabled for genesis, disabled for regular operations
