name: PHASE 1 - Zerochain Genesis
description: Initialize ROOT nodes, create token and emission

includes:
  - common/set_net_default.yml

network:
  topology: default
  name: stagenet

setup:
  - docker_op: start
    services: [root-1, root-2, root-3, master-1, master-2, master-3]
    detach: true
  
  - wait: "10s"
  
  - bash: |
      set -e
      
      TOOL=/opt/cellframe-node/bin/cellframe-node-tool
      NET=stagenet
      KTYPE=sig_dil
      
      if [ -f "docker-compose.generated.yml" ]; then
        STAGE_ENV_DIR="$(pwd)"
      elif [ -f "stage-env/docker-compose.generated.yml" ]; then
        STAGE_ENV_DIR="$(pwd)/stage-env"
      elif [ -f "tests/stage-env/docker-compose.generated.yml" ]; then
        STAGE_ENV_DIR="$(pwd)/tests/stage-env"
      elif [ -f "../stage-env/docker-compose.generated.yml" ]; then
        STAGE_ENV_DIR="$(cd ../stage-env && pwd)"
      elif [ -d "cache/configs" ]; then
        STAGE_ENV_DIR="$(pwd)"
      else
        echo "ERROR: Cannot find stage-env directory!"
        exit 1
      fi
      
      HOST_SHARED_CA="${STAGE_ENV_DIR}/cache/configs/shared/ca"
      mkdir -p "${HOST_SHARED_CA}"
      
      echo "Working directory: $(pwd)"
      echo "Stage-env directory: ${STAGE_ENV_DIR}"
      echo "Shared CA directory: ${HOST_SHARED_CA}"
      
      for i in 1 2; do
        idx=$((i-1))
        docker exec cellframe-stage-node-${i} ${TOOL} cert create ${NET}.root.pvt.${idx} ${KTYPE} || [ $? -eq 68 ] || exit $?
        docker exec cellframe-stage-node-${i} ${TOOL} cert create_cert_pkey ${NET}.root.pvt.${idx} ${NET}.root.${idx} || [ $? -eq 145 ] || exit $?
        docker cp cellframe-stage-node-${i}:/opt/cellframe-node/var/lib/ca/${NET}.root.${idx}.dcert "${HOST_SHARED_CA}/"
        echo "ROOT node-${i}: certificates created"
      done
      
      for i in 3 4 5; do
        idx=$((i-3))
        docker exec cellframe-stage-node-${i} ${TOOL} cert create ${NET}.master.pvt.${idx} ${KTYPE} || [ $? -eq 68 ] || exit $?
        docker exec cellframe-stage-node-${i} ${TOOL} cert create_cert_pkey ${NET}.master.pvt.${idx} ${NET}.master.${idx} || [ $? -eq 145 ] || exit $?
        docker cp cellframe-stage-node-${i}:/opt/cellframe-node/var/lib/ca/${NET}.master.${idx}.dcert "${HOST_SHARED_CA}/"
        echo "MASTER node-${i}: certificates created"
      done
      
      docker cp cellframe-stage-node-2:/opt/cellframe-node/var/lib/ca/stagenet.root.pvt.1.dcert /tmp/
      docker cp /tmp/stagenet.root.pvt.1.dcert cellframe-stage-node-1:/opt/cellframe-node/var/lib/ca/
      rm -f /tmp/stagenet.root.pvt.*.dcert
      echo "Private ROOT certs copied to root-1"
      
      echo "Shared CA directory contents:"
      ls -la "${HOST_SHARED_CA}/"
  
  - config: "stagenet"
    nodes: [node-1]
    set:
      events_sign_cert: "stagenet.root.pvt.0"
  
  - config: "stagenet"
    nodes: [node-2]
    set:
      events_sign_cert: "stagenet.root.pvt.1"
  
  - docker_op: restart
    services: [node-1, node-2, node-3, node-4, node-5, node-6]
  
  # First wait_network with placeholder validators_addrs (from template)
  - wait_network: online
    nodes: [node-1, node-2]
    timeout: 120
  
  - wait: "5s"

test:
  # Get ALL node addresses (network is now online)
  - group: Get node addresses
    steps:
      - cli: "node dump"
        node: node-1
        save_node: root_addr_0
      
      - cli: "node dump"
        node: node-2
        save_node: root_addr_1
      
      - cli: "node dump"
        node: node-3
        save_node: master_addr_0
      
      - cli: "node dump"
        node: node-4
        save_node: master_addr_1
      
      - cli: "node dump"
        node: node-5
        save_node: master_addr_2
      
      - cli: "node dump"
        node: node-6
        save_node: full_addr_0
  
  # Set real validators_addrs on ALL nodes
  - config: "stagenet/main"
    nodes: [node-1, node-2, node-3, node-4, node-5, node-6]
    set:
      validators_addrs: "[{{master_addr_0}},{{master_addr_1}},{{master_addr_2}}]"
  
  - bash: |
      echo "Creating authorized_nodes_addrs.cfg for all nodes..."
      for i in 1 2 3 4 5 6; do
        docker exec cellframe-stage-node-${i} mkdir -p /opt/cellframe-node/etc/network/stagenet.cfg.d/
        docker exec cellframe-stage-node-${i} /bin/bash -c "echo '[general]' > /opt/cellframe-node/etc/network/stagenet.cfg.d/authorized_nodes_addrs.cfg"
        docker exec cellframe-stage-node-${i} /bin/bash -c "echo 'authorized_nodes_addrs=[{{root_addr_0}},{{root_addr_1}}]' >> /opt/cellframe-node/etc/network/stagenet.cfg.d/authorized_nodes_addrs.cfg"
        docker exec cellframe-stage-node-${i} mkdir -p /opt/cellframe-node/etc/network/stagenet/zerochain.cfg.d/
        docker exec cellframe-stage-node-${i} /bin/bash -c "echo '[chain]' > /opt/cellframe-node/etc/network/stagenet/zerochain.cfg.d/authorized_nodes_addrs.cfg"
        docker exec cellframe-stage-node-${i} /bin/bash -c "echo 'authorized_nodes_addrs=[{{root_addr_0}},{{root_addr_1}}]' >> /opt/cellframe-node/etc/network/stagenet/zerochain.cfg.d/authorized_nodes_addrs.cfg"
        echo "Node ${i}: authorized_nodes_addrs.cfg created"
      done
  
  - docker_op: restart
    services: [node-1, node-2, node-3, node-4, node-5]
  
  - wait_network: online
    nodes: [node-1, node-2, node-3, node-4, node-5]
    timeout: 60
  
  - wait: "5s"
  
  - group: Add all nodes to nodelist
    defaults:
      node: node-1
    steps:
      - cli: "node add -net stagenet -addr {{root_addr_0}} -host {{node_ip['node1']}} -port 8079"
        save: node_add_result_1
        expect: success
      - cli: "node add -net stagenet -addr {{root_addr_1}} -host {{node_ip['node2']}} -port 8079"
        save: node_add_result_2
        expect: success
      - cli: "node add -net stagenet -addr {{master_addr_0}} -host {{node_ip['node3']}} -port 8079"
        save: node_add_result_3
        expect: success
      - cli: "node add -net stagenet -addr {{master_addr_1}} -host {{node_ip['node4']}} -port 8079"
        save: node_add_result_4
        expect: success
      - cli: "node add -net stagenet -addr {{master_addr_2}} -host {{node_ip['node5']}} -port 8079"
        save: node_add_result_5
        expect: success
      - cli: "node add -net stagenet -addr {{full_addr_0}} -host {{node_ip['node6']}} -port 8079"
        save: node_add_result_6
        expect: success
  
  - cli: "node list -net stagenet"
    node: node-1
    save: node_list_after_add
  
  - bash: |
      echo "Node list after add:"
      echo "{{node_list_after_add}}"
      if echo "{{node_list_after_add}}" | grep -q "No records"; then
        echo "ERROR: No nodes in node list!"
        exit 1
      fi
      echo "Node list OK - nodes were added successfully"
  
  # validators_addrs already configured via config: step above
  - bash: |
      echo "Creating wallets for all nodes..."
      for i in 1 2 3 4 5 6; do
        if [ $i -le 2 ]; then
          NODE_TYPE="root"
          TYPE_IDX=$((i-1))
        elif [ $i -le 5 ]; then
          NODE_TYPE="master"
          TYPE_IDX=$((i-3))
        else
          NODE_TYPE="full"
          TYPE_IDX=0
        fi
        
        WALLET_NAME="stagenet_${NODE_TYPE}_${TYPE_IDX}"
        
        docker exec cellframe-stage-node-${i} cellframe-node-cli wallet new -w ${WALLET_NAME} -sign sig_dil 2>&1 | grep -q "wallet.*created" || true
        
        WALLET_ADDR=$(docker exec cellframe-stage-node-${i} cellframe-node-cli wallet info -w ${WALLET_NAME} -net stagenet 2>&1 | grep "addr:" | grep -oE 'pt[A-Za-z0-9]{100,120}')
        if [ -n "$WALLET_ADDR" ]; then
          docker exec cellframe-stage-node-${i} sed -i "s/fee_addr=/fee_addr=${WALLET_ADDR}/" /opt/cellframe-node/etc/network/stagenet.cfg
        fi
        echo "Node ${i}: wallet ${WALLET_NAME} configured"
      done
      echo "Done creating wallets for all nodes"
  
  - cli: "wallet info -w stagenet_root_0"
    node: node-1
    save_wallet: fee_addr
  
  - config: "cellframe-node"
    nodes: [node-1, node-2, node-3]
    set:
      seed_mode: "true"
  
  - docker_op: restart
    services: [node-1, node-2, node-3, node-4, node-5]
  
  - wait_network: online
    nodes: [node-1, node-2, node-3, node-4, node-5]
    timeout: 60
  
  - wait: "40s"

  - group: Genesis Event - Token Declaration
    defaults:
      node: node-1
    steps:
      - cli: "token_decl -token TCELL -chain zerochain -total_supply 0 -decimals 18 -signs_emission 2 -signs_total 2 -type CF20 -certs stagenet.root.pvt.0,stagenet.root.pvt.1"
        save_hash: token_hash
      
      - wait: "3s"
      
      - cli: "mempool proc -net stagenet -chain zerochain -datum {{token_hash}}"
        node: node-1
      
      - wait: "2s"
      - wait: "30s"
      
      - cli: "token list"
        node: node-1
        expect_output: "tokens: 1"
      
      - cli: "global_db flush"
        node: node-1
      
      - wait: "5s"
      
      - cli: "dag event last -net stagenet -chain zerochain"
        node: node-1
        save_hash: genesis_event_hash
  
  - config: "stagenet/zerochain"
    nodes: [node-1, node-2, node-3, node-4, node-5]
    set:
      static_genesis_event: "{{genesis_event_hash}}"
      is_static_genesis_event: "true"
  
  - cli: "srv_stake order create -net stagenet -value 0.05e+18 -cert stagenet.master.pvt.0"
    node: node-3
    expect: success
  
  - docker_op: restart
    services: [node-1, node-2, node-3, node-4, node-5]
  
  - wait_network: online
    nodes: [node-1, node-2, node-3, node-4, node-5]
    timeout: 60
  
  - wait: "40s"
  
  - config: "stagenet/zerochain"
    nodes: [node-1, node-2]
    set:
      static_genesis_event: "{{genesis_event_hash}}"
      is_static_genesis_event: "true"
  
  - wait_network: online
    nodes: [node-1, node-2]
    timeout: 60
  
  - wait: "10s"
  
  - group: Token Emission
    defaults:
      node: node-1
    steps:
      - cli: "token_emit -net stagenet -chain zerochain -token TCELL -no_base_tx -emission_value 10.0e+54 -addr {{fee_addr}} -certs stagenet.root.pvt.0"
        save_hash: emission_datum_hash
      
      - wait: "15s"
      
      - cli: "mempool check -net stagenet -chain zerochain -datum {{emission_datum_hash}}"
        node: node-2
        save: mempool_check_result
      
      - cli: "token_emit sign -net stagenet -chain zerochain -emission {{emission_datum_hash}} -certs stagenet.root.pvt.1"
        node: node-2
        save: token_emit_sign_output
      
      - bash: |
          OUTPUT='{{token_emit_sign_output}}'
          HASH=$(echo "$OUTPUT" | grep -oE '0x[a-fA-F0-9]{64}' | grep -v "{{emission_datum_hash}}" | tr -d '[:space:]')
          if [ -z "$HASH" ]; then
            HASH=$(echo "$OUTPUT" | grep -oE '0x[a-fA-F0-9]{64}')
          fi
          echo "$HASH"
        save: signed_emission_hash
      
      - wait: "15s"
      
      - cli: "dag event last -net stagenet -chain zerochain"
        node: node-1
        save_hash: last_event_before_emission
      
      - cli: "mempool proc -net stagenet -chain zerochain -datum {{signed_emission_hash}}"
        node: node-1
        save: mempool_proc_output
      
      - wait: "30s"
      
      - cli: "dag event last -net stagenet -chain zerochain"
        node: node-1
        save_hash: emission_event_hash
      
      - cli: "dag event dump -net stagenet -chain zerochain -event {{emission_event_hash}} -from events"
        node: node-1
        save: emission_event_dump
      
      - bash: |
          DUMP='{{emission_event_dump}}'
          HASH=$(echo "$DUMP" | grep -oE 'emission_hash: 0x[a-fA-F0-9]+' | sed 's/emission_hash: //' | tr -d '[:space:]')
          if [ -z "$HASH" ]; then
            echo "ERROR: emission_hash not found in event dump" >&2
            echo "Event dump: $DUMP"
            exit 1
          fi
          echo "$HASH"
        save: emission_hash
  
  - cli: "dag event list -chain zerochain"
    node: node-1
  
  - cli: "dag event last -net stagenet -chain zerochain"
    node: node-1
