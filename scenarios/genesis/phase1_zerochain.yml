name: PHASE 1 - Zerochain Genesis
description: Initialize ROOT nodes, create token and emission

includes:
  - common/set_net_default.yml

network:
  topology: default
  name: stagenet

setup:
  - docker_op: start
    services: [root-1, root-2, root-3, master-1, master-2, master-3]
    detach: true
  
  - wait: "10s"
  
  - bash: |
      set -e
      
      NET=stagenet
      
      echo "=== Verifying pre-generated certificates ==="
      echo "Certificates were generated by cf-cert-generator before container startup"
      
      for i in 1 2; do
        idx=$((i-1))
        echo "Checking ROOT node-${i} certificates..."
        docker exec cellframe-stage-node-${i} ls -la /opt/cellframe-node/var/lib/ca/ || true
        if docker exec cellframe-stage-node-${i} test -f "/opt/cellframe-node/var/lib/ca/${NET}.root.pvt.${idx}.dcert"; then
          echo "  ✓ Private cert ${NET}.root.pvt.${idx}.dcert found"
        else
          echo "  ✗ ERROR: Private cert ${NET}.root.pvt.${idx}.dcert NOT found!"
          exit 1
        fi
      done
      
      for i in 3 4 5; do
        idx=$((i-3))
        echo "Checking MASTER node-${i} certificates..."
        if docker exec cellframe-stage-node-${i} test -f "/opt/cellframe-node/var/lib/ca/${NET}.master.pvt.${idx}.dcert"; then
          echo "  ✓ Private cert ${NET}.master.pvt.${idx}.dcert found"
        else
          echo "  ✗ ERROR: Private cert ${NET}.master.pvt.${idx}.dcert NOT found!"
          exit 1
        fi
      done
      
      echo "=== Copying root-2 private cert to root-1 for multi-signature ==="
      docker cp cellframe-stage-node-2:/opt/cellframe-node/var/lib/ca/stagenet.root.pvt.1.dcert /tmp/
      docker cp /tmp/stagenet.root.pvt.1.dcert cellframe-stage-node-1:/opt/cellframe-node/var/lib/ca/
      rm -f /tmp/stagenet.root.pvt.*.dcert
      echo "Private ROOT certs copied to root-1 for multi-signature"
      
      echo "=== Shared CA directory contents ==="
      docker exec cellframe-stage-node-1 ls -la /opt/cellframe-node/share/ca/ || true
      
      echo "=== Certificate verification complete ==="
  
  - config: "stagenet"
    nodes: [node-1]
    set:
      events_sign_cert: "stagenet.root.pvt.0"
  
  - config: "stagenet"
    nodes: [node-2]
    set:
      events_sign_cert: "stagenet.root.pvt.1"
  
  - docker_op: restart
    services: [node-1, node-2, node-3, node-4, node-5, node-6]
  
  - wait_network: online
    nodes: [node-1, node-2]
    timeout: 120
  
  - wait: "5s"

test:
  # Get ALL node addresses (network is now online)
  - group: Get node addresses
    steps:
      - cli: "node dump"
        node: node-1
        save_node: root_addr_0
      
      - cli: "node dump"
        node: node-2
        save_node: root_addr_1
      
      - cli: "node dump"
        node: node-3
        save_node: master_addr_0
      
      - cli: "node dump"
        node: node-4
        save_node: master_addr_1
      
      - cli: "node dump"
        node: node-5
        save_node: master_addr_2
      
      - cli: "node dump"
        node: node-6
        save_node: full_addr_0
  
  # Set real validators_addrs on ALL nodes
  - config: "stagenet/main"
    nodes: [node-1, node-2, node-3, node-4, node-5, node-6]
    set:
      validators_addrs: "[{{master_addr_0}},{{master_addr_1}},{{master_addr_2}}]"
  
  # Set authorized_nodes_addrs in ZEROCHAIN config (root nodes have special permissions)
  - config: "stagenet/zerochain"
    nodes: [node-1, node-2, node-3, node-4, node-5, node-6]
    set:
      authorized_nodes_addrs: "[{{root_addr_0}},{{root_addr_1}}]"
  
  - docker_op: restart
    services: [node-1, node-2, node-3, node-4, node-5]
  
  - wait_network: online
    nodes: [node-1, node-2, node-3, node-4, node-5]
    timeout: 60
  
  - wait: "5s"
  
  # Add all nodes to nodelist
  # Note: -net and -port are applied automatically from defaults
  - group: Add all nodes to nodelist
    defaults:
      node: node-1
    steps:
      - cli: "node add -addr {{root_addr_0}} -host {{node_ip['node1']}}"
        contains: "Successfully"
        save: node_add_result_1
      - cli: "node add -addr {{root_addr_1}} -host {{node_ip['node2']}}"
        contains: "Successfully"
        save: node_add_result_2
      - cli: "node add -addr {{master_addr_0}} -host {{node_ip['node3']}}"
        contains: "Successfully"
        save: node_add_result_3
      - cli: "node add -addr {{master_addr_1}} -host {{node_ip['node4']}}"
        contains: "Successfully"
        save: node_add_result_4
      - cli: "node add -addr {{master_addr_2}} -host {{node_ip['node5']}}"
        contains: "Successfully"
        save: node_add_result_5
      - cli: "node add -addr {{full_addr_0}} -host {{node_ip['node6']}}"
        contains: "Successfully"
        save: node_add_result_6
  
  - wait: "5s"
  
  - cli: "node list"
    node: node-1
    not_contains: "No records"
    save: node_list_after_add
  
  # Create wallets for all nodes
  - group: Create wallets
    defaults:
      cli:
        sign: "sig_dil"
    steps:
      - cli: "wallet new -w stagenet_root_0"
        node: node-1
      - cli: "wallet new -w stagenet_root_1"
        node: node-2
      - cli: "wallet new -w stagenet_master_0"
        node: node-3
      - cli: "wallet new -w stagenet_master_1"
        node: node-4
      - cli: "wallet new -w stagenet_master_2"
        node: node-5
      - cli: "wallet new -w stagenet_full_0"
        node: node-6
  
  # Get fee_addr from root_0 wallet for emission target
  - cli: "wallet info -w stagenet_root_0"
    node: node-1
    save_wallet: fee_addr
  
  # Set fee_addr on master nodes (validators collect fees)
  - config: "stagenet"
    nodes: [node-3, node-4, node-5]
    set:
      fee_addr: "{{fee_addr}}"
  
  - config: "cellframe-node"
    nodes: [node-1, node-2, node-3]
    set:
      seed_mode: "true"
  
  # CRITICAL: Enable is_add_directly for genesis event creation
  - config: "stagenet/zerochain"
    nodes: [node-1, node-2, node-3]
    set:
      is_add_directly: "true"
  
  - docker_op: restart
    services: [node-1, node-2, node-3, node-4, node-5]
  
  - wait_network: online
    nodes: [node-1, node-2, node-3, node-4, node-5]
    timeout: 60
  
  - wait: "40s"

  - group: Genesis Event - Token Declaration
    defaults:
      node: node-1
      cli:
        chain: "zerochain"
    steps:
      - cli: "token_decl -token TCELL -total_supply 0 -decimals 18 -signs_emission 2 -signs_total 2 -type CF20 -certs stagenet.root.pvt.0,stagenet.root.pvt.1"
        save_hash: token_hash
      
      - wait: "3s"
      
      - cli: "mempool proc -datum {{token_hash}}"
      
      - wait: "2s"
      - wait: "30s"
      
      - cli: "token list"
        expect_output: "tokens: 1"
      
      - cli: "global_db flush"
      
      - wait: "5s"
      
      - cli: "dag event last -chain zerochain"
        save_hash: genesis_event_hash
  
  # Set static genesis event and DISABLE is_add_directly for normal consensus
  - config: "stagenet/zerochain"
    nodes: [node-1, node-2, node-3, node-4, node-5]
    set:
      static_genesis_event: "{{genesis_event_hash}}"
      is_static_genesis_event: "true"
      is_add_directly: "false"
  
  # Disable seed_mode for production operation
  - config: "cellframe-node"
    nodes: [node-1, node-2, node-3]
    set:
      seed_mode: "false"
  
  - group: Create stake orders for validators
    defaults:
      cli:
        value: "0.05e+18"
    steps:
      - cli: "srv_stake order create -cert stagenet.master.pvt.0"
        node: node-3
        expect: success

      - cli: "srv_stake order create -cert stagenet.master.pvt.1"
        node: node-4
        expect: success

      - cli: "srv_stake order create -cert stagenet.master.pvt.2"
        node: node-5
        expect: success
  
  - docker_op: restart
    services: [node-1, node-2, node-3, node-4, node-5]
  
  - wait_network: online
    nodes: [node-1, node-2, node-3, node-4, node-5]
    timeout: 60
  
  - wait: "40s"
  
  - config: "stagenet/zerochain"
    nodes: [node-1, node-2]
    set:
      static_genesis_event: "{{genesis_event_hash}}"
      is_static_genesis_event: "true"
      is_add_directly: "false"
  
  - wait_network: online
    nodes: [node-1, node-2]
    timeout: 60
  
  - wait: "10s"
  
  - group: Token Emission
    defaults:
      node: node-1
      cli:
        chain: "zerochain"
        token: "TCELL"
    steps:
      - cli: "token_emit -no_base_tx -emission_value 10.0e+54 -addr {{fee_addr}} -certs stagenet.root.pvt.0"
        save_hash: emission_datum_hash
      
      - wait: "15s"
      
      - cli: "mempool check -datum {{emission_datum_hash}}"
        node: node-2
        save: mempool_check_result
      
      - cli: "token_emit sign -emission {{emission_datum_hash}} -certs stagenet.root.pvt.1"
        node: node-2
        save_hash: signed_emission_hash
      
      - wait: "15s"
      
      - cli: "dag event last"
        save_hash: last_event_before_emission
      
      - cli: "mempool proc -datum {{signed_emission_hash}}"
        save: mempool_proc_output
      
      - wait: "30s"
      
      - cli: "dag event last"
        save_hash: emission_event_hash
      
      - cli: "dag event dump -event {{emission_event_hash}} -from events"
        save: emission_event_dump
      
      - python: |
          import re
          dump = ctx.get('emission_event_dump', '')
          match = re.search(r'emission_hash:\s*(0x[a-fA-F0-9]+)', dump)
          if not match:
              raise ValueError(f"emission_hash not found in event dump: {dump[:500]}")
          result = match.group(1)
        save: emission_hash
  
  - cli: "dag event list -chain zerochain"
    node: node-1
  
  - cli: "dag event last -chain zerochain"
    node: node-1
