name: PHASE 1 - Zerochain Genesis
description: Initialize ROOT nodes, create token and emission

includes:
  - common/set_net_default.yml

network:
  topology: default
  name: stagenet

setup:

  # Enable seed_mode for ROOT nodes and MASTER[0] (like tests-in-docker)
  # tests-in-docker: _seed_mode "${ROOT[0]}" on; _seed_mode "${ROOT[1]}" on; _seed_mode "${MASTER[0]}" on
  # seed_mode is required for order create to work on master node
  - config: "cellframe-node"
    nodes: [root-1, root-2, root-3, master-1]
    set:
      seed_mode: "true"

  # Start ALL nodes (like tests-in-docker)
  # Nodes start but network won't initialize until certs exist
  - docker_op: start
    services: [root-1, root-2, root-3, master-1, master-2, master-3]
    detach: true
  
  # Wait for CLI to be ready (not network - it won't work without certs)
  - wait: cli_ready
    nodes: [root-1, root-2, root-3, master-1, master-2, master-3]
    timeout: 60
  
  # CRITICAL: Create certificates INSIDE containers (like tests-in-docker)
  # Uses cellframe-node-tool directly (not CLI which doesn't support 'tool' command)
  # NOTE: /share/ca is mounted read-only, so we copy public certs to HOST shared directory
  - bash: |
      TOOL=/opt/cellframe-node/bin/cellframe-node-tool
      NET=stagenet
      KTYPE=sig_dil
      
      # Host path for shared CA (mounted as :ro inside containers)
      HOST_SHARED_CA="$(pwd)/cache/configs/shared/ca"
      mkdir -p "${HOST_SHARED_CA}"
      
      # ROOT nodes (1,2,3): create node-addr and pvt.stagenet.root.N certificates
      for i in 1 2 3; do
        idx=$((i-1))
        docker exec cellframe-stage-node-${i} ${TOOL} cert create node-addr ${KTYPE}
        docker exec cellframe-stage-node-${i} ${TOOL} cert create pvt.${NET}.root.${idx} ${KTYPE}
        docker exec cellframe-stage-node-${i} ${TOOL} cert create_cert_pkey pvt.${NET}.root.${idx} ${NET}.root.${idx}
        # Copy public cert to HOST shared ca directory
        docker cp cellframe-stage-node-${i}:/opt/cellframe-node/var/lib/ca/${NET}.root.${idx}.dcert "${HOST_SHARED_CA}/"
        echo "ROOT node-${i}: certificates created"
      done
      
      # MASTER nodes (4,5,6): create node-addr and pvt.stagenet.master.N certificates
      for i in 4 5 6; do
        idx=$((i-4))
        docker exec cellframe-stage-node-${i} ${TOOL} cert create node-addr ${KTYPE}
        docker exec cellframe-stage-node-${i} ${TOOL} cert create pvt.${NET}.master.${idx} ${KTYPE}
        docker exec cellframe-stage-node-${i} ${TOOL} cert create_cert_pkey pvt.${NET}.master.${idx} ${NET}.master.${idx}
        # Copy public cert to HOST shared ca directory
        docker cp cellframe-stage-node-${i}:/opt/cellframe-node/var/lib/ca/${NET}.master.${idx}.dcert "${HOST_SHARED_CA}/"
        echo "MASTER node-${i}: certificates created"
      done
      
      # Copy ALL pvt.stagenet.root.* certs to root-1 for centralized genesis (threshold 2/3)
      docker cp cellframe-stage-node-2:/opt/cellframe-node/var/lib/ca/pvt.stagenet.root.1.dcert /tmp/
      docker cp /tmp/pvt.stagenet.root.1.dcert cellframe-stage-node-1:/opt/cellframe-node/var/lib/ca/
      docker cp cellframe-stage-node-3:/opt/cellframe-node/var/lib/ca/pvt.stagenet.root.2.dcert /tmp/
      docker cp /tmp/pvt.stagenet.root.2.dcert cellframe-stage-node-1:/opt/cellframe-node/var/lib/ca/
      rm -f /tmp/pvt.stagenet.root.*.dcert
      echo "Private ROOT certs copied to root-1"
      
      # List what's in shared ca
      echo "Shared CA directory contents:"
      ls -la "${HOST_SHARED_CA}/"
  
  # CRITICAL: Restart nodes after creating certificates (like tests-in-docker _restart)
  # Network will now find certificates and initialize properly
  - docker_op: restart
    services: [root-1, root-2, root-3, master-1, master-2, master-3]
  
  # Now wait for network to be ONLINE (certs exist, network can initialize)
  - wait_network: online
    nodes: [root-1, root-2, root-3, master-1, master-2, master-3]
    timeout: 120
  
  # Allow brief stabilization after restart
  - wait: "5s"

test:
  # Register ROOT nodes - get addresses (IPs already in context as node_ip map)
  # Available: node_ip['node1'], node_ip['node2'], node_ip['node3']
  # Or as array: node_ips[0], node_ips[1], node_ips[2]
  - group: Get node addresses
    steps:
      - cli: "node dump"
        node: root-1
        save_node: root_addr_0
      
      - cli: "node dump"
        node: root-2
        save_node: root_addr_1
      
      - cli: "node dump"
        node: root-3
        save_node: root_addr_2
  
  # CRITICAL: Create authorized_nodes_addrs.cfg with ROOT node addresses
  # This is REQUIRED for node add command to work (dap_chain_net_is_my_node_authorized check)
  # Based on tests-in-docker approach (lines 129-134 in testnet.sh)
  - bash: |
      echo "Creating authorized_nodes_addrs.cfg for all nodes..."
      for i in 1 2 3 4 5 6; do
        docker exec cellframe-stage-node-${i} mkdir -p /opt/cellframe-node/etc/network/stagenet/zerochain.cfg.d/
        docker exec cellframe-stage-node-${i} /bin/bash -c "echo '[chain]' > /opt/cellframe-node/etc/network/stagenet/zerochain.cfg.d/authorized_nodes_addrs.cfg"
        docker exec cellframe-stage-node-${i} /bin/bash -c "echo 'authorized_nodes_addrs=[{{root_addr_0}},{{root_addr_1}},{{root_addr_2}}]' >> /opt/cellframe-node/etc/network/stagenet/zerochain.cfg.d/authorized_nodes_addrs.cfg"
        echo "Node ${i}: authorized_nodes_addrs.cfg created"
      done
      echo "Done creating authorized_nodes_addrs.cfg"
  
  # Restart to load authorized_nodes_addrs
  - docker_op: restart
    services: [root-1, root-2, root-3, master-1, master-2, master-3]
  
  # Wait for nodes to come back online
  - wait_network: online
    nodes: [root-1, root-2, root-3, master-1, master-2, master-3]
    timeout: 120
  
  # Register all nodes on each root node with IP and port (each node registers others, not itself)
  # Using node_ip map for readable access by node ID
  - group: Register nodes on root-1
    defaults:
      node: root-1
    steps:
      # root-1 registers root-2 and root-3 with their IP addresses and ports
      - cli: "node add -addr {{root_addr_1}} -alias root-2 -host {{node_ip['node2']}} -port 8079"
      - cli: "node add -addr {{root_addr_2}} -alias root-3 -host {{node_ip['node3']}} -port 8079"
  
  - group: Register nodes on root-2
    defaults:
      node: root-2
    steps:
      # root-2 registers root-1 and root-3 with their IP addresses and ports
      - cli: "node add -addr {{root_addr_0}} -alias root-1 -host {{node_ip['node1']}} -port 8079"
      - cli: "node add -addr {{root_addr_2}} -alias root-3 -host {{node_ip['node3']}} -port 8079"
  
  - group: Register nodes on root-3
    defaults:
      node: root-3
    steps:
      # root-3 registers root-1 and root-2 with their IP addresses and ports
      - cli: "node add -addr {{root_addr_0}} -alias root-1 -host {{node_ip['node1']}} -port 8079"
      - cli: "node add -addr {{root_addr_1}} -alias root-2 -host {{node_ip['node2']}} -port 8079"
  
  # Establish links via soft reconnect (offline/online cycle)
  - group: Soft reconnect - offline
    steps:
      - cli: "net go offline"
        node: root-1
      - cli: "net go offline"
        node: root-2
      - cli: "net go offline"
        node: root-3
  
  # Wait for nodes to reach offline state
  - wait_network: offline
    nodes: [root-1, root-2, root-3]
    timeout: 60
  
  - group: Soft reconnect - online
    steps:
      - cli: "net go online"
        node: root-1
      - cli: "net go online"
        node: root-2
      - cli: "net go online"
        node: root-3
  
  - wait_network: links_established
    nodes: [root-1, root-2, root-3]
    timeout: 120
  
  # Wait for CLI to be responsive on all root nodes
  - wait: cli_ready
    nodes: [root-1, root-2, root-3]
    timeout: 40

  # Create fee wallet (preparatory step, not genesis operation)
  - cli: "wallet new -w fee_collector"
    node: root-1
  
  # Get fee wallet address
  - cli: "wallet info -w fee_collector"
    node: root-1
    save_wallet: fee_addr

  # =================================================================
  # GENESIS EVENT CREATION IN SEED MODE
  # =================================================================
  # ROOT nodes started with seed_mode=true 
  # Only token_decl is the genesis event - everything else happens after seed_mode is disabled
  
  
  # GENESIS OPERATION: Create TCELL token declaration with 2/3 consensus
  # This is the ONLY genesis event for zerochain - signed by all 3 root validators
  - group: Genesis Event - Token Declaration
    defaults:
      node: root-1
    steps:
      - cli: "token_decl -token TCELL -chain zerochain -total_supply 1000000.0e+18 -decimals 18 -signs_emission 2 -signs_total 3 -certs pvt.stagenet.root.0,pvt.stagenet.root.1,pvt.stagenet.root.2"
        save_hash: token_hash
      
      # Allow propagation
      - wait: "3s"
      
      # CRITICAL: Process mempool to add token to DAG
      # Specify datum hash to trigger processing with auto_confirmation
      - cli: "mempool proc -net stagenet -chain zerochain -datum {{token_hash}}"
        node: root-1
      
      - wait: "2s"

      # Wait for DAG-PoA round to complete (typically 15-20s with 3 root nodes)
      # Note: datum may remain in mempool after finalization due to node behavior
      # We wait and verify via token list instead of mempool check
      - wait: "30s"
      
      # Verify token was created in ledger
      - cli: "token list"
        node: root-1
        expect_output: "tokens: 1"
      
      # Flush GDB to ensure token is synced
      - cli: "global_db flush"
        node: root-1
      
      - wait: "5s"
      
      # GENESIS OPERATION: Create emission in seed_mode
      # This ensures emission is created before restart and token is in ledger
      - cli: "token_emit -chain zerochain -token TCELL -emission_value 1000000.0e+18 -addr {{fee_addr}} -certs pvt.stagenet.root.0,pvt.stagenet.root.1,pvt.stagenet.root.2"
        save_hash: emission_hash
        expect: success
      
      - wait: "5s"
      
      # Process emission in mempool with specific datum hash
      # This triggers auto_confirmation from other ROOT nodes
      - cli: "mempool proc -net stagenet -chain zerochain -datum {{emission_hash}}"
        node: root-1
      - wait: "5s"
      
      # Wait for emission to be finalized (DAG-PoA consensus needs ~20-30s for round)
      # CRITICAL: Emission MUST be in DAG before restart, otherwise it will be lost!
      - wait: "45s"
      
      # Verify emission is finalized by checking DAG events count (should be 2: token + emission)
      - cli: "dag event list -chain zerochain"
        node: root-1
        expect_output: "total_events: 2"
      
      # CRITICAL: Get the FIRST EVENT HASH (genesis) from DAG
      # Event hash != datum hash! Event includes signatures, timestamps, etc.
      # Use dag event find to get the event hash that contains token datum
      - cli: "dag event find -chain zerochain -datum {{token_hash}}"
        node: root-1
        save_hash: genesis_event_hash
  
  # Genesis events (token + emission) created! Set static genesis hash
  # NOTE: seed_mode stays ON - will be disabled AFTER order_create (like tests-in-docker)
  
  - config: "stagenet/zerochain"
    nodes: [root-1, root-2, root-3, master-1, master-2, master-3]
    set:
      static_genesis_event: "{{genesis_event_hash}}"
      is_static_genesis_event: "true"
  
  # Restart ALL nodes to apply new configs (like tests-in-docker _restart)
  - docker_op: restart
    services: [root-1, root-2, root-3, master-1, master-2, master-3]
  
  - wait_network: online
    nodes: [root-1, root-2, root-3, master-1, master-2, master-3]
    timeout: 60
  
  # Wait for nodes to stabilize and sync (tests-in-docker waits 40s after restart)
  - wait: "40s"
  
  # CRITICAL: Create validator order AFTER restart and stabilization
  # This order is stored in GlobalDB and is required for ESBocs to start validator mode
  # Without this order, ESBocs will show "No valid order found" and disable validator mode
  # Must be created AFTER nodes are synced with token in ledger
  - cli: "srv_stake order create -value 0.05e+18 -cert pvt.stagenet.master.0"
    node: master-1
  
  # Restart master-1 to pick up the order before Phase 2
  - docker_op: restart
    services: [master-1]
  
  - wait_network: online
    nodes: [master-1]
    timeout: 60
  
  # Wait for CLI to be responsive
  - wait: cli_ready
    nodes: [root-1, root-2, root-3, master-1, master-2, master-3]
    timeout: 40
  
  # NOW disable seed_mode (like tests-in-docker does AFTER order_create)
  - config: "cellframe-node"
    nodes: [root-1, root-2, root-3, master-1]
    set:
      seed_mode: "false"
  
  # Restart to apply seed_mode=false
  - docker_op: restart
    services: [root-1, root-2, root-3, master-1, master-2, master-3]
  
  - wait_network: online
    nodes: [root-1, root-2, root-3, master-1, master-2, master-3]
    timeout: 60
  
  - wait: "40s"
  
  # Sync GDB and mempool after restart to ensure all nodes are synchronized
  - group: GDB and Mempool sync
    steps:
      - loop: 3
        steps:
          - set: node_name = "root-{{iteration}}"
          - cli: "global_db sync -net stagenet"
            node: "{{node_name}}"
      
      - wait: "5s"
      
      - loop: 3
        steps:
          - set: node_name = "root-{{iteration}}"
          - cli: "mempool proc -net stagenet -chain zerochain"
            node: "{{node_name}}"
      
      - wait: "5s"
  
  # =================================================================
  # PHASE 1 COMPLETE - Genesis Event Created
  # =================================================================
  # Token declaration and emission are in DAG (zerochain).
  # Wallet funding will be done in Phase 2 or later via main chain (ESBOCS).
  # 
  # IMPORTANT: Regular transactions (tx_create) should go to main chain, not zerochain!
  # - zerochain (DAG-PoA): administrative operations (token, emission, decree)
  # - main chain (ESBOCS): user transactions (tx_create, stake_lock, etc.)
  
  - wait: "10s"
  
  # Create master wallets on their respective nodes (wallets are needed for Phase 2)
  - group: Create master wallets on their respective nodes
    steps:
      - loop: 3
        steps:
          - set: master_idx = "{{i}}"
          - set: master_node = "master-{{iteration}}"
          - set: wallet_name = "stagenet_master_{{i}}"
          
          # Create wallet on the master node itself
          - cli: "wallet new -w {{wallet_name}}"
            node: "{{master_node}}"
          
          # Get wallet address from the master node
          - cli: "wallet info -w {{wallet_name}} -net stagenet"
            node: "{{master_node}}"
            save_wallet: "master_wallet_addr_{{i}}"
  
  # Phase1 complete - genesis event created, emission done, master wallets created
  # All nodes running with seed_mode=false and static_genesis_event set
  # Continue to Phase2 for:
  # 1. Create genesis block on main chain (bx_create from emission)
  # 2. srv_stake delegate for validators (optional - order already created)
