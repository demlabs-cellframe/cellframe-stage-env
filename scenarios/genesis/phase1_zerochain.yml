name: PHASE 1 - Zerochain Genesis
description: Initialize ROOT nodes, create token and emission (dynamic topology)

includes:
  - common/set_net_default.yml

network:
  topology: default
  name: "{{network_name}}"

setup:
  # Start all nodes dynamically based on topology
  - docker_op: start
    services: "{{all_nodes}}"
    detach: true
  
  - wait: "10s"
  
  # Verify ROOT node certificates exist
  - group: Verify ROOT node certificates
    steps:
      - for: node_idx
        in: "{{root_indices}}"
        steps:
          - set: _cert_idx
            value: "node_idx - 1"
            eval: true
          - set: _cert_path
            value: "/opt/cellframe-node/var/lib/ca/{{network_name}}.root.pvt.{{_cert_idx}}.dcert"
          - set: _check_node
            value: "node-{{node_idx}}"
          - bash: "test -f {{_cert_path}} && echo '✓ ROOT cert found: {{_cert_path}}'"
            node: "{{_check_node}}"
  
  # Verify MASTER node certificates exist
  - group: Verify MASTER node certificates
    steps:
      - for: node_idx
        in: "{{master_indices}}"
        steps:
          - set: _cert_idx
            value: "node_idx - root_count - 1"
            eval: true
          - set: _cert_path
            value: "/opt/cellframe-node/var/lib/ca/{{network_name}}.master.pvt.{{_cert_idx}}.dcert"
          - set: _check_node
            value: "node-{{node_idx}}"
          - bash: "test -f {{_cert_path}} && echo '✓ MASTER cert found: {{_cert_path}}'"
            node: "{{_check_node}}"
  
  # Copy all root private certs to first root node for multi-signature
  - group: Copy root certs to node-1 for multi-signature
    steps:
      - for: cert_idx
        in: "range(1, root_count)"
        steps:
          - set: _src_node_id
            value: "cert_idx + 1"
            eval: true
          - set: _cert_name
            value: "{{network_name}}.root.pvt.{{cert_idx}}.dcert"
          - set: _cert_path
            value: "/opt/cellframe-node/var/lib/ca/{{_cert_name}}"
          - docker_op: cp
            src: "node-{{_src_node_id}}:{{_cert_path}}"
            dst: "node-1:{{_cert_path}}"
  
  # Configure events_sign_cert for each ROOT node
  - for: node_idx
    in: "{{root_indices}}"
    steps:
      - set: _cert_idx
        value: "node_idx - 1"
        eval: true
      - set: _current_node
        value: "node-{{node_idx}}"
      - set: _current_cert
        value: "{{network_name}}.root.pvt.{{_cert_idx}}"
      - config: "{{network_name}}"
        nodes: ["{{_current_node}}"]
        set:
          events_sign_cert: "{{_current_cert}}"
  
  - docker_op: restart
    services: "{{all_nodes}}"
  
  - wait_network: online
    nodes: "{{root_nodes}}"
    timeout: 120
  
  - wait: "5s"

test:
  # Get ALL node addresses dynamically
  - group: Get node addresses
    steps:
      - for: node_idx
        in: "{{root_indices}}"
        steps:
          - set: _addr_idx
            value: "node_idx - 1"
            eval: true
          - set: _node_name
            value: "node-{{node_idx}}"
          - set: _addr_var
            value: "root_addr_{{_addr_idx}}"
          - cli: "node dump"
            node: "{{_node_name}}"
            save_node: "{{_addr_var}}"
      
      - for: node_idx
        in: "{{master_indices}}"
        steps:
          - set: _addr_idx
            value: "node_idx - root_count - 1"
            eval: true
          - set: _node_name
            value: "node-{{node_idx}}"
          - set: _addr_var
            value: "master_addr_{{_addr_idx}}"
          - cli: "node dump"
            node: "{{_node_name}}"
            save_node: "{{_addr_var}}"
      
      - for: node_idx
        in: "{{full_indices}}"
        steps:
          - set: _addr_idx
            value: "node_idx - root_count - master_count - 1"
            eval: true
          - set: _node_name
            value: "node-{{node_idx}}"
          - set: _addr_var
            value: "full_addr_{{_addr_idx}}"
          - cli: "node dump"
            node: "{{_node_name}}"
            save_node: "{{_addr_var}}"
  
  # Build validators_addrs dynamically from master node addresses
  - set: validators_addrs_str
    value: "join_vars_bracket('master_addr_', master_count)"
    eval: true
  
  # Build authorized_nodes_addrs from root node addresses
  - set: authorized_nodes_str
    value: "join_vars_bracket('root_addr_', root_count)"
    eval: true
  
  # Set validators_addrs on ALL nodes
  - config: "{{network_name}}/main"
    nodes: "{{all_nodes}}"
    set:
      validators_addrs: "{{validators_addrs_str}}"
  
  # Set authorized_nodes_addrs in ZEROCHAIN config
  - config: "{{network_name}}/zerochain"
    nodes: "{{all_nodes}}"
    set:
      authorized_nodes_addrs: "{{authorized_nodes_str}}"
  
  # Build active nodes list (root + master)
  - set: _active_nodes
    value: "root_nodes + master_nodes"
    eval: true
  
  - docker_op: restart
    services: "{{_active_nodes}}"
  
  - wait_network: online
    nodes: "{{_active_nodes}}"
    timeout: 60
  
  - wait: "5s"
  
  # Add all nodes to nodelist dynamically
  - group: Add all nodes to nodelist
    defaults:
      node: "{{first_root}}"
    steps:
      - for: node_idx
        in: "{{root_indices}}"
        steps:
          - set: _addr_idx
            value: "node_idx - 1"
            eval: true
          - set: _add_addr
            value: "get_var('root_addr_' + str(_addr_idx))"
            eval: true
          - set: _add_host
            value: "get_var_dict('node_ip').get('node' + str(node_idx), '')"
            eval: true
          - cli: "node add -addr {{_add_addr}} -host {{_add_host}}"
            contains: "successfully"
      
      - for: node_idx
        in: "{{master_indices}}"
        steps:
          - set: _addr_idx
            value: "node_idx - root_count - 1"
            eval: true
          - set: _add_addr
            value: "get_var('master_addr_' + str(_addr_idx))"
            eval: true
          - set: _add_host
            value: "get_var_dict('node_ip').get('node' + str(node_idx), '')"
            eval: true
          - cli: "node add -addr {{_add_addr}} -host {{_add_host}}"
            contains: "successfully"
      
      - for: node_idx
        in: "{{full_indices}}"
        steps:
          - set: _addr_idx
            value: "node_idx - root_count - master_count - 1"
            eval: true
          - set: _add_addr
            value: "get_var('full_addr_' + str(_addr_idx))"
            eval: true
          - set: _add_host
            value: "get_var_dict('node_ip').get('node' + str(node_idx), '')"
            eval: true
          - cli: "node add -addr {{_add_addr}} -host {{_add_host}}"
            contains: "successfully"
  
  - wait: "5s"
  
  - cli: "node list"
    node: "{{first_root}}"
    not_contains: "No records"
    save: node_list_after_add
  
  # Create wallets dynamically for all nodes
  - group: Create wallets
    defaults:
      cli:
        sign: "sig_dil"
    steps:
      - for: node_idx
        in: "{{root_indices}}"
        steps:
          - set: _wallet_idx
            value: "node_idx - 1"
            eval: true
          - set: _wallet_node
            value: "node-{{node_idx}}"
          - set: _wallet_name
            value: "{{network_name}}_root_{{_wallet_idx}}"
          - cli: "wallet new -w {{_wallet_name}}"
            node: "{{_wallet_node}}"
      
      - for: node_idx
        in: "{{master_indices}}"
        steps:
          - set: _wallet_idx
            value: "node_idx - root_count - 1"
            eval: true
          - set: _wallet_node
            value: "node-{{node_idx}}"
          - set: _wallet_name
            value: "{{network_name}}_master_{{_wallet_idx}}"
          - cli: "wallet new -w {{_wallet_name}}"
            node: "{{_wallet_node}}"
      
      - for: node_idx
        in: "{{full_indices}}"
        steps:
          - set: _wallet_idx
            value: "node_idx - root_count - master_count - 1"
            eval: true
          - set: _wallet_node
            value: "node-{{node_idx}}"
          - set: _wallet_name
            value: "{{network_name}}_full_{{_wallet_idx}}"
          - cli: "wallet new -w {{_wallet_name}}"
            node: "{{_wallet_node}}"
  
  # Get fee_addr from first root wallet
  - cli: "wallet info -w {{network_name}}_root_0"
    node: "{{first_root}}"
    save_wallet: fee_addr
  
  # Enable seed_mode on seed nodes (root nodes)
  - config: "cellframe-node"
    nodes: "{{seed_nodes}}"
    set:
      seed_mode: "true"
  
  # Enable is_add_directly for genesis event creation on seed nodes
  - config: "{{network_name}}/zerochain"
    nodes: "{{seed_nodes}}"
    set:
      is_add_directly: "true"
  
  - docker_op: restart
    services: "{{_active_nodes}}"
  
  - wait_network: online
    nodes: "{{_active_nodes}}"
    timeout: 60
  
  - wait: "40s"

  # Genesis Event - Token Declaration
  # Build root_certs_str: "stagenet.root.pvt.0,stagenet.root.pvt.1,..."
  - set: root_certs_str
    value: "','.join([f'{network_name}.root.pvt.{i}' for i in range(root_count)])"
    eval: true

  - group: Genesis Event - Token Declaration
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "zerochain"
    steps:
      - cli: "token_decl -token {{native_ticker}} -total_supply 0 -decimals 18 -signs_emission {{root_count}} -signs_total {{root_count}} -type CF20 -certs {{root_certs_str}}"
        save_hash: token_hash
      
      - wait: "3s"
      
      - cli: "mempool proc -datum {{token_hash}}"
      
      - wait: "32s"
      
      - cli: "token list"
        expect_output: "tokens: 1"
      
      - cli: "global_db flush"
      
      - wait: "5s"
      
      - cli: "dag event last -chain zerochain"
        save_hash: genesis_event_hash
  
  # Set static genesis event on all active nodes
  - config: "{{network_name}}/zerochain"
    nodes: "{{_active_nodes}}"
    set:
      static_genesis_event: "{{genesis_event_hash}}"
      is_static_genesis_event: "true"
      is_add_directly: "false"
  
  # Disable seed_mode
  - config: "cellframe-node"
    nodes: "{{seed_nodes}}"
    set:
      seed_mode: "false"
  
  # Create stake orders for all master/validator nodes
  - group: Create stake orders for validators
    steps:
      - for: node_idx
        in: "{{master_indices}}"
        steps:
          - set: _cert_idx
            value: "node_idx - root_count - 1"
            eval: true
          - set: _stake_node
            value: "node-{{node_idx}}"
          - set: _stake_cert
            value: "{{network_name}}.master.pvt.{{_cert_idx}}"
          - cli: "srv_stake order create -net {{network_name}} -value 0.05e+18 -cert {{_stake_cert}}"
            node: "{{_stake_node}}"
            save: stake_order_result
  
  - docker_op: restart
    services: "{{_active_nodes}}"
  
  - wait_network: online
    nodes: "{{_active_nodes}}"
    timeout: 60
  
  - wait: "40s"
  
  - config: "{{network_name}}/zerochain"
    nodes: "{{root_nodes}}"
    set:
      static_genesis_event: "{{genesis_event_hash}}"
      is_static_genesis_event: "true"
      is_add_directly: "false"
  
  - wait_network: online
    nodes: "{{root_nodes}}"
    timeout: 60
  
  - wait: "10s"
  
  # Token Emission - ALL signatures on node-1 (has all root certs)
  # Build all_root_certs: "stagenet.root.pvt.0,stagenet.root.pvt.1,..."
  - set: all_root_certs
    value: "','.join([f'{network_name}.root.pvt.{i}' for i in range(root_count)])"
    eval: true
  
  - group: Token Emission
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "zerochain"
        token: "{{native_ticker}}"
    steps:
      # Create emission with ALL signatures at once (all certs are on node-1)
      - cli: "token_emit -no_base_tx -emission_value 10.0e+54 -addr {{fee_addr}} -certs {{all_root_certs}}"
        save_hash: emission_datum_hash
      
      - wait: "10s"
      
      # Verify emission is in mempool
      - cli: "mempool list"
        save: mempool_after_emission
      
      # Extract and verify signature count
      - set: emission_sig_count
        value: "int(regex_extract(mempool_after_emission, r'sig_count:\\s*(\\d+)', 1) or 0)"
        eval: true
      
      - cli: "dag event last"
        save_hash: last_event_before_emission
      
      # Process emission to DAG
      - cli: "mempool proc -datum {{emission_datum_hash}}"
        save: mempool_proc_output
      
      - wait: "30s"
      
      - cli: "dag event last"
        save_hash: emission_event_hash
      
      - cli: "dag event dump -event {{emission_event_hash}} -from events"
        save: emission_event_dump
      
      # Extract emission_hash from dump (plain text format: emission_hash: 0x...)
      - set: emission_hash
        value: "regex_extract(emission_event_dump, r'emission_hash:\\s*(0x[a-fA-F0-9]+)', 1)"
        eval: true
      
      # Verify emission_hash was found
      - if: "not emission_hash"
        then:
          - bash: "echo 'ERROR: emission_hash not found in event dump. Dump content:' && echo '{{emission_event_dump}}' | head -50 && exit 1"
            node: "{{first_root}}"
  
  - cli: "dag event list -chain zerochain"
    node: "{{first_root}}"
  
  - cli: "dag event last -chain zerochain"
    node: "{{first_root}}"

# NOTE: Snapshot creation is handled by manager.py after this phase completes.
# teardown with snapshot: create would be used for standalone phase execution.
