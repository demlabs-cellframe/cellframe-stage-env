name: PHASE 1 - Zerochain Genesis
description: Initialize ROOT nodes, create token and emission (dynamic topology)

includes:
  - common/set_net_default.yml

network:
  topology: default
  name: "{{network_name}}"

setup:
  # Start all nodes dynamically based on topology
  - docker_op: start
    services: "{{all_nodes}}"
    detach: true
  
  - wait: "10s"
  
  # Verify pre-generated certificates exist in containers (dynamic)
  - group: Verify ROOT node certificates
    steps:
      - for: node_idx
        in: "{{root_indices}}"
        steps:
          - python: |
              import subprocess
              node_idx = ctx.get('node_idx')
              network_name = ctx.get('network_name')
              cert_idx = node_idx - 1
              container = f"cellframe-stage-node-{node_idx}"
              cert_path = f"/opt/cellframe-node/var/lib/ca/{network_name}.root.pvt.{cert_idx}.dcert"
              
              result = subprocess.run(
                  ["docker", "exec", container, "test", "-f", cert_path],
                  capture_output=True
              )
              if result.returncode != 0:
                  raise RuntimeError(f"ROOT certificate not found: {cert_path} on {container}")
              print(f"✓ ROOT node-{node_idx}: {cert_path} found")
  
  - group: Verify MASTER node certificates
    steps:
      - for: node_idx
        in: "{{master_indices}}"
        steps:
          - python: |
              import subprocess
              node_idx = ctx.get('node_idx')
              root_count = ctx.get('root_count')
              network_name = ctx.get('network_name')
              cert_idx = node_idx - root_count - 1
              container = f"cellframe-stage-node-{node_idx}"
              cert_path = f"/opt/cellframe-node/var/lib/ca/{network_name}.master.pvt.{cert_idx}.dcert"
              
              result = subprocess.run(
                  ["docker", "exec", container, "test", "-f", cert_path],
                  capture_output=True
              )
              if result.returncode != 0:
                  raise RuntimeError(f"MASTER certificate not found: {cert_path} on {container}")
              print(f"✓ MASTER node-{node_idx}: {cert_path} found")
  
  # Copy all root private certs to first root node for multi-signature
  - python: |
      import subprocess
      import os
      
      root_count = ctx.get('root_count')
      network_name = ctx.get('network_name')
      dst_container = "cellframe-stage-node-1"
      
      # Copy all root certs except first one to first root node
      for i in range(1, root_count):
          cert_name = f"{network_name}.root.pvt.{i}.dcert"
          cert_path = f"/opt/cellframe-node/var/lib/ca/{cert_name}"
          tmp_path = f"/tmp/{cert_name}"
          src_container = f"cellframe-stage-node-{i+1}"
          
          subprocess.run(["docker", "cp", f"{src_container}:{cert_path}", tmp_path], check=True)
          subprocess.run(["docker", "cp", tmp_path, f"{dst_container}:{cert_path}"], check=True)
          os.remove(tmp_path)
          print(f"✓ Copied {cert_name} from {src_container} to {dst_container}")
      
      print(f"✓ All {root_count-1} root certs copied to node-1 for multi-signature")
  
  # Configure events_sign_cert for each ROOT node
  - for: node_idx
    in: "{{root_indices}}"
    steps:
      - python: |
          node_idx = ctx.get('node_idx')
          network_name = ctx.get('network_name')
          cert_idx = node_idx - 1
          ctx.set_variable('_current_node', f"node-{node_idx}")
          ctx.set_variable('_current_cert', f"{network_name}.root.pvt.{cert_idx}")
      - config: "{{network_name}}"
        nodes: ["{{_current_node}}"]
        set:
          events_sign_cert: "{{_current_cert}}"
  
  - docker_op: restart
    services: "{{all_nodes}}"
  
  - wait_network: online
    nodes: "{{root_nodes}}"
    timeout: 120
  
  - wait: "5s"

test:
  # Get ALL node addresses dynamically
  - group: Get node addresses
    steps:
      - for: node_idx
        in: "{{root_indices}}"
        steps:
          - python: |
              node_idx = ctx.get('node_idx')
              ctx.set_variable('_node_name', f"node-{node_idx}")
              ctx.set_variable('_addr_var', f"root_addr_{node_idx - 1}")
          - cli: "node dump"
            node: "{{_node_name}}"
            save_node: "{{_addr_var}}"
      
      - for: node_idx
        in: "{{master_indices}}"
        steps:
          - python: |
              node_idx = ctx.get('node_idx')
              root_count = ctx.get('root_count')
              ctx.set_variable('_node_name', f"node-{node_idx}")
              ctx.set_variable('_addr_var', f"master_addr_{node_idx - root_count - 1}")
          - cli: "node dump"
            node: "{{_node_name}}"
            save_node: "{{_addr_var}}"
      
      - for: node_idx
        in: "{{full_indices}}"
        steps:
          - python: |
              node_idx = ctx.get('node_idx')
              root_count = ctx.get('root_count')
              master_count = ctx.get('master_count')
              ctx.set_variable('_node_name', f"node-{node_idx}")
              ctx.set_variable('_addr_var', f"full_addr_{node_idx - root_count - master_count - 1}")
          - cli: "node dump"
            node: "{{_node_name}}"
            save_node: "{{_addr_var}}"
  
  # Build validators_addrs dynamically from master node addresses
  - python: |
      master_count = ctx.get('master_count')
      addrs = [ctx.get(f'master_addr_{i}') for i in range(master_count)]
      validators_str = "[" + ",".join(addrs) + "]"
      ctx.set_variable('validators_addrs_str', validators_str)
      print(f"Validators addresses: {validators_str}")
  
  # Build authorized_nodes_addrs from root node addresses
  - python: |
      root_count = ctx.get('root_count')
      addrs = [ctx.get(f'root_addr_{i}') for i in range(root_count)]
      authorized_str = "[" + ",".join(addrs) + "]"
      ctx.set_variable('authorized_nodes_str', authorized_str)
      print(f"Authorized nodes: {authorized_str}")
  
  # Set validators_addrs on ALL nodes
  - config: "{{network_name}}/main"
    nodes: "{{all_nodes}}"
    set:
      validators_addrs: "{{validators_addrs_str}}"
  
  # Set authorized_nodes_addrs in ZEROCHAIN config
  - config: "{{network_name}}/zerochain"
    nodes: "{{all_nodes}}"
    set:
      authorized_nodes_addrs: "{{authorized_nodes_str}}"
  
  # Restart all non-full nodes
  - python: |
      root_nodes = ctx.get('root_nodes')
      master_nodes = ctx.get('master_nodes')
      ctx.set_variable('_active_nodes', root_nodes + master_nodes)
  
  - docker_op: restart
    services: "{{_active_nodes}}"
  
  - wait_network: online
    nodes: "{{_active_nodes}}"
    timeout: 60
  
  - wait: "5s"
  
  # Add all nodes to nodelist dynamically
  - group: Add all nodes to nodelist
    defaults:
      node: "{{first_root}}"
    steps:
      - for: node_idx
        in: "{{root_indices}}"
        steps:
          - python: |
              node_idx = ctx.get('node_idx')
              addr = ctx.get(f'root_addr_{node_idx - 1}')
              ip = ctx.get('node_ip', {}).get(f'node{node_idx}', '')
              ctx.set_variable('_add_addr', addr)
              ctx.set_variable('_add_host', ip)
          - cli: "node add -addr {{_add_addr}} -host {{_add_host}}"
            contains: "Successfully"
      
      - for: node_idx
        in: "{{master_indices}}"
        steps:
          - python: |
              node_idx = ctx.get('node_idx')
              root_count = ctx.get('root_count')
              addr = ctx.get(f'master_addr_{node_idx - root_count - 1}')
              ip = ctx.get('node_ip', {}).get(f'node{node_idx}', '')
              ctx.set_variable('_add_addr', addr)
              ctx.set_variable('_add_host', ip)
          - cli: "node add -addr {{_add_addr}} -host {{_add_host}}"
            contains: "Successfully"
      
      - for: node_idx
        in: "{{full_indices}}"
        steps:
          - python: |
              node_idx = ctx.get('node_idx')
              root_count = ctx.get('root_count')
              master_count = ctx.get('master_count')
              addr = ctx.get(f'full_addr_{node_idx - root_count - master_count - 1}')
              ip = ctx.get('node_ip', {}).get(f'node{node_idx}', '')
              ctx.set_variable('_add_addr', addr)
              ctx.set_variable('_add_host', ip)
          - cli: "node add -addr {{_add_addr}} -host {{_add_host}}"
            contains: "Successfully"
  
  - wait: "5s"
  
  - cli: "node list"
    node: "{{first_root}}"
    not_contains: "No records"
    save: node_list_after_add
  
  # Create wallets dynamically for all nodes
  - group: Create wallets
    defaults:
      cli:
        sign: "sig_dil"
    steps:
      - for: node_idx
        in: "{{root_indices}}"
        steps:
          - python: |
              node_idx = ctx.get('node_idx')
              network_name = ctx.get('network_name')
              ctx.set_variable('_wallet_node', f"node-{node_idx}")
              ctx.set_variable('_wallet_name', f"{network_name}_root_{node_idx - 1}")
          - cli: "wallet new -w {{_wallet_name}}"
            node: "{{_wallet_node}}"
      
      - for: node_idx
        in: "{{master_indices}}"
        steps:
          - python: |
              node_idx = ctx.get('node_idx')
              root_count = ctx.get('root_count')
              network_name = ctx.get('network_name')
              ctx.set_variable('_wallet_node', f"node-{node_idx}")
              ctx.set_variable('_wallet_name', f"{network_name}_master_{node_idx - root_count - 1}")
          - cli: "wallet new -w {{_wallet_name}}"
            node: "{{_wallet_node}}"
      
      - for: node_idx
        in: "{{full_indices}}"
        steps:
          - python: |
              node_idx = ctx.get('node_idx')
              root_count = ctx.get('root_count')
              master_count = ctx.get('master_count')
              network_name = ctx.get('network_name')
              ctx.set_variable('_wallet_node', f"node-{node_idx}")
              ctx.set_variable('_wallet_name', f"{network_name}_full_{node_idx - root_count - master_count - 1}")
          - cli: "wallet new -w {{_wallet_name}}"
            node: "{{_wallet_node}}"
  
  # Get fee_addr from first root wallet
  - cli: "wallet info -w {{network_name}}_root_0"
    node: "{{first_root}}"
    save_wallet: fee_addr
  
  # Set fee_addr on master nodes
  - config: "{{network_name}}"
    nodes: "{{master_nodes}}"
    set:
      fee_addr: "{{fee_addr}}"
  
  # Enable seed_mode on seed nodes (root nodes)
  - config: "cellframe-node"
    nodes: "{{seed_nodes}}"
    set:
      seed_mode: "true"
  
  # Enable is_add_directly for genesis event creation on seed nodes
  - config: "{{network_name}}/zerochain"
    nodes: "{{seed_nodes}}"
    set:
      is_add_directly: "true"
  
  - docker_op: restart
    services: "{{_active_nodes}}"
  
  - wait_network: online
    nodes: "{{_active_nodes}}"
    timeout: 60
  
  - wait: "40s"

  # Genesis Event - Token Declaration
  # Build dynamic certs string for token_decl
  - python: |
      root_count = ctx.get('root_count')
      network_name = ctx.get('network_name')
      certs = [f"{network_name}.root.pvt.{i}" for i in range(root_count)]
      certs_str = ",".join(certs)
      ctx.set_variable('root_certs_str', certs_str)
      print(f"Root certs for signing: {certs_str}")
  
  - group: Genesis Event - Token Declaration
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "zerochain"
    steps:
      - cli: "token_decl -token {{native_ticker}} -total_supply 0 -decimals 18 -signs_emission {{root_count}} -signs_total {{root_count}} -type CF20 -certs {{root_certs_str}}"
        save_hash: token_hash
      
      - wait: "3s"
      
      - cli: "mempool proc -datum {{token_hash}}"
      
      - wait: "32s"
      
      - cli: "token list"
        expect_output: "tokens: 1"
      
      - cli: "global_db flush"
      
      - wait: "5s"
      
      - cli: "dag event last -chain zerochain"
        save_hash: genesis_event_hash
  
  # Set static genesis event on all active nodes
  - config: "{{network_name}}/zerochain"
    nodes: "{{_active_nodes}}"
    set:
      static_genesis_event: "{{genesis_event_hash}}"
      is_static_genesis_event: "true"
      is_add_directly: "false"
  
  # Disable seed_mode
  - config: "cellframe-node"
    nodes: "{{seed_nodes}}"
    set:
      seed_mode: "false"
  
  # Create stake orders for all master/validator nodes
  # CRITICAL: Orders must be signed with same cert used for blocks-sign-cert
  - group: Create stake orders for validators
    steps:
      - for: node_idx
        in: "{{master_indices}}"
        steps:
          - python: |
              node_idx = ctx.get('node_idx')
              root_count = ctx.get('root_count')
              network_name = ctx.get('network_name')
              cert_idx = node_idx - root_count - 1
              ctx.set_variable('_stake_node', f"node-{node_idx}")
              ctx.set_variable('_stake_cert', f"{network_name}.master.pvt.{cert_idx}")
          - cli: "srv_stake order create -net {{network_name}} -value 0.05e+18 -cert {{_stake_cert}}"
            node: "{{_stake_node}}"
            save: stake_order_result
  
  - docker_op: restart
    services: "{{_active_nodes}}"
  
  - wait_network: online
    nodes: "{{_active_nodes}}"
    timeout: 60
  
  - wait: "40s"
  
  - config: "{{network_name}}/zerochain"
    nodes: "{{root_nodes}}"
    set:
      static_genesis_event: "{{genesis_event_hash}}"
      is_static_genesis_event: "true"
      is_add_directly: "false"
  
  - wait_network: online
    nodes: "{{root_nodes}}"
    timeout: 60
  
  - wait: "10s"
  
  # Token Emission - ALL signatures on node-1 (has all root certs)
  - group: Token Emission
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "zerochain"
        token: "{{native_ticker}}"
    steps:
      # Build comma-separated list of all root certs for single emission command
      - python: |
          root_count = ctx.get('root_count')
          network_name = ctx.get('network_name')
          all_certs = ','.join([f"{network_name}.root.pvt.{i}" for i in range(root_count)])
          ctx.set_variable('all_root_certs', all_certs)
          print(f"Using all root certs for emission: {all_certs}")
      
      # Create emission with ALL signatures at once (all certs are on node-1)
      - cli: "token_emit -no_base_tx -emission_value 10.0e+54 -addr {{fee_addr}} -certs {{all_root_certs}}"
        save_hash: emission_datum_hash
      
      - wait: "10s"
      
      # Verify emission is in mempool with correct signature count
      - cli: "mempool list"
        save: mempool_after_emission
      
      - python: |
          import re
          mempool = ctx.get('mempool_after_emission', '')
          match = re.search(r'sig_count:\s*(\d+)', mempool)
          if match:
              sig_count = int(match.group(1))
              root_count = ctx.get('root_count')
              print(f"Emission has {sig_count} signatures (need {root_count})")
              if sig_count < root_count:
                  print(f"WARNING: Not enough signatures!")
          else:
              print("Could not find sig_count in mempool")
      
      - cli: "dag event last"
        save_hash: last_event_before_emission
      
      # Process emission to DAG
      - cli: "mempool proc -datum {{emission_datum_hash}}"
        save: mempool_proc_output
      
      - wait: "30s"
      
      - cli: "dag event last"
        save_hash: emission_event_hash
      
      - cli: "dag event dump -event {{emission_event_hash}} -from events"
        save: emission_event_dump
      
      - python: |
          import re
          dump = ctx.get('emission_event_dump', '')
          match = re.search(r'emission_hash:\s*(0x[a-fA-F0-9]+)', dump)
          if not match:
              raise ValueError(f"emission_hash not found in event dump: {dump[:500]}")
          result = match.group(1)
        save: emission_hash
  
  - cli: "dag event list -chain zerochain"
    node: "{{first_root}}"
  
  - cli: "dag event last -chain zerochain"
    node: "{{first_root}}"
