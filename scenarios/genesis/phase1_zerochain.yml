name: PHASE 1 - Zerochain Genesis
description: Initialize ROOT nodes, create token and emission

# NOTE: Temporarily disabled net defaults due to CLI bug with -fee parameter
# includes:
#   - common/set_net_default.yml

network:
  topology: default
  name: stagenet

setup:
  - docker_op: start
    services: [root-1, root-2, root-3]
    detach: true
  
  - wait_network: online
    nodes: [root-1, root-2, root-3]
    timeout: 60
  
  # Allow brief stabilization after coming online before executing commands
  - wait: "5s"
  
  # Note: Link establishment requires node registration which happens in the 'test' section.
  # So we cannot wait for links here.

test:
  # Register ROOT nodes - get addresses (IPs already in context as node_ip map)
  # Available: node_ip['node1'], node_ip['node2'], node_ip['node3']
  # Or as array: node_ips[0], node_ips[1], node_ips[2]
  - group: Get node addresses
    steps:
      - cli: "node dump"
        node: root-1
        save_node: root_addr_0
      
      - cli: "node dump"
        node: root-2
        save_node: root_addr_1
      
      - cli: "node dump"
        node: root-3
        save_node: root_addr_2
  
  # Register all nodes on each root node with IP and port (each node registers others, not itself)
  # Using node_ip map for readable access by node ID
  - group: Register nodes on root-1
    defaults:
      node: root-1
    steps:
      # root-1 registers root-2 and root-3 with their IP addresses and ports
      - cli: "node add -addr {{root_addr_1}} -alias root-2 -host {{node_ip['node2']}} -port 8079"
      
      - cli: "node add -addr {{root_addr_2}} -alias root-3 -host {{node_ip['node3']}} -port 8079"
  
  - group: Register nodes on root-2
    defaults:
      node: root-2
    steps:
      # root-2 registers root-1 and root-3 with their IP addresses and ports
      - cli: "node add -addr {{root_addr_0}} -alias root-1 -host {{node_ip['node1']}} -port 8079"
      
      - cli: "node add -addr {{root_addr_2}} -alias root-3 -host {{node_ip['node3']}} -port 8079"
  
  - group: Register nodes on root-3
    defaults:
      node: root-3
    steps:
      # root-3 registers root-1 and root-2 with their IP addresses and ports
      - cli: "node add -addr {{root_addr_0}} -alias root-1 -host {{node_ip['node1']}} -port 8079"
      
      - cli: "node add -addr {{root_addr_1}} -alias root-2 -host {{node_ip['node2']}} -port 8079"
  
  # Establish links via soft reconnect (offline/online cycle)
  - group: Soft reconnect - offline
    steps:
      - cli: "net go offline"
        node: root-1
      
      - cli: "net go offline"
        node: root-2
      
      - cli: "net go offline"
        node: root-3
  
  # Wait for nodes to reach offline state
  - wait_network: offline
    nodes: [root-1, root-2, root-3]
    timeout: 60
  
  - group: Soft reconnect - online
    steps:
      - cli: "net go online"
        node: root-1
      
      - cli: "net go online"
        node: root-2
      
      - cli: "net go online"
        node: root-3
  
  - wait_network: links_established
    nodes: [root-1, root-2, root-3]
    timeout: 120
  
  # Genesis operations on root-1 (centralized genesis with 2/3 consensus)
  # NOTE: root-1 has access to ALL three private certificates for testing threshold consensus
  # WORKAROUND: Using multiple certs in single command for compatibility with nodes without token_*_sign commands
  - group: Genesis operations
    defaults:
      node: root-1
    steps:
      # Wait for CLI to be responsive on all root nodes
      - wait: cli_ready
        nodes: [root-1, root-2, root-3]
        timeout: 40

      # Create fee wallet
      - cli: "wallet new -w fee_collector"
      
      # Get fee wallet address
      - cli: "wallet info -w fee_collector"
        save_wallet: fee_addr
      
      # Create TCELL token declaration with 2/3 consensus (signs_emission=2, signs_total=3)
      # All three signatures added in single command using comma-separated cert list
      - cli: "token_decl -token TCELL -chain zerochain -total_supply 1000000.0e+18 -decimals 18 -signs_emission 2 -signs_total 3 -certs pvt.stagenet.root.0,pvt.stagenet.root.1,pvt.stagenet.root.2"
        node: root-1
        save_hash: token_hash
      
      # Allow propagation
      - wait: "5s"

      # Wait for token declaration to be finalized (3 signatures = fully signed)
      - wait: finalized
        datum: "{{token_hash}}"
        node: root-1
        chain: zerochain
        timeout: 80
      
      # Create emission with 2/3 consensus (requires 2 signatures out of 3)
      # BUT: In practice, may need all 3 signatures to match token declaration
      # Adding all 3 signatures to ensure emission finalizes
      - cli: "token_emit -chain zerochain -token TCELL -emission_value 1000000.0e+18 -addr {{fee_addr}} -certs pvt.stagenet.root.0,pvt.stagenet.root.1,pvt.stagenet.root.2"
        node: root-1
        save_hash: emission_hash
      
      # Allow propagation
      - wait: "5s"

      # Wait for emission to be finalized (2 signatures = threshold reached)
      - wait: finalized
        datum: "{{emission_hash}}"
        node: root-1
        chain: zerochain
        timeout: 80
      
      # Additional wait for ledger sync and force flush
      - wait: "10s"
      
      - cli: "global_db flush"
        node: root-1
  
  # Create master wallets and transfer tokens BEFORE snapshot
  # This ensures balances are in the snapshot and will be available after restore
  - group: Prepare master wallets with tokens
    steps:
      # Create 3 master wallets (they will be used in phase2 by master nodes)
      - loop: 3
        steps:
          - set: master_idx = "{{i}}"
          - set: wallet_name = "stagenet_master_{{i}}"
          
          # Create wallet on root-1 (will be copied to masters in phase2)
          - cli: "wallet new -w {{wallet_name}}"
            node: root-1
          
          # Get wallet address
          - cli: "wallet info -w {{wallet_name}} -net stagenet"
            node: root-1
            save_wallet: "master_addr_{{i}}"
      
      # Transfer tokens from fee_collector to each master wallet
      # This way masters will have balance after snapshot restore
      - loop: 3
        steps:
          - set: i_val = "{{i}}"
          
          # Get the address that was saved earlier (master_addr_0, master_addr_1, master_addr_2)
          - cli: "wallet info -w stagenet_master_{{i}} -net stagenet"
            node: root-1
            save_wallet: "temp_addr"
          
          # Transfer 10000 TCELL to each master (enough for testing)
          # Fee is 0e+18 (zero datoshi in exponential notation - workaround for CLI parsing issue with plain "0")
          # NOTE: -net parameter is specified explicitly since defaults are disabled due to CLI bug
          - cli: "tx_create -net stagenet -from_wallet fee_collector -value 10000.0 -to_addr {{temp_addr}} -token TCELL -chain zerochain -fee 0e+18"
            node: root-1
            save_hash: "master_tx_{{i}}"
      
      # Wait for all transfers to finalize
      - loop: 3
        steps:
          - set: master_idx = "{{i}}"
          - wait: finalized
            datum: "{{master_tx_{{i}}}}"
            node: root-1
            chain: zerochain
            timeout: 60
      
      # Force GDB flush to ensure all transactions are written
      - cli: "global_db flush"
        node: root-1
      
      # Wait for ledger sync
      - wait: "5s"
  
  # Save genesis configuration explicitly before snapshot
  # Using new Generic Config Generation syntax
  
  # Set genesis hash for Zerochain
  - gen_config: "stagenet/zerochain"
    nodes: [root-1, root-2, root-3]
    set:
      static_genesis_event: "{{token_hash}}"
      is_static_genesis_event: "true"
      
  # Set fee address for Mainchain
  - gen_config: "stagenet/main"
    nodes: [root-1, root-2, root-3]
    set:
      fee_addr: "{{fee_addr}}"

  # Create snapshot
  - snapshot: create
    name: phase1_zerochain_genesis
    phase: phase1
