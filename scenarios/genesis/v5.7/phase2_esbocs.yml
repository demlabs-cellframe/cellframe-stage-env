name: PHASE 2 - ESBocs Genesis
description: Create mainchain genesis block from emission (dynamic topology)

includes:
  - common/set_net_default.yml

network:
  topology: default
  name: "{{network_name}}"

setup:
  # NOTE: When running as part of genesis flow (via manager.py), 
  # containers are already running from phase1.
  # snapshot: restore is only needed when running phase2 standalone.
  
  # Build active nodes list (root + master)
  - set: _active_nodes
    value: "root_nodes + master_nodes"
    eval: true
  
  # Enable seed_mode on ALL root and master nodes to accept genesis block
  - config: "cellframe-node"
    nodes: "{{_active_nodes}}"
    set:
      seed_mode: "true"
  
  - docker_op: restart
    services: "{{_active_nodes}}"
  
  - wait_network: online
    nodes: "{{_active_nodes}}"
    timeout: 60
  
  # Wait for Global DB synchronization after restart
  - wait: global_db_sync
    node: "{{first_root}}"
    timeout: 60
  
  # Get fee_addr from first root wallet
  # This wallet was created in phase1 and exists in the snapshot
  - cli: "wallet info -w {{network_name}}_root_0"
    node: "{{first_root}}"
    save_wallet: fee_addr

test:
  - group: Verify network connectivity and emission on root
    description: Ensure root nodes have emission and network is ready
    steps:
      # Verify network is online on root node
      - cli: "net get status"
        node: "{{first_root}}"
        contains: "NET_STATE_ONLINE"
      
      # Verify emission is in ledger on root node (added in Phase 1)
      - cli: "ledger list coins"
        node: "{{first_root}}"
        contains: "{{native_ticker}}"
      
      # Debug: Check zerochain events count on root
      - cli: "dag event list -chain zerochain"
        node: "{{first_root}}"
        save_to: _dag_events_output
      
      - print: "Root node zerochain events: {{_dag_events_output}}"
  
  - group: Wait for master nodes to sync
    description: Wait for ledger propagation via Global DB
    steps:
      # Wait for Global DB sync on first root (ensures GDB is ready)
      - wait: global_db_sync
        node: "{{first_root}}"
        timeout: 60
      
      # Wait for network to stabilize and ledger cache to propagate
      # Ledger cache is synced via Global DB groups
      - wait: "60s"
      
      # Verify network is online on first master
      - cli: "net get status"
        node: "{{first_master}}"
        contains: "NET_STATE_ONLINE"
      
      # Debug: Check zerochain events on master (may be empty - that's OK)
      - cli: "dag event list -chain zerochain"
        node: "{{first_master}}"
        save_to: _master_dag_events
      
      - print: "Master node zerochain events: {{_master_dag_events}}"
      
      # CRITICAL: Check if emission is in ledger on master node
      # If not, we need to trigger chain sync
      - cli: "ledger list coins"
        node: "{{first_master}}"
        save_to: _master_ledger_coins
      
      - print: "Master ledger coins: {{_master_ledger_coins}}"
  
  - group: Force chain sync if needed
    description: Ensure chains are synced from root to master
    steps:
      # Force a clean re-sync from scratch on master and root.
      # 'net go sync' (NOT 'sync chains') is required: 'go sync' keeps
      # state_target=NET_STATE_ONLINE so the network returns to ONLINE
      # after sync completes (ESBocs needs ONLINE to accept packets).
      # 'sync chains' instead sets state_target=NET_STATE_SYNC_CHAINS,
      # leading to NET_STATE_OFFLINE once the sync drains.
      - cli: "net go sync"
        node: "{{first_master}}"

      - cli: "net go sync"
        node: "{{first_root}}"

      # Poll the ledger on master until emission propagates.
      - wait: cli
        cmd: "ledger list coins"
        node: "{{first_master}}"
        contains: "{{native_ticker}}"
        timeout: 180
        interval: 5

      - print: "Emission synced to master node ledger"
  
  - group: Genesis Block - Create from emission
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "main"
        token: "{{native_ticker}}"
    steps:
      # v5.7+ CLI: command is tx_create (underscore), -chain_emission was
      # removed (the emission chain is derived from the emission hash now);
      # -token must be passed explicitly.
      - cli: "tx_create -from_emission {{emission_hash}} -value 10.0e+54 -to_addr {{fee_addr}} -fee 5.0e+18 -cert {{network_name}}.root.pvt.0 -token {{native_ticker}}"
        save_hash: mainchain_genesis_tx
      
      # Process mainchain genesis transaction on root
      - cli: "mempool proc -datum {{mainchain_genesis_tx}}"

      # ARCHITECTURE NOTE:
      # - Genesis TX is created on ROOT node, placed in main mempool.
      # - GlobalDB cluster mempool sync propagates the datum to MASTER
      #   nodes (cluster ID 0x12340000).
      # - MASTER nodes have mempool_auto_types=[transaction] and run
      #   ESBocs as the main-chain consensus; the round leader picks up
      #   the datum from its local block_new and proposes it as the
      #   genesis block candidate.
      # - Once 2/3 master signatures are collected the block is added to
      #   the chain and propagated to ROOT via GlobalDB.

      # Poll the master mempool for our datum to confirm propagation.
      - wait: cli
        cmd: "mempool list -chain main"
        node: "{{first_master}}"
        contains: "{{mainchain_genesis_tx}}"
        timeout: 120
        interval: 5
        optional: true

      # Poll for the genesis block to be produced and synced to master.
      - wait: cli
        cmd: "block list"
        node: "{{first_master}}"
        contains: "have blocks: [1-9]"
        timeout: 300
        interval: 5
  
  - cli: "block list -chain main"
    node: "{{first_master}}"
    save_hash: genesis_block_hash
  
  # Configure static genesis block BEFORE restart
  # This ensures nodes will load the genesis block from config after restart
  - config: "{{network_name}}/main"
    nodes: "{{_active_nodes}}"
    set:
      static_genesis_block: "{{genesis_block_hash}}"
      is_static_genesis_block: "true"
  
  - config: "cellframe-node"
    nodes: "{{seed_nodes}}"
    set:
      seed_mode: "false"
  
  - docker_op: restart
    services: "{{all_nodes}}"
  
  - wait_network: online
    nodes: "{{_active_nodes}}"
    timeout: 60
  
  # Wait for Global DB synchronization after all nodes restart
  - wait: global_db_sync
    node: "{{first_root}}"
    timeout: 60
  
  # Configure fee_addr in main.cfg 
  # SDK will automatically load it from config on node startup
  - config: "{{network_name}}/main"
    nodes: "{{_active_nodes}}"
    set:
      fee_addr: "{{fee_addr}}"

check:
  - cli: "net get status"
    node: "{{first_master}}"
    contains: "NET_STATE_ONLINE"
  
  - cli: "block list -chain main"
    node: "{{first_root}}"
    contains: "have blocks:"
  
  - cli: "token list"
    node: "{{first_root}}"
    contains: "tokens:"

# NOTE: Snapshot creation is handled by manager.py after genesis flow completes.
# teardown with snapshot: create would be used for standalone phase execution.
