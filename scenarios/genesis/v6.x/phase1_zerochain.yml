name: PHASE 1 - Zerochain Genesis
description: Initialize ROOT nodes, create token and emission (dynamic topology)

includes:
  - common/set_net_default.yml

network:
  topology: default
  name: "{{network_name}}"

setup:
  # Start all nodes dynamically based on topology
  - docker_op: start
    services: "{{all_nodes}}"
    detach: true
  
  # Verify ROOT node certificates exist
  - group: Verify ROOT node certificates
    steps:
      - for: node_idx
        in: "{{root_indices}}"
        steps:
          - set: _cert_idx
            value: "node_idx - 1"
            eval: true
          - set: _cert_path
            value: "/opt/cellframe-node/var/lib/ca/{{network_name}}.root.pvt.{{_cert_idx}}.dcert"
          - set: _check_node
            value: "node-{{node_idx}}"
          - bash: "test -f {{_cert_path}} && echo '✓ ROOT cert found: {{_cert_path}}'"
            node: "{{_check_node}}"
  
  # Verify MASTER node certificates exist
  - group: Verify MASTER node certificates
    steps:
      - for: node_idx
        in: "{{master_indices}}"
        steps:
          - set: _cert_idx
            value: "node_idx - root_count - 1"
            eval: true
          - set: _cert_path
            value: "/opt/cellframe-node/var/lib/ca/{{network_name}}.master.pvt.{{_cert_idx}}.dcert"
          - set: _check_node
            value: "node-{{node_idx}}"
          - bash: "test -f {{_cert_path}} && echo '✓ MASTER cert found: {{_cert_path}}'"
            node: "{{_check_node}}"
  
  # Copy all root private certs to first root node for multi-signature
  - group: Copy root certs to node-1 for multi-signature
    steps:
      - for: cert_idx
        in: "range(1, root_count)"
        steps:
          - set: _src_node_id
            value: "cert_idx + 1"
            eval: true
          - set: _cert_name
            value: "{{network_name}}.root.pvt.{{cert_idx}}.dcert"
          - set: _cert_path
            value: "/opt/cellframe-node/var/lib/ca/{{_cert_name}}"
          - docker_op: cp
            src: "node-{{_src_node_id}}:{{_cert_path}}"
            dst: "node-1:{{_cert_path}}"
  
  # Configure events_sign_cert for each ROOT node
  - for: node_idx
    in: "{{root_indices}}"
    steps:
      - set: _cert_idx
        value: "node_idx - 1"
        eval: true
      - set: _current_node
        value: "node-{{node_idx}}"
      - set: _current_cert
        value: "{{network_name}}.root.pvt.{{_cert_idx}}"
      - config: "{{network_name}}"
        nodes: ["{{_current_node}}"]
        set:
          events_sign_cert: "{{_current_cert}}"
  
  - docker_op: restart
    services: "{{all_nodes}}"
  
  - wait: 10s

test:
  # Get ALL node addresses dynamically (works without ONLINE state)
  - group: Get node addresses
    steps:
      - for: node_idx
        in: "{{root_indices}}"
        steps:
          - set: _addr_idx
            value: "node_idx - 1"
            eval: true
          - set: _node_name
            value: "node-{{node_idx}}"
          - set: _addr_var
            value: "root_addr_{{_addr_idx}}"
          - cli: "node dump"
            node: "{{_node_name}}"
            save_node: "{{_addr_var}}"
      
      - for: node_idx
        in: "{{master_indices}}"
        steps:
          - set: _addr_idx
            value: "node_idx - root_count - 1"
            eval: true
          - set: _node_name
            value: "node-{{node_idx}}"
          - set: _addr_var
            value: "master_addr_{{_addr_idx}}"
          - cli: "node dump"
            node: "{{_node_name}}"
            save_node: "{{_addr_var}}"
      
      - for: node_idx
        in: "{{full_indices}}"
        steps:
          - set: _addr_idx
            value: "node_idx - root_count - master_count - 1"
            eval: true
          - set: _node_name
            value: "node-{{node_idx}}"
          - set: _addr_var
            value: "full_addr_{{_addr_idx}}"
          - cli: "node dump"
            node: "{{_node_name}}"
            save_node: "{{_addr_var}}"

  # Build validators_addrs and authorized_nodes_addrs from collected addresses
  - set: validators_addrs_str
    value: "join_vars_bracket('master_addr_', master_count)"
    eval: true
  
  - set: authorized_nodes_str
    value: "join_vars_bracket('root_addr_', root_count)"
    eval: true
  
  # Set authorized_nodes_addrs BEFORE restart so nodes know who has ROOT role
  - config: "{{network_name}}/main"
    nodes: "{{all_nodes}}"
    set:
      validators_addrs: "{{validators_addrs_str}}"
  
  - config: "{{network_name}}/zerochain"
    nodes: "{{all_nodes}}"
    set:
      authorized_nodes_addrs: "{{authorized_nodes_str}}"

  - set: _active_nodes
    value: "root_nodes + master_nodes"
    eval: true

  # Restart so nodes pick up authorized_nodes_addrs (required for node add)
  - docker_op: restart
    services: "{{_active_nodes}}"
  
  - wait: 15s

  # Now nodes are authorized — populate GDB node lists so balancer works
  - group: Add all nodes to nodelist
    steps:
      - for: _target_node_idx
        in: "{{root_indices}}"
        steps:
          - set: _target_node
            value: "'node-' + str(_target_node_idx)"
            eval: true
          - print: "Adding node records to {{_target_node}}"
          
          - for: node_idx
            in: "{{root_indices}}"
            steps:
              - set: _addr_idx
                value: "node_idx - 1"
                eval: true
              - set: _add_addr
                value: "get_var('root_addr_' + str(_addr_idx))"
                eval: true
              - set: _add_host
                value: "get_var_dict('node_ip').get('node' + str(node_idx), '')"
                eval: true
              - cli: "node add -addr {{_add_addr}} -host {{_add_host}}:{{node_port}}"
                node: "{{_target_node}}"
                contains: "successfully"
          
          - for: node_idx
            in: "{{master_indices}}"
            steps:
              - set: _addr_idx
                value: "node_idx - root_count - 1"
                eval: true
              - set: _add_addr
                value: "get_var('master_addr_' + str(_addr_idx))"
                eval: true
              - set: _add_host
                value: "get_var_dict('node_ip').get('node' + str(node_idx), '')"
                eval: true
              - cli: "node add -addr {{_add_addr}} -host {{_add_host}}:{{node_port}}"
                node: "{{_target_node}}"
                contains: "successfully"
          
          - for: node_idx
            in: "{{full_indices}}"
            steps:
              - set: _addr_idx
                value: "node_idx - root_count - master_count - 1"
                eval: true
              - set: _add_addr
                value: "get_var('full_addr_' + str(_addr_idx))"
                eval: true
              - set: _add_host
                value: "get_var_dict('node_ip').get('node' + str(node_idx), '')"
                eval: true
              - cli: "node add -addr {{_add_addr}} -host {{_add_host}}:{{node_port}}"
                node: "{{_target_node}}"
                contains: "successfully"
  
  # Verify node list on all ROOT nodes
  - for: _verify_node_idx
    in: "{{root_indices}}"
    steps:
      - set: _verify_node
        value: "'node-' + str(_verify_node_idx)"
        eval: true
      - cli: "node list"
        node: "{{_verify_node}}"
        not_contains: "No records"
        save_to: "_node_list_{{_verify_node_idx}}"
      - print: "Node list on {{_verify_node}} verified"

  # Enable seed_mode on seed nodes for DAG event acceptance
  - group: Enable seed_mode on seed nodes
    steps:
      - for: _seed_node
        in: "{{seed_nodes}}"
        steps:
          - cli: "chain seed -chain zerochain on"
            node: "{{_seed_node}}"
            save_to: _seed_mode_result
          - print: "seed_mode on {{_seed_node}}: {{_seed_mode_result}}"

  # GDB now populated — balancer will return nodes — wait for online
  - wait_network: online
    nodes: "{{_active_nodes}}"
    timeout: 120

  # Create wallets dynamically for all nodes
  - group: Create wallets
    defaults:
      cli:
        sign: "sig_dil"
    steps:
      - for: node_idx
        in: "{{root_indices}}"
        steps:
          - set: _wallet_idx
            value: "node_idx - 1"
            eval: true
          - set: _wallet_node
            value: "node-{{node_idx}}"
          - set: _wallet_name
            value: "{{network_name}}_root_{{_wallet_idx}}"
          - cli: "wallet new -w {{_wallet_name}}"
            node: "{{_wallet_node}}"
      
      - for: node_idx
        in: "{{master_indices}}"
        steps:
          - set: _wallet_idx
            value: "node_idx - root_count - 1"
            eval: true
          - set: _wallet_node
            value: "node-{{node_idx}}"
          - set: _wallet_name
            value: "{{network_name}}_master_{{_wallet_idx}}"
          - cli: "wallet new -w {{_wallet_name}}"
            node: "{{_wallet_node}}"
      
      - for: node_idx
        in: "{{full_indices}}"
        steps:
          - set: _wallet_idx
            value: "node_idx - root_count - master_count - 1"
            eval: true
          - set: _wallet_node
            value: "node-{{node_idx}}"
          - set: _wallet_name
            value: "{{network_name}}_full_{{_wallet_idx}}"
          - cli: "wallet new -w {{_wallet_name}}"
            node: "{{_wallet_node}}"
  
  # Get fee_addr from first root wallet
  - cli: "wallet info -w {{network_name}}_root_0"
    node: "{{first_root}}"
    save_wallet: fee_addr

  - wait: global_db_sync
    nodes: "{{root_nodes}}"
    timeout: 120
 
  # Verify network is fully connected
  - cli: "net get status"
    node: "{{first_root}}"
    save_to: _net_status_before_genesis
  - print: "Network status before genesis: {{_net_status_before_genesis}}"
  
  # Genesis Event - Token Declaration
  - set: root_certs_str
    value: "','.join([f'{network_name}.root.pvt.{i}' for i in range(root_count)])"
    eval: true

  - group: Genesis Event - Token Declaration
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "zerochain"
    steps:
      - cli: "token_decl -token {{native_ticker}} -total_supply 0 -decimals 18 -signs_emission {{root_count}} -signs_total {{root_count}} -type CF20 -certs {{root_certs_str}}"
        save_hash: token_hash
        save_to: _token_decl_result
      - print: "Token decl result: {{_token_decl_result}}"

      - cli: "mempool list"
        save_to: _mempool_before_proc
      - print: "Mempool before proc_all: {{_mempool_before_proc}}"

      - cli: "mempool proc_all"
        save_to: _mempool_proc_result
      - print: "Mempool proc_all result: {{_mempool_proc_result}}"

      - wait: chain_data_propagation
        nodes: "{{root_nodes}}"
        chain: zerochain
        timeout: 120

      - print: "✓ Token declaration event propagated to all root nodes"

      - cli: "token list"
        contains: "tokens: 1"
      
      - cli: "global_db flush"
      
      - cli: "dag event list"
        save_to: _dag_events
      
      - print: "DAG events after round complete: {{_dag_events}}"
      
      - set: _genesis_found_node
        value: ""
      - set: genesis_event_hash
        value: ""
        
      - for: _hash_node
        in: "{{root_nodes}}"
        steps:
          - cli: "dag event last -chain zerochain"
            node: "{{_hash_node}}"
            save_to: _event_last_output
          - set: _has_event
            value: "'0x' in _event_last_output and 'empty' not in _event_last_output"
            eval: true
          - print: "Node {{_hash_node}} event last: has_event={{_has_event}}"
          - set: _should_extract
            value: "_has_event and not genesis_event_hash"
            eval: true
          - set: genesis_event_hash
            value: "(_event_last_output.split('last_event_hash:')[1].split()[0].strip() if 'last_event_hash:' in _event_last_output else _event_last_output.split('Last event hash:')[1].split()[0].strip() if 'Last event hash:' in _event_last_output else '') if _should_extract else genesis_event_hash"
            eval: true
          - set: _genesis_found_node
            value: "_hash_node if _should_extract else _genesis_found_node"
            eval: true
      
      - print: "Genesis event hash: {{genesis_event_hash}} (found on {{_genesis_found_node}})"
  
  # Set static genesis event on all active nodes
  - config: "{{network_name}}/zerochain"
    nodes: "{{_active_nodes}}"
    set:
      static_genesis_event: "{{genesis_event_hash}}"
      is_static_genesis_event: "true"
  
  # Disable seed_mode on seed nodes via CLI
  - group: Disable seed_mode on seed nodes
    steps:
      - for: _seed_node
        in: "{{seed_nodes}}"
        steps:
          - cli: "chain seed -chain zerochain off"
            node: "{{_seed_node}}"
  
  - group: Create stake orders for validators
    steps:
      - for: node_idx
        in: "{{master_indices}}"
        steps:
          - set: _cert_idx
            value: "node_idx - root_count - 1"
            eval: true
          - set: _stake_node
            value: "node-{{node_idx}}"
          - set: _stake_cert
            value: "{{network_name}}.master.pvt.{{_cert_idx}}"
          - cli: "srv_stake order create -net {{network_name}} -value 0.05e+18 -cert {{_stake_cert}}"
            node: "{{_stake_node}}"
            save: stake_order_result
  
  - docker_op: restart
    services: "{{_active_nodes}}"
  
  - wait_network: online
    nodes: "{{_active_nodes}}"
    timeout: 60
  
  - wait: global_db_sync
    node: "{{first_root}}"
    timeout: 60
  
  # Token Emission
  - set: all_root_certs
    value: "','.join([f'{network_name}.root.pvt.{i}' for i in range(root_count)])"
    eval: true
  
  - group: Token Emission (Manual Round Consensus)
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "zerochain"
        token: "{{native_ticker}}"
    steps:
      - cli: "token_emit -no_base_tx -emission_value 10.0e+54 -addr {{fee_addr}} -certs {{all_root_certs}}"
        save_hash: emission_datum_hash
      
      - set: emission_hash
        value: "emission_datum_hash"
        eval: true
      
      # 6.x: mempool proc_all replaces deprecated mempool proc -datum
      - cli: "mempool proc_all"
        save_to: _emission_mempool_result
      - print: "Emission mempool proc_all result: {{_emission_mempool_result}}"

      - for: _sync_node
        in: "{{root_nodes}}"
        steps:
          - wait: cli
            cmd: "dag event list -chain zerochain"
            node: "{{_sync_node}}"
            contains: "total_events: 2"
            timeout: 120
            interval: 3

      - print: "✓ Emission event propagated to all root nodes"

      - cli: "dag event list -chain zerochain"
        save_to: _dag_events_after_emission
      - print: "DAG events after emission: {{_dag_events_after_emission}}"
      
      - cli: "ledger list coins"
        contains: "{{native_ticker}}"

  # Final verification on all root nodes
  - for: _verify_node
    in: "{{root_nodes}}"
    steps:
      - cli: "dag event list -chain zerochain"
        node: "{{_verify_node}}"
        save_to: _final_events
      - print: "Final verification - {{_verify_node}}: {{_final_events}}"

  - config: "{{network_name}}/main"
    nodes: "{{_active_nodes}}"
    set:
      fee_addr: "{{fee_addr}}"
