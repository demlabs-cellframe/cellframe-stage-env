name: PHASE 2 - ESBocs Genesis
description: Create mainchain genesis block from emission

includes:
  - common/set_net_default.yml

network:
  topology: default
  name: stagenet

setup:
  # Enable seed_mode on ALL root and master nodes to accept genesis block
  - config: "cellframe-node"
    nodes: [node-1, node-2, node-3, node-4, node-5]
    set:
      seed_mode: "true"
  
  - docker_op: restart
    services: [node-1, node-2, node-3, node-4, node-5]
  
  - wait_network: online
    nodes: [node-1, node-2, node-3, node-4, node-5]
    timeout: 60

test:
  - group: Genesis Block - Create from emission
    defaults:
      node: node-1
      cli:
        chain: "main"
        token: "TCELL"
    steps:
      - cli: "tx_create -chain_emission zerochain -from_emission {{emission_hash}} -value 10.0e+54 -to_addr {{fee_addr}} -fee 5.0e+18 -cert stagenet.root.pvt.0"
        save_hash: mainchain_genesis_tx
      
      - wait: "180s"
      
      - cli: "block list"
        node: node-3
        expect_output: "have blocks:"
  
  - cli: "block list -chain main"
    node: node-3
    save_hash: genesis_block_hash
  
  - config: "stagenet/main"
    nodes: [node-1, node-2, node-3, node-4, node-5]
    set:
      static_genesis_block: "{{genesis_block_hash}}"
      is_static_genesis_block: "true"
  
  - config: "stagenet/zerochain"
    nodes: [node-1, node-2]
    set:
      is_add_directly: "false"
  
  - config: "cellframe-node"
    nodes: [node-1, node-2, node-3]
    set:
      seed_mode: "false"
  
  - docker_op: restart
    services: [node-1, node-2, node-3, node-4, node-5, node-6]
  
  - wait_network: online
    nodes: [node-1, node-2, node-3, node-4, node-5]
    timeout: 60
  
  - wait: "40s"

check:
  - cli: "net get status"
    node: node-3
    expect_output: "NET_STATE_ONLINE"
  
  - cli: "block list -chain main"
    node: node-1
    expect_output: "have blocks:"
  
  - cli: "token list"
    node: node-1
    expect_output: "tokens:"
