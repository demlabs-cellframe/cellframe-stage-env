name: PHASE 2 - ESBocs Genesis
description: Create mainchain genesis block from emission (dynamic topology)

includes:
  - common/set_net_default.yml

network:
  topology: default
  name: stagenet

setup:
  # Enable seed_mode on ALL root and master nodes to accept genesis block
  - python: |
      root_nodes = ctx.get('root_nodes')
      master_nodes = ctx.get('master_nodes')
      ctx.set_variable('_active_nodes', root_nodes + master_nodes)
  
  - config: "cellframe-node"
    nodes: "{{_active_nodes}}"
    set:
      seed_mode: "true"
  
  - docker_op: restart
    services: "{{_active_nodes}}"
  
  - wait_network: online
    nodes: "{{_active_nodes}}"
    timeout: 60

test:
  - group: Genesis Block - Create from emission
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "main"
        token: "TCELL"
    steps:
      - cli: "tx_create -chain_emission zerochain -from_emission {{emission_hash}} -value 10.0e+54 -to_addr {{fee_addr}} -fee 5.0e+18 -cert stagenet.root.pvt.0"
        save_hash: mainchain_genesis_tx
      
      - wait: "180s"
      
      - cli: "block list"
        node: "{{first_master}}"
        expect_output: "have blocks:"
  
  - cli: "block list -chain main"
    node: "{{first_master}}"
    save_hash: genesis_block_hash
  
  - config: "stagenet/main"
    nodes: "{{_active_nodes}}"
    set:
      static_genesis_block: "{{genesis_block_hash}}"
      is_static_genesis_block: "true"
  
  - config: "stagenet/zerochain"
    nodes: "{{root_nodes}}"
    set:
      is_add_directly: "false"
  
  - config: "cellframe-node"
    nodes: "{{seed_nodes}}"
    set:
      seed_mode: "false"
  
  - docker_op: restart
    services: "{{all_nodes}}"
  
  - wait_network: online
    nodes: "{{_active_nodes}}"
    timeout: 60
  
  - wait: "40s"

check:
  - cli: "net get status"
    node: "{{first_master}}"
    expect_output: "NET_STATE_ONLINE"
  
  - cli: "block list -chain main"
    node: "{{first_root}}"
    expect_output: "have blocks:"
  
  - cli: "token list"
    node: "{{first_root}}"
    expect_output: "tokens:"
