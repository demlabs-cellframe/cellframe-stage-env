name: PHASE 2 - ESBocs Genesis
description: Create mainchain genesis block from emission (following tests-in-docker pattern)

# Note: emission_hash, token_hash, fee_addr, genesis_event_hash, stake_order_hash are passed from Phase1 via context

includes:
  - common/set_net_default.yml

network:
  topology: default
  name: stagenet

test:
  # Enable seed_mode for MASTER nodes to create genesis block
  - config: "cellframe-node"
    nodes: [master-1, master-2, master-3]
    set:
      seed_mode: "true"
  
  # Set blocks_sign_cert for master node that will create genesis block
  # Note: blocks-sign-cert goes in NETWORK config (stagenet.cfg)
  - config: "stagenet"
    nodes: [master-1]
    set:
      blocks_sign_cert: "pvt.stagenet.master.0"
  
  # Wait for config files to be written
  - wait: "5s"
  
  # Restart master nodes to apply new configs
  - docker_op: restart
    services: [master-1, master-2, master-3]
  
  - wait_network: online
    nodes: [master-1, master-2, master-3]
    timeout: 60
  
  - wait: cli_ready
    nodes: [master-1]
    timeout: 40
  
  # =================================================================
  # GENESIS BLOCK CREATION (bx_create from tests-in-docker)
  # =================================================================
  # Note: srv_stake order was already created in Phase 1 before restart
  # Create basic transaction from emission to main chain
  # This is "_mempool_job bx_create" in tests-in-docker
  
  - group: Genesis Block - bx_create from emission
    defaults:
      node: root-1
    steps:
      # Get fee_collector address for receiving funds from emission
      - cli: "wallet info -w fee_collector"
        save_wallet: fee_collector_addr
      
      # Create basic transaction from emission to fee_collector on MAIN chain
      # Following tests-in-docker: tx_create -from_emission ... -fee ${FEE} -cert <cert>
      # Note: we use -wallet_fee instead of -cert as required by SDK
      - cli: "tx_create -from_emission {{emission_hash}} -value 100000.0 -to_addr {{fee_collector_addr}} -token TCELL -chain main -fee 0.05 -wallet_fee fee_collector"
        save_hash: mainchain_genesis_tx
      
      # Process the transaction in mempool on master node with signing cert
      - wait: "5s"
      - cli: "mempool proc -net stagenet -chain main -datum {{mainchain_genesis_tx}}"
        node: master-1
      
      # Wait for genesis block to be finalized (tests-in-docker uses different timing)
      - wait: "30s"
      
      # Verify block was created
      - cli: "block list -net stagenet -chain main"
        node: master-1
        expect_output: "have blocks:"
  
  # Get genesis block hash for configuration
  - cli: "block list -net stagenet -chain main"
    node: master-1
    save_hash: genesis_block_hash
  
  # Set static genesis block configuration for ALL nodes
  - config: "stagenet/main"
    nodes: [root-1, root-2, root-3, master-1, master-2, master-3]
    set:
      static_genesis_block: "{{genesis_block_hash}}"
      is_static_genesis_block: "true"
  
  # Disable seed_mode on master nodes
  - config: "cellframe-node"
    nodes: [master-1, master-2, master-3]
    set:
      seed_mode: "false"
  
  # Restart all nodes to apply static_genesis_block and seed_mode=false
  - docker_op: restart
    services: [root-1, root-2, root-3, master-1, master-2, master-3]
  
  - wait_network: online
    nodes: [root-1, root-2, root-3, master-1, master-2, master-3]
    timeout: 60
  
  - wait: "40s"

check:
  # Verify network is online
  - cli: "net -net stagenet get status"
    node: master-1
    expect_output: "NET_STATE_ONLINE"
  
  # Verify main chain has blocks
  - cli: "block list -net stagenet -chain main"
    node: root-1
    expect_output: "have blocks:"
  
  # Verify zerochain has token
  - cli: "token list"
    node: root-1
    expect_output: "tokens:"
