name: PHASE 2 - ESBocs Genesis
description: Create mainchain genesis block from emission (dynamic topology)

includes:
  - ../common/set_net_default.yml

network:
  topology: default
  name: "{{network_name}}"

setup:
  # NOTE: When running as part of genesis flow (via manager.py), 
  # containers are already running from phase1.
  # snapshot: restore is only needed when running phase2 standalone.
  
  # Build active nodes list (root + master)
  - set: _active_nodes
    value: "root_nodes + master_nodes"
    eval: true
  
  # Enable seed_mode on ALL root and master nodes to accept genesis block
  - config: "cellframe-node"
    nodes: "{{_active_nodes}}"
    set:
      seed_mode: "true"
  
  # Use 'start' instead of 'restart' to create containers if they don't exist
  # (e.g. after snapshot restore, master containers are not created yet)
  - docker_op: start
    services: "{{_active_nodes}}"
  
  - wait_network: online
    nodes: "{{_active_nodes}}"
    timeout: 60
  
  # Get fee_addr from wallet if not already set (e.g. after snapshot restore)
  - python: |
      if not ctx.get('fee_addr'):
          print("fee_addr not set, will get from wallet")
          ctx.set_variable('_need_fee_addr', True)
      else:
          print(f"fee_addr already set: {ctx.get('fee_addr')[:16]}...")
          ctx.set_variable('_need_fee_addr', False)
  
  - cli: "wallet info -w stagenet_root_0"
    node: "{{first_root}}"
    save_wallet: fee_addr
    ignore_error: true

test:
  # Check if genesis block already exists (skip creation if restored from snapshot)
  - group: Check and create genesis block
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "main"
        token: "{{native_ticker}}"
    steps:
      - cli: "block list -chain main"
        node: "{{first_master}}"
        save: _block_list_check
        ignore_error: true
      
      - python: |
          import subprocess
          import re
          block_list = ctx.get('_block_list_check', '')
          # Check for actual blocks (not just "have blocks: 0")
          block_match = re.search(r'have blocks:\s*(\d+)', block_list)
          block_count = int(block_match.group(1)) if block_match else 0
          has_blocks = block_count > 0
          
          if has_blocks:
              print("✓ Genesis block already exists - skipping tx_create")
              ctx.set_variable('_genesis_block_exists', True)
          else:
              print("Genesis block not found - creating from emission")
              ctx.set_variable('_genesis_block_exists', False)
              
              # Create tx from emission
              first_root = ctx.get('first_root')
              emission_hash = ctx.get('emission_hash')
              fee_addr = ctx.get('fee_addr')
              network_name = ctx.get('network_name')
              
              container = f"cellframe-stage-{first_root}"
              cmd = f"cellframe-node-cli tx_create -chain_emission zerochain -from_emission {emission_hash} -value 10.0e+54 -to_addr {fee_addr} -fee 5.0e+18 -cert {network_name}.root.pvt.0 -net {network_name} -chain main -token TCELL"
              
              result = subprocess.run(
                  ["docker", "exec", container, "sh", "-c", cmd],
                  capture_output=True, text=True
              )
              print(f"tx_create result: {result.stdout[:200] if result.stdout else result.stderr[:200]}")
              
              # Extract hash
              import re
              match = re.search(r'(0x[A-Fa-f0-9]{64})', result.stdout or '')
              if match:
                  ctx.set_variable('mainchain_genesis_tx', match.group(1))
                  print(f"✓ Genesis TX created: {match.group(1)[:16]}...")
              else:
                  print(f"Warning: Could not extract hash from tx_create")
      
      - python: |
          if not ctx.get('_genesis_block_exists'):
              import subprocess
              import time
              network_name = ctx.get('network_name')
              # Poll for genesis block (up to 180s)
              for attempt in range(36):  # 36 * 5s = 180s max
                  result = subprocess.run(
                      ["docker", "exec", f"cellframe-stage-{ctx.get('first_master')}", 
                       "cellframe-node-cli", "block", "list", "-chain", "main", "-net", network_name],
                      capture_output=True, text=True
                  )
                  import re
                  match = re.search(r'have blocks:\s*(\d+)', result.stdout)
                  if match and int(match.group(1)) > 0:
                      print(f"✓ Genesis block created after {(attempt+1)*5}s")
                      break
                  time.sleep(5)
              else:
                  print("⚠ Genesis block creation timed out")
          else:
              print("Skipping wait - genesis block already exists")
      
      - cli: "block list"
        node: "{{first_master}}"
        expect_output: "have blocks: [1-9]"
  
  - cli: "block list -chain main"
    node: "{{first_master}}"
    save_hash: genesis_block_hash
  
  - config: "{{network_name}}/main"
    nodes: "{{_active_nodes}}"
    set:
      static_genesis_block: "{{genesis_block_hash}}"
      is_static_genesis_block: "true"
  
  - config: "{{network_name}}/zerochain"
    nodes: "{{root_nodes}}"
    set:
      is_add_directly: "false"
  
  - config: "cellframe-node"
    nodes: "{{seed_nodes}}"
    set:
      seed_mode: "false"
  
  - docker_op: restart
    services: "{{all_nodes}}"
  
  - wait_network: online
    nodes: "{{_active_nodes}}"
    timeout: 60
  
  # Wait for nodes to sync (check block on master nodes)
  - python: |
      import subprocess
      import time
      import re
      for attempt in range(12):  # 12 * 5s = 60s max
          synced = 0
          for node in ctx.get('master_nodes', []):
              result = subprocess.run(
                  ["docker", "exec", f"cellframe-stage-{node}", 
                   "cellframe-node-cli", "block", "list", "-chain", "main", "-net", "stagenet"],
                  capture_output=True, text=True
              )
              match = re.search(r'have blocks:\s*(\d+)', result.stdout)
              if match and int(match.group(1)) > 0:
                  synced += 1
          if synced >= len(ctx.get('master_nodes', [])):
              print(f"✓ All master nodes synced genesis block after {(attempt+1)*5}s")
              break
          time.sleep(5)
      else:
          print(f"⚠ Sync timeout, {synced} of {len(ctx.get('master_nodes', []))} synced")
  
  # Create snapshot after Genesis completion
  - snapshot: create
    name: genesis_complete

check:
  - cli: "net get status"
    node: "{{first_master}}"
    expect_output: "NET_STATE_ONLINE"
  
  - cli: "block list -chain main"
    node: "{{first_root}}"
    expect_output: "have blocks:"
  
  - cli: "token list"
    node: "{{first_root}}"
    expect_output: "tokens:"

# NOTE: Snapshot creation is handled by manager.py after genesis flow completes.
# teardown with snapshot: create would be used for standalone phase execution.
