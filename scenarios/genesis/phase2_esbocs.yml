name: PHASE 2 - ESBocs Genesis
description: Create mainchain genesis block from emission (following tests-in-docker pattern)

# Note: emission_hash, token_hash, fee_addr, genesis_event_hash, stake_order_hash are passed from Phase1 via context

includes:
  - common/set_net_default.yml

network:
  topology: default
  name: stagenet

test:
  # NOTE: In tests-in-docker, blocks-sign-cert is NOT set before mainchain genesis
  # Genesis block is created WITHOUT blocks-sign-cert configuration
  # ESBocs will use auth_certs for initial block creation
  
  # Verify seed_mode is already enabled from Phase 1
  # No additional config changes needed before genesis block creation
  
  # =================================================================
  # GENESIS BLOCK CREATION (bx_create from tests-in-docker)
  # =================================================================
  # Following tests-in-docker testnet.sh lines 194-197:
  # MSG="Making a basic transaction"
  # PARAMETERS="-cert foobar.root.pvt.0"
  # _get_emission_hash "${ROOT[0]}"
  # _mempool_job ${ROOT[0]} bx_create
  #
  # bx_create in functions.sh (439-443):
  # tx_create -net ${NET} -chain ${CHAIN} -token ${TOKEN} \
  #   -emission_chain ${CHAIN} -from_emission ${DATUM} -value ${VALUE} \
  #   -to_addr ${ADDR} -fee ${FEE} ${PARAMETERS}
  # Where CHAIN='main', VALUE='10.0e+54', FEE='5.0e+18', PARAMETERS="-cert foobar.root.pvt.0"
  
  - group: Genesis Block - bx_create from emission
    defaults:
      node: node-1
    steps:
      # CRITICAL: bx_create is executed by ROOT[0], NOT MASTER!
      # Following tests-in-docker testnet.sh:194-197:
      # MSG="Making a basic transaction"
      # PARAMETERS="-cert foobar.root.pvt.0"   <-- ROOT cert!
      # _get_emission_hash "${ROOT[0]}"
      # _mempool_job ${ROOT[0]} bx_create      <-- ROOT[0] executes!
      #
      # bx_create in functions.sh (439-443):
      # tx_create -net ${NET} -chain ${CHAIN} -token ${TOKEN} \
      #   -emission_chain ${CHAIN} -from_emission ${DATUM} -value ${VALUE} \
      #   -to_addr ${ADDR} -fee ${FEE} ${PARAMETERS}
      # Where:
      #   CHAIN='main', VALUE='10.0e+54', FEE='5.0e+18', 
      #   PARAMETERS="-cert foobar.root.pvt.0", ADDR=fee_addr from ROOT[0]
      #
      # Create basic transaction from emission on MAIN chain (executed by root-1!)
      - cli: "tx_create -net stagenet -chain main -token TCELL -emission_chain main -from_emission {{emission_hash}} -value 10.0e+54 -to_addr {{fee_addr}} -fee 5.0e+18 -cert stagenet.root.pvt.0"
        save_hash: mainchain_genesis_tx
      
      # Wait for block to be created automatically (no mempool proc needed)
      # tests-in-docker waits up to 180s for block creation (functions.sh:819)
      - wait: "180s"
      
      # Verify block was created on MASTER node (block producer)
      - cli: "block list -net stagenet -chain main"
        node: node-3
        expect_output: "have blocks:"
  
  # Get genesis block hash for configuration
  - cli: "block list -net stagenet -chain main"
    node: node-3
    save_hash: genesis_block_hash
  
  # Set static genesis block configuration for ALL nodes
  # Following tests-in-docker testnet.sh:199-202
  # Topology: 2 ROOT + 3 MASTER + 1 FULL = 6 nodes
  - config: "stagenet/main"
    nodes: [node-1, node-2, node-3, node-4, node-5]
    set:
      static_genesis_block: "{{genesis_block_hash}}"
      is_static_genesis_block: "true"
  
  # Disable is_add_directly for production DAG-PoA consensus
  # After genesis, we want proper multi-node confirmation for events
  - config: "stagenet/zerochain"
    nodes: [node-1, node-2]
    set:
      is_add_directly: "false"
  
  # Disable seed_mode (following tests-in-docker testnet.sh:205-207)
  # _seed_mode "${MASTER[0]}" off
  # _seed_mode "${ROOT[0]}" off
  # _seed_mode "${ROOT[1]}" off
  - config: "cellframe-node"
    nodes: [node-1, node-2, node-3]
    set:
      seed_mode: "false"
  
  # Restart all nodes to apply static_genesis_block and seed_mode=false
  # Following tests-in-docker testnet.sh:208-210
  - docker_op: restart
    services: [node-1, node-2, node-3, node-4, node-5, node-6]
  
  - wait_network: online
    nodes: [node-1, node-2, node-3, node-4, node-5]
    timeout: 60
  
  - wait: "40s"

check:
  # Verify network is online
  - cli: "net -net stagenet get status"
    node: node-3
    expect_output: "NET_STATE_ONLINE"
  
  # Verify main chain has blocks
  - cli: "block list -net stagenet -chain main"
    node: node-1
    expect_output: "have blocks:"
  
  # Verify zerochain has token
  - cli: "token list"
    node: node-1
    expect_output: "tokens:"
