name: PHASE 2 - ESBocs Genesis
description: Create mainchain genesis block from emission (dynamic topology)

includes:
  - ../common/set_net_default.yml

network:
  topology: default
  name: "{{network_name}}"

# Restore from phase1 zerochain snapshot when running standalone
restore_snapshot: phase1_zerochain_genesis

setup:
  # NOTE: When running as part of genesis flow (via manager.py), 
  # containers are already running from phase1.
  # snapshot: restore is only needed when running phase2 standalone.
  
  # Build active nodes list (root + master)
  - set: _active_nodes
    value: "root_nodes + master_nodes"
    eval: true
  
  # Enable seed_mode on ALL active nodes (root + master) for genesis block creation
  # CRITICAL: seed_mode=true is REQUIRED for creating the FIRST block in mainchain!
  # After genesis block is created, seed_mode will be disabled for all nodes.
  - config: "cellframe-node"
    nodes: "{{_active_nodes}}"
    set:
      seed_mode: "true"

  # Wait for zerochain DAG to sync to master nodes before any operations
  # This ensures emission is available in ledger when validating tx_create
  - log: "Waiting for zerochain DAG sync to master nodes..."
  - set: _dag_synced
    value: "False"
  - while: "_dag_synced != 'True'"
    max_loops: 60
    steps:
      - cli: "dag event count -chain zerochain"
        node: "{{first_master}}"
        save: _dag_check
        ignore_error: true
      - extract: _event_count
        from: "{{_dag_check}}"
        pattern: "atom_in_events:\\s*(\\d+)"
        group: 1
        default: "0"
      - if: "int(_event_count) > 0"
        then:
          - set: _dag_synced
            value: "True"
          - log: "✓ Zerochain synced to master node ({{_event_count}} events)"
        else:
          - wait: "5s"

  - docker_op: restart
    services: "{{_active_nodes}}"
  
  - wait_network: online
    nodes: "{{_active_nodes}}"
    timeout: 60
    
  # Get fee_addr from wallet (always fetch - it's cheap and ensures consistency)
  - cli: "wallet info -w stagenet_root_0"
    node: "{{first_root}}"
    save_wallet: fee_addr
  
  - log: "fee_addr: {{fee_addr}}"

  # Get emission_hash from zerochain DAG events (if not already set from Phase 1)
  # This makes Phase 2 self-sufficient and allows it to run after snapshot restore
  - cli: "dag event list -chain zerochain -limit 10"
    node: "{{first_root}}"
    save: _dag_events_list
  
  - extract: _first_event_hash
    from: "{{_dag_events_list}}"
    pattern: "event_hash:\\s*(0x[a-fA-F0-9]+)"
    group: 1
    default: ""
  
  # Get the event dump to extract emission_hash
  - cli: "dag event dump -chain zerochain -event {{_first_event_hash}}"
    node: "{{first_root}}"
    save: _event_dump
  
  - extract: emission_hash
    from: "{{_event_dump}}"
    pattern: "emission_hash:\\s*(0x[a-fA-F0-9]+)"
    group: 1
    default: ""
  
  - log: "emission_hash: {{emission_hash}}"

test:
  # Check if genesis block already exists (skip creation if restored from snapshot)
  - group: Check and create genesis block
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "main"
        token: "{{native_ticker}}"
    steps:
      - cli: "block list -chain main"
        node: "{{first_master}}"
        save: _block_list_check
        ignore_error: true
      
      # Extract block count from output
      - extract: _block_count
        from: "{{_block_list_check}}"
        pattern: "have blocks:\\s*(\\d+)"
        group: 1
        default: "0"
      
      # Check if genesis block already exists
      - compute: _genesis_block_exists
        expr: "int(_block_count) > 0"
      
      - if: "_genesis_block_exists"
        then:
          - log: "✓ Genesis block already exists - skipping tx_create"
        else:
          - log: "Creating genesis TX from emission on root node..."
          # Create tx from emission on ROOT node (has root certificate)
          - cli: "tx_create -chain_emission zerochain -from_emission {{emission_hash}} -value 10.0e+54 -to_addr {{fee_addr}} -fee 5.0e+18 -cert {{network_name}}.root.pvt.0"
            node: "{{first_root}}"
            save_hash: mainchain_genesis_tx
            ignore_error: true
          
          - log: "✓ Genesis TX created: {{mainchain_genesis_tx}}"
          
          # Wait for datum to appear in mempool on master node (conditional waiter)
          - log: "Waiting for TX to sync to master mempool..."
          - wait: mempool
            datum: "{{mainchain_genesis_tx}}"
            node: "{{first_master}}"
            chain: main
            timeout: 60
          - log: "✓ TX synced to master mempool"
      
      # Wait for genesis block creation (conditional waiter)
      - if: "not _genesis_block_exists"
        then:
          - log: "Waiting for genesis block creation..."
          - wait: first_block
            nodes: "{{master_nodes}}"
            chain: main
            timeout: 120
          - log: "✓ Genesis block created"
      
      - cli: "block list"
        node: "{{first_master}}"
        expect_output: "have blocks: [1-9]"
  
  - cli: "block list -chain main"
    node: "{{first_master}}"
    save_hash: genesis_block_hash
  
  - config: "{{network_name}}/main"
    nodes: "{{_active_nodes}}"
    set:
      static_genesis_block: "{{genesis_block_hash}}"
      is_static_genesis_block: "true"
  
  - config: "{{network_name}}/zerochain"
    nodes: "{{root_nodes}}"
    set:
      is_add_directly: "false"
  
  # Disable seed_mode on ALL nodes after genesis block is created
  # This allows normal consensus operation
  - config: "cellframe-node"
    nodes: "{{all_nodes}}"
    set:
      seed_mode: "false"
  
  - docker_op: restart
    services: "{{all_nodes}}"
  
  - wait_network: online
    nodes: "{{_active_nodes}}"
    timeout: 60
  
  # Wait for first master node to have genesis block (sync check)
  - log: "Waiting for master nodes to sync genesis block..."
  - wait: first_block
    nodes: "{{master_nodes}}"
    chain: main
    timeout: 60
  
  - log: "✓ Genesis block synced to master nodes"
  
  # Create snapshot after Genesis completion
  - snapshot: create
    name: genesis_complete

check:
  - cli: "net get status"
    node: "{{first_master}}"
    expect_output: "NET_STATE_ONLINE"
  
  - cli: "block list -chain main"
    node: "{{first_root}}"
    expect_output: "have blocks:"
  
  - cli: "token list"
    node: "{{first_root}}"
    expect_output: "tokens:"

# NOTE: Snapshot creation is handled by manager.py after genesis flow completes.
# teardown with snapshot: create would be used for standalone phase execution.
