name: PHASE 2 - ESBocs Genesis
description: Initialize MASTER nodes with PoS delegation

# Note: emission_hash is passed from Phase1 via context
# Master nodes are already running (started in Phase1)

includes:
  - common/set_net_default.yml

test:
  # NO snapshot restore or container restart
  # Continuing from Phase1 - emission still in ledger memory
  
  # Wait for master-root links
  - wait_network: links_established
    nodes: [master-1, master-2, master-3, root-1, root-2, root-3]
    timeout: 120
  
  # Verify master wallets have balances from Phase1
  - group: Verify master wallet balances from Phase1
    steps:
      - loop: 3
        steps:
          - set: master_idx = "{{i}}"
          - set: wallet_name = "stagenet_master_{{i}}"
          
          # Verify balance
          - wait: wallet_balance
            node: root-1
            wallet: "{{wallet_name}}"
            token: TCELL
            balance: "> 1000"
            timeout: 60

  # Delegate keys via srv_stake
  - group: Delegate keys
    defaults:
      cli:
        chain: zerochain
    steps:
      - loop: 3
        steps:
          - set: master_idx = "{{i}}"
          - set: master_node = "master-{{iteration}}"
          - set: wallet_name = "stagenet_master_{{i}}"
          - set: cert_name = "pvt.stagenet.master.{{i}}"
          
          # Get node address
          - cli: "node dump"
            node: "{{master_node}}"
            save_node: "master_node_addr_{{master_idx}}"
          
          # Delegate key
          - set: node_addr = "locals()['master_node_addr_' + str(i)]"
            eval: true
          
          - cli: "srv_stake delegate -w {{wallet_name}} -value 100.0e+18 -cert {{cert_name}} -node_addr {{node_addr}} -fee 0.1"
            node: "{{master_node}}"
            save_hash: "delegation_hash_{{master_idx}}"
          
          - wait_for_datum: "{{delegation_hash_{{master_idx}}}}"
            node: "{{master_node}}"
            timeout_total: 120
  
  # GDB sync
  - group: GDB sync
    steps:
      - loop: 3
        steps:
          - set: node_name = "master-{{iteration}}"
          - cli: "net go sync"
            node: "{{node_name}}"
      
      - loop: 3
        steps:
          - set: node_name = "root-{{iteration}}"
          - cli: "net go sync"
            node: "{{node_name}}"
  
  - wait_network: sync_complete
    nodes: [master-1, master-2, master-3, root-1, root-2, root-3]
    timeout: 30
  
  # Verify delegations
  - wait: delegations_synced
    nodes: [master-1, master-2, master-3]
    expected_count: 3
    timeout: 60
  
  # Flush GDB
  - group: Flush GDB
    steps:
      - loop: 3
        steps:
          - set: node_name = "root-{{iteration}}"
          - cli: "global_db flush"
            node: "{{node_name}}"
      
      - loop: 3
        steps:
          - set: node_name = "master-{{iteration}}"
          - cli: "global_db flush"
            node: "{{node_name}}"
  
  # Restart for ESBocs activation
  - docker_op: restart
    services: [root-1, root-2, root-3, master-1, master-2, master-3]
  
  - wait_network: online
    nodes: [root-1, root-2, root-3, master-1, master-2, master-3]
    timeout: 60
  
  - wait_network: links_established
    nodes: [root-1, root-2, root-3, master-1, master-2, master-3]
    timeout: 120
  
  # Verify ESBocs consensus active
  - wait: esbocs_active
    nodes: [master-1]
    timeout: 60

check:
  - cli: "net get states -net stagenet"
    node: master-1
    contains: "NET_STATE_ONLINE"
