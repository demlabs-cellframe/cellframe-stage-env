name: PHASE 2 - ESBocs Genesis (v5.8)
description: |
  Create mainchain genesis block from emission (dynamic topology).
  v5.8: MDBX fixed, transports reworked — all static waits replaced
  with smart polling (wait: cli, wait_for_datum, block_created).

includes:
  - common/set_net_default.yml

network:
  topology: default
  name: "{{network_name}}"

setup:
  - set: _active_nodes
    value: "root_nodes + master_nodes"
    eval: true
  
  - config: "cellframe-node"
    nodes: "{{_active_nodes}}"
    set:
      seed_mode: "true"
  
  - docker_op: restart
    services: "{{_active_nodes}}"
  
  - wait_network: online
    nodes: "{{_active_nodes}}"
    timeout: 60
  
  - wait: global_db_sync
    node: "{{first_root}}"
    timeout: 60
  
  - cli: "wallet info -w {{network_name}}_root_0"
    node: "{{first_root}}"
    save_wallet: fee_addr

test:
  - group: Verify network connectivity and emission on root
    steps:
      - cli: "net get status"
        node: "{{first_root}}"
        contains: "NET_STATE_ONLINE"
      
      - cli: "ledger list coins"
        node: "{{first_root}}"
        contains: "{{native_ticker}}"
      
      - cli: "dag event list -chain zerochain"
        node: "{{first_root}}"
        save_to: _dag_events_output
      - print: "Root node zerochain events: {{_dag_events_output}}"
  
  - group: Wait for master nodes to sync
    description: Poll ledger on master until emission propagates via Global DB
    steps:
      - wait: global_db_sync
        node: "{{first_root}}"
        timeout: 60
      
      # v5.8: poll net status on master
      - wait: cli
        cmd: "net get status"
        node: "{{first_master}}"
        contains: "NET_STATE_ONLINE"
        timeout: 60
        interval: 5
  
  - group: Force chain sync if needed
    description: Ensure chains are synced from root to master
    steps:
      - cli: "net go sync"
        node: "{{first_master}}"

      - cli: "net go sync"
        node: "{{first_root}}"

      - wait: "10s"

      - cli: "net go sync"
        node: "{{first_master}}"
      
      # v5.8: poll ledger on master with smart waiter (ASAN needs more time)
      - wait: cli
        cmd: "ledger list coins"
        node: "{{first_master}}"
        contains: "{{native_ticker}}"
        timeout: 300
        interval: 5
      
      - print: "✓ Emission synced to master node ledger"
  
  - group: Genesis Block - Create from emission
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "main"
        token: "{{native_ticker}}"
    steps:
      - cli: "tx create -chain_emission zerochain -from_emission {{emission_hash}} -value 10.0e+54 -to_addr {{fee_addr}} -fee 5.0e+18 -cert {{network_name}}.root.pvt.0"
        save_hash: mainchain_genesis_tx
      
      - cli: "mempool proc -datum {{mainchain_genesis_tx}}"
      
      # v5.8: poll mempool on master instead of static wait
      - wait: cli
        cmd: "mempool list -chain main"
        node: "{{first_master}}"
        contains: "datum"
        timeout: 120
        interval: 5
      
      # v5.8: poll for genesis block creation instead of static 180s wait
      - wait: cli
        cmd: "block list"
        node: "{{first_master}}"
        contains: "have blocks: [1-9]"
        timeout: 300
        interval: 5
  
  - cli: "block list -chain main"
    node: "{{first_master}}"
    save_hash: genesis_block_hash
  
  - config: "{{network_name}}/main"
    nodes: "{{_active_nodes}}"
    set:
      static_genesis_block: "{{genesis_block_hash}}"
      is_static_genesis_block: "true"
  
  - config: "cellframe-node"
    nodes: "{{seed_nodes}}"
    set:
      seed_mode: "false"
  
  - docker_op: restart
    services: "{{all_nodes}}"
  
  - wait_network: online
    nodes: "{{_active_nodes}}"
    timeout: 60
  
  - wait: global_db_sync
    node: "{{first_root}}"
    timeout: 60
  
  - config: "{{network_name}}/main"
    nodes: "{{_active_nodes}}"
    set:
      fee_addr: "{{fee_addr}}"

check:
  - cli: "net get status"
    node: "{{first_master}}"
    contains: "NET_STATE_ONLINE"
  
  - cli: "block list -chain main"
    node: "{{first_root}}"
    contains: "have blocks:"
  
  - cli: "token list"
    node: "{{first_root}}"
    contains: "tokens:"
