name: COMPOSER - Poll Tests
description: Test poll create and vote operations via cellframe-tool-compose

includes:
  - ../common/set_net_default.yml

network:
  topology: default
  name: stagenet

# This scenario tests polling operations via cellframe-tool-compose:
# 1. poll create - create a new poll
# 2. poll vote - vote on existing poll

setup:
  # Restore from Primary snapshot
  - snapshot: restore
    name: primary_complete
    phase: full
  
  - python: |
      root_nodes = ctx.get('root_nodes')
      master_nodes = ctx.get('master_nodes')
      full_nodes = ctx.get('full_nodes', [])
      ctx.set_variable('_active_nodes', root_nodes + master_nodes + full_nodes)
  
  - docker_op: start
    services: "{{_active_nodes}}"
    detach: true
  
  - wait: "10s"
  
  - wait_network: online
    nodes: "{{_active_nodes}}"
    timeout: 120

test:
  # Setup test environment
  - group: Setup poll test environment
    defaults:
      node: "{{first_root}}"
    steps:
      - python: |
          import time
          root_count = ctx.get('root_count')
          
          ctx.set_variable('_compose_node', f"node-{root_count + 1}")
          
          # Get RPC IP
          node_ip = ctx.get('node_ip', {})
          rpc_ip = node_ip.get(f'node{root_count + 1}', '172.28.1.1')
          ctx.set_variable('_rpc_ip', rpc_ip)
          ctx.set_variable('_rpc_port', "8081")
          
          # Generate unique poll question
          ctx.set_variable('_poll_question', f"Test Poll {int(time.time())}")
      
      - cli: "wallet info -w stagenet_master_0"
        node: "{{_compose_node}}"
        save_wallet: master_0_addr

  # ============================================================
  # TEST 1: Create Poll via Compose
  # ============================================================
  
  - group: Create poll via compose
    steps:
      - bash: |
          TX_FILE="/tmp/poll_create.json"
          TX_SIGNED="/tmp/poll_create_signed.json"
          
          WALLET="stagenet_master_0"
          NET="stagenet"
          FEE="5.0e+18"
          RPC_IP="{{_rpc_ip}}"
          RPC_PORT="8081"
          
          # Poll parameters
          QUESTION="{{_poll_question}}"
          # Options separated by comma
          OPTIONS="Yes,No,Abstain"
          # Duration in seconds (1 day)
          DURATION="86400"
          
          echo "Composing poll create:"
          echo "  Question: $QUESTION"
          echo "  Options: $OPTIONS"
          echo "  Duration: $DURATION seconds"
          
          /cellframe-tool-compose poll create \
              -w "$WALLET" \
              -net "$NET" \
              -fee "$FEE" \
              -question "$QUESTION" \
              -options "$OPTIONS" \
              -duration "$DURATION" \
              -url "$RPC_IP" \
              -port "$RPC_PORT" \
              -out "$TX_FILE"
          
          if [ -f "$TX_FILE" ]; then
              echo "Poll create composed: $TX_FILE"
          else
              echo "WARNING: Poll create composition may have failed"
              echo "{}" > "$TX_FILE"
          fi
        node: "{{_compose_node}}"
        save: poll_create_compose
      
      - bash: |
          TX_FILE="/tmp/poll_create.json"
          TX_SIGNED="/tmp/poll_create_signed.json"
          WALLET_FILE="/opt/cellframe-node/var/lib/wallet/stagenet_master_0.dwallet"
          
          if [ -s "$TX_FILE" ] && [ "$(cat $TX_FILE)" != "{}" ]; then
              /cellframe-tool-sign -f "$TX_FILE" -o "$TX_SIGNED" -w "$WALLET_FILE"
              
              if [ -f "$TX_SIGNED" ]; then
                  RESULT=$(/opt/cellframe-node/bin/cellframe-node-cli mempool_add \
                      -net stagenet -chain main -json "$TX_SIGNED")
                  echo "$RESULT"
              fi
          else
              echo "Skipping sign - no valid TX file"
          fi
        node: "{{_compose_node}}"
        save: poll_create_result
      
      - python: |
          import re
          result = ctx.get('poll_create_result', '')
          match = re.search(r'(0x[a-fA-F0-9]{64})', result)
          if match:
              ctx.set_variable('_poll_hash', match.group(1))
              print(f"Poll TX hash: {match.group(1)}")
          else:
              print("Poll creation did not return hash (may be expected)")
      
      - wait: "60s"

  # ============================================================
  # TEST 2: List Polls
  # ============================================================
  
  - group: List polls
    defaults:
      node: "{{first_root}}"
    steps:
      - cli: "poll list"
        save: poll_list
      
      - python: |
          polls = ctx.get('poll_list', '')
          poll_q = ctx.get('_poll_question', '')
          if poll_q in polls:
              print(f"✓ Poll '{poll_q}' found in list")
          else:
              print("INFO: Poll not found in list (may use different format)")

  # ============================================================
  # TEST 3: Vote on Poll via Compose
  # ============================================================
  
  - group: Vote on poll via compose
    steps:
      - python: |
          poll_hash = ctx.get('_poll_hash', '')
          if poll_hash:
              ctx.set_variable('_can_vote', 'true')
          else:
              ctx.set_variable('_can_vote', 'false')
              print("Skipping vote - no poll hash available")
      
      - bash: |
          if [ "{{_can_vote}}" != "true" ]; then
              echo "Skipping vote test"
              exit 0
          fi
          
          TX_FILE="/tmp/poll_vote.json"
          TX_SIGNED="/tmp/poll_vote_signed.json"
          
          WALLET="stagenet_root_0"
          POLL_HASH="{{_poll_hash}}"
          NET="stagenet"
          FEE="5.0e+18"
          RPC_IP="{{_rpc_ip}}"
          RPC_PORT="8081"
          
          # Vote for option 0 (Yes)
          OPTION_IDX="0"
          
          echo "Composing poll vote:"
          echo "  Poll: $POLL_HASH"
          echo "  Option index: $OPTION_IDX"
          
          /cellframe-tool-compose poll vote \
              -w "$WALLET" \
              -net "$NET" \
              -fee "$FEE" \
              -poll "$POLL_HASH" \
              -option "$OPTION_IDX" \
              -url "$RPC_IP" \
              -port "$RPC_PORT" \
              -out "$TX_FILE"
          
          if [ -f "$TX_FILE" ]; then
              echo "Poll vote composed: $TX_FILE"
              
              WALLET_FILE="/opt/cellframe-node/var/lib/wallet/stagenet_root_0.dwallet"
              /cellframe-tool-sign -f "$TX_FILE" -o "$TX_SIGNED" -w "$WALLET_FILE"
              
              if [ -f "$TX_SIGNED" ]; then
                  RESULT=$(/opt/cellframe-node/bin/cellframe-node-cli mempool_add \
                      -net stagenet -chain main -json "$TX_SIGNED")
                  echo "$RESULT"
              fi
          else
              echo "WARNING: Poll vote composition may have failed"
          fi
        node: "{{first_root}}"
        save: poll_vote_compose
      
      - python: |
          import re
          result = ctx.get('poll_vote_compose', '')
          match = re.search(r'(0x[a-fA-F0-9]{64})', result)
          if match:
              ctx.set_variable('_vote_hash', match.group(1))
              print(f"Vote TX hash: {match.group(1)}")
      
      - wait: "60s"

  # ============================================================
  # TEST 4: Second Vote from Different Wallet
  # ============================================================
  
  - group: Second vote on poll
    steps:
      - bash: |
          if [ "{{_can_vote}}" != "true" ]; then
              echo "Skipping second vote test"
              exit 0
          fi
          
          TX_FILE="/tmp/poll_vote2.json"
          TX_SIGNED="/tmp/poll_vote2_signed.json"
          
          WALLET="stagenet_master_0"
          POLL_HASH="{{_poll_hash}}"
          NET="stagenet"
          FEE="5.0e+18"
          RPC_IP="{{_rpc_ip}}"
          RPC_PORT="8081"
          
          # Vote for option 1 (No)
          OPTION_IDX="1"
          
          echo "Composing second poll vote:"
          echo "  Poll: $POLL_HASH"
          echo "  Option index: $OPTION_IDX (No)"
          
          /cellframe-tool-compose poll vote \
              -w "$WALLET" \
              -net "$NET" \
              -fee "$FEE" \
              -poll "$POLL_HASH" \
              -option "$OPTION_IDX" \
              -url "$RPC_IP" \
              -port "$RPC_PORT" \
              -out "$TX_FILE"
          
          if [ -f "$TX_FILE" ]; then
              echo "Second poll vote composed: $TX_FILE"
              
              WALLET_FILE="/opt/cellframe-node/var/lib/wallet/stagenet_master_0.dwallet"
              /cellframe-tool-sign -f "$TX_FILE" -o "$TX_SIGNED" -w "$WALLET_FILE"
              
              if [ -f "$TX_SIGNED" ]; then
                  RESULT=$(/opt/cellframe-node/bin/cellframe-node-cli mempool_add \
                      -net stagenet -chain main -json "$TX_SIGNED")
                  echo "$RESULT"
              fi
          else
              echo "WARNING: Second poll vote composition may have failed"
          fi
        node: "{{_compose_node}}"
        save: poll_vote2_compose
      
      - wait: "60s"

  # ============================================================
  # TEST 5: Get Poll Results
  # ============================================================
  
  - group: Get poll results
    defaults:
      node: "{{first_root}}"
    steps:
      - python: |
          poll_hash = ctx.get('_poll_hash', '')
          if poll_hash:
              ctx.set_variable('_has_poll', 'true')
          else:
              ctx.set_variable('_has_poll', 'false')
      
      - cli: "poll info -hash {{_poll_hash}}"
        save: poll_info
      
      - python: |
          poll_info = ctx.get('poll_info', '')
          print("\n=== Poll Test Summary ===")
          print(f"Poll question: {ctx.get('_poll_question', 'N/A')}")
          print(f"Poll hash: {ctx.get('_poll_hash', 'N/A')}")
          print(f"Vote 1 hash: {ctx.get('_vote_hash', 'N/A')}")
          print(f"\nPoll info:\n{poll_info[:500] if len(poll_info) > 500 else poll_info}")

  # Cleanup
  - group: Cleanup
    steps:
      - bash: |
          rm -f /tmp/poll_*.json
        node: "{{_compose_node}}"
      
      - bash: |
          rm -f /tmp/poll_*.json
        node: "{{first_root}}"

check:
  - cli: "net get status"
    node: "{{first_root}}"
    expect_output: "NET_STATE_ONLINE"
  
  - cli: "block list -chain main"
    node: "{{first_root}}"
    expect_output: "have blocks:"

