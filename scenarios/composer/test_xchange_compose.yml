name: COMPOSER - DEX/Exchange Tests
description: Test srv_xchange operations via cellframe-tool-compose

includes:
  - ../common/set_net_default.yml

network:
  topology: default
  name: stagenet

# This scenario tests DEX (exchange) operations via cellframe-tool-compose:
# 1. srv_xchange compose - create exchange order
# 2. srv_xchange purchase - execute purchase from order
# 3. srv_xchange order remove - remove exchange order
#
# Note: Requires a second token for exchange operations.
# This scenario creates a test token TSWAP for exchange testing.

setup:
  # Restore from Primary snapshot
  - snapshot: restore
    name: primary_complete
    phase: full
  
  - python: |
      root_nodes = ctx.get('root_nodes')
      master_nodes = ctx.get('master_nodes')
      full_nodes = ctx.get('full_nodes', [])
      ctx.set_variable('_active_nodes', root_nodes + master_nodes + full_nodes)
  
  - docker_op: start
    services: "{{_active_nodes}}"
    detach: true
  
  - wait: "10s"
  
  - wait_network: online
    nodes: "{{_active_nodes}}"
    timeout: 120

test:
  # Setup test environment
  - group: Setup exchange test environment
    defaults:
      node: "{{first_root}}"
    steps:
      - python: |
          root_count = ctx.get('root_count')
          master_count = ctx.get('master_count')
          
          ctx.set_variable('_compose_node', f"node-{root_count + 1}")
          
          # Get RPC IP
          node_ip = ctx.get('node_ip', {})
          rpc_ip = node_ip.get(f'node{root_count + 1}', '172.28.1.1')
          ctx.set_variable('_rpc_ip', rpc_ip)
          ctx.set_variable('_rpc_port', "8081")
      
      - cli: "wallet info -w stagenet_root_0"
        save_wallet: root_0_addr
      
      - cli: "wallet info -w stagenet_master_0"
        node: "{{_compose_node}}"
        save_wallet: master_0_addr

  # Create secondary token for exchange
  - group: Create secondary token for exchange
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "zerochain"
    steps:
      - python: |
          root_count = ctx.get('root_count')
          certs = [f"stagenet.root.pvt.{i}" for i in range(root_count)]
          ctx.set_variable('_root_certs', ",".join(certs))
      
      # Declare TSWAP token
      - cli: "token_decl -token TSWAP -total_supply 0 -decimals 18 -signs_emission {{root_count}} -signs_total {{root_count}} -type CF20 -certs {{_root_certs}}"
        save_hash: tswap_decl_hash
      
      - wait: "5s"
      
      - cli: "mempool proc -datum {{tswap_decl_hash}}"
      
      - wait: "60s"
      
      # Emit TSWAP tokens
      - cli: "token_emit -token TSWAP -no_base_tx -emission_value 1.0e+48 -addr {{master_0_addr}} -certs {{_root_certs}}"
        save_hash: tswap_emit_hash
      
      - wait: "5s"
      
      - cli: "mempool proc -datum {{tswap_emit_hash}}"
      
      - wait: "60s"
      
      # Create base TX from emission for mainchain
      - python: |
          import re
          emit_hash = ctx.get('tswap_emit_hash', '')
          # Extract emission hash for base TX
          ctx.set_variable('_tswap_emission', emit_hash)
      
      - cli: "tx_create -chain_emission zerochain -from_emission {{_tswap_emission}} -value 1.0e+48 -to_addr {{master_0_addr}} -token TSWAP -fee 5.0e+18 -cert stagenet.root.pvt.0"
        save_hash: tswap_base_tx
      
      - wait: "120s"
      
      # Verify TSWAP token exists
      - cli: "token list"
        contains: "TSWAP"

  # ============================================================
  # TEST 1: Create Exchange Order via Compose
  # ============================================================
  
  - group: Create exchange order via compose
    steps:
      - bash: |
          TX_FILE="/tmp/xchange_create.json"
          TX_SIGNED="/tmp/xchange_create_signed.json"
          
          WALLET="stagenet_master_0"
          VALUE_SELL="1000.0"
          VALUE_BUY="500.0"
          TOKEN_SELL="TSWAP"
          TOKEN_BUY="TCELL"
          FEE="5.0e+18"
          NET="stagenet"
          RPC_IP="{{_rpc_ip}}"
          RPC_PORT="8081"
          
          echo "Composing srv_xchange order:"
          echo "  Sell: $VALUE_SELL $TOKEN_SELL"
          echo "  Buy: $VALUE_BUY $TOKEN_BUY"
          echo "  Rate: 0.5 TCELL per TSWAP"
          
          /cellframe-tool-compose srv_xchange compose \
              -w "$WALLET" \
              -net "$NET" \
              -token_sell "$TOKEN_SELL" \
              -token_buy "$TOKEN_BUY" \
              -value "$VALUE_SELL" \
              -rate "0.5" \
              -fee "$FEE" \
              -url "$RPC_IP" \
              -port "$RPC_PORT" \
              -out "$TX_FILE"
          
          if [ -f "$TX_FILE" ]; then
              echo "Exchange order composed: $TX_FILE"
          else
              echo "WARNING: Exchange order composition may have failed"
              echo "{}" > "$TX_FILE"
          fi
        node: "{{_compose_node}}"
        save: xchange_create_compose
      
      - bash: |
          TX_FILE="/tmp/xchange_create.json"
          TX_SIGNED="/tmp/xchange_create_signed.json"
          WALLET_FILE="/opt/cellframe-node/var/lib/wallet/stagenet_master_0.dwallet"
          
          if [ -s "$TX_FILE" ] && [ "$(cat $TX_FILE)" != "{}" ]; then
              /cellframe-tool-sign -f "$TX_FILE" -o "$TX_SIGNED" -w "$WALLET_FILE"
              
              if [ -f "$TX_SIGNED" ]; then
                  RESULT=$(/opt/cellframe-node/bin/cellframe-node-cli mempool_add \
                      -net stagenet -chain main -json "$TX_SIGNED")
                  echo "$RESULT"
              fi
          else
              echo "Skipping sign - no valid TX file"
          fi
        node: "{{_compose_node}}"
        save: xchange_create_result
      
      - python: |
          import re
          result = ctx.get('xchange_create_result', '')
          match = re.search(r'(0x[a-fA-F0-9]{64})', result)
          if match:
              ctx.set_variable('_xchange_order_hash', match.group(1))
              print(f"Exchange order TX hash: {match.group(1)}")
      
      - wait: "60s"

  # ============================================================
  # TEST 2: List Exchange Orders
  # ============================================================
  
  - group: List exchange orders
    defaults:
      node: "{{first_root}}"
    steps:
      - cli: "srv_xchange list orders"
        save: xchange_orders_list
      
      - python: |
          orders = ctx.get('xchange_orders_list', '')
          if 'TSWAP' in orders and 'TCELL' in orders:
              print("✓ Exchange order found in list")
          else:
              print("INFO: Exchange order list may be empty or different format")

  # ============================================================
  # TEST 3: Purchase from Exchange Order via Compose
  # ============================================================
  
  - group: Purchase from exchange order
    steps:
      - python: |
          order_hash = ctx.get('_xchange_order_hash', '')
          if order_hash:
              ctx.set_variable('_can_purchase', 'true')
          else:
              ctx.set_variable('_can_purchase', 'false')
              print("Skipping purchase - no order to purchase from")
      
      - bash: |
          if [ "{{_can_purchase}}" != "true" ]; then
              echo "Skipping purchase test"
              exit 0
          fi
          
          TX_FILE="/tmp/xchange_purchase.json"
          TX_SIGNED="/tmp/xchange_purchase_signed.json"
          
          WALLET="stagenet_root_0"
          ORDER_TX="{{_xchange_order_hash}}"
          VALUE="100.0"
          FEE="5.0e+18"
          NET="stagenet"
          RPC_IP="{{_rpc_ip}}"
          RPC_PORT="8081"
          
          echo "Composing srv_xchange purchase:"
          echo "  Order: $ORDER_TX"
          echo "  Value: $VALUE"
          
          /cellframe-tool-compose srv_xchange purchase \
              -w "$WALLET" \
              -net "$NET" \
              -order "$ORDER_TX" \
              -value "$VALUE" \
              -fee "$FEE" \
              -url "$RPC_IP" \
              -port "$RPC_PORT" \
              -out "$TX_FILE"
          
          if [ -f "$TX_FILE" ]; then
              echo "Exchange purchase composed: $TX_FILE"
          else
              echo "WARNING: Exchange purchase composition may have failed"
          fi
        node: "{{first_root}}"
        save: xchange_purchase_compose
      
      - wait: "60s"

  # ============================================================
  # TEST 4: Remove Exchange Order via Compose
  # ============================================================
  
  - group: Remove exchange order
    steps:
      - python: |
          order_hash = ctx.get('_xchange_order_hash', '')
          if order_hash:
              ctx.set_variable('_can_remove', 'true')
          else:
              ctx.set_variable('_can_remove', 'false')
              print("Skipping remove - no order to remove")
      
      - bash: |
          if [ "{{_can_remove}}" != "true" ]; then
              echo "Skipping order remove test"
              exit 0
          fi
          
          TX_FILE="/tmp/xchange_remove.json"
          TX_SIGNED="/tmp/xchange_remove_signed.json"
          
          WALLET="stagenet_master_0"
          ORDER_TX="{{_xchange_order_hash}}"
          FEE="5.0e+18"
          NET="stagenet"
          RPC_IP="{{_rpc_ip}}"
          RPC_PORT="8081"
          
          echo "Composing srv_xchange order remove:"
          echo "  Order: $ORDER_TX"
          
          /cellframe-tool-compose srv_xchange order remove \
              -w "$WALLET" \
              -net "$NET" \
              -order "$ORDER_TX" \
              -fee "$FEE" \
              -url "$RPC_IP" \
              -port "$RPC_PORT" \
              -out "$TX_FILE"
          
          if [ -f "$TX_FILE" ]; then
              echo "Exchange order remove composed: $TX_FILE"
              
              WALLET_FILE="/opt/cellframe-node/var/lib/wallet/stagenet_master_0.dwallet"
              /cellframe-tool-sign -f "$TX_FILE" -o "$TX_SIGNED" -w "$WALLET_FILE"
              
              if [ -f "$TX_SIGNED" ]; then
                  RESULT=$(/opt/cellframe-node/bin/cellframe-node-cli mempool_add \
                      -net stagenet -chain main -json "$TX_SIGNED")
                  echo "$RESULT"
              fi
          else
              echo "WARNING: Exchange order remove composition may have failed"
          fi
        node: "{{_compose_node}}"
        save: xchange_remove_compose
      
      - wait: "60s"

  # Cleanup
  - group: Cleanup
    steps:
      - bash: |
          rm -f /tmp/xchange_*.json
        node: "{{_compose_node}}"

check:
  - cli: "token list"
    node: "{{first_root}}"
    contains: "TSWAP"
  
  - cli: "net get status"
    node: "{{first_root}}"
    expect_output: "NET_STATE_ONLINE"
  
  - cli: "block list -chain main"
    node: "{{first_root}}"
    expect_output: "have blocks:"

