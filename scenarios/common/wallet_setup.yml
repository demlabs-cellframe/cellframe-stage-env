# Wallet Setup Template
# Creates test wallet and exports address (dynamic topology)

includes:
  - ../common/set_net_default.yml

setup:
  - cli: "wallet new -w test_wallet"
    node: "{{first_root}}"
    save: wallet_addr
    wait: 1s
  
  - cli: "wallet list"
    node: "{{first_root}}"
    contains: test_wallet
