# Dynamic Node Addition Scenario
# Tests adding new nodes to running network through balancer

name: Dynamic Node Addition Test
description: Test adding nodes dynamically to running network through balancer
author: Stage-Env
tags: [network, balancer, dynamic]
version: "1.0"

includes:
  - common/set_net_default.yml

# Start with minimal network
network:
  topology: default
  name: stagenet
  nodes:
    - name: node1
      role: root
      validator: true
    
    - name: node2
      role: root
      validator: false
    
    - name: node3
      role: root
      validator: false
    
    - name: node4
      role: master
      validator: true
    
    - name: node5
      role: master
      validator: true
    
    - name: node6
      role: master
      validator: true

# Setup: verify initial network
setup:
  - group: Initial network verification
    defaults:
      node: node1
    steps:
      - cli: "net list"
        save: initial_nets
        contains: "stagenet"
      
      - cli: "node list"
        save: initial_nodes
  
  - wait: 10s

# Test: Add new full node dynamically
test:
  - group: Verify network and balancer status
    defaults:
      node: node1
    steps:
      - cli: "net get status"
        expect: success
        contains: "online"
      
      - cli: "balancer status"
        expect: success
        save: balancer_status
      
      - cli: "node list"
        contains: "node1"
  
  - wait: 5s

# Check: Verify network health
check:
  - cli: "net get status"
    node: node1
    contains: "online"
  
  - cli: "node list"
    node: node1
    contains: "node4"
  
  - cli: "node links"
    node: node6
    expect: success
