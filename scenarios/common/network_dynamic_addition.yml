# Dynamic Node Addition Scenario
# Tests adding new nodes to running network through balancer (dynamic topology)

name: Dynamic Node Addition Test
description: Test adding nodes dynamically to running network through balancer
author: Stage-Env
tags: [network, balancer, dynamic]
version: "1.0"

includes:
  - common/set_net_default.yml

network:
  topology: default
  name: "{{network_name}}"

# Setup: verify initial network
setup:
  - group: Initial network verification
    defaults:
      node: "{{first_root}}"
    steps:
      - cli: "net list"
        save: initial_nets
        contains: "{{network_name}}"
      
      - cli: "node list"
        save: initial_nodes
  
  - wait: 10s

# Test: Verify network and balancer
test:
  - group: Verify network and balancer status
    defaults:
      node: "{{first_root}}"
    steps:
      - cli: "net get status"
        expect: success
        contains: "online"
      
      - cli: "balancer status"
        expect: success
        save: balancer_status
      
      - cli: "node list"
        contains: "node"
  
  - wait: 5s

# Check: Verify network health on all nodes
check:
  - cli: "net get status"
    node: "{{first_root}}"
    contains: "online"
  
  - for: node_name
    in: "{{master_nodes}}"
    steps:
      - cli: "net get status"
        node: "{{node_name}}"
        contains: "online"
  
  - cli: "node links"
    node: "{{last_master}}"
