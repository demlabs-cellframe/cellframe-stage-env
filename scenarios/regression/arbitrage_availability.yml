name: Regression - Arbitrage Availability
description: Verify arbitrage transaction can be created immediately after token creation (Bug #1)

includes:
  - common/set_net_default.yml

network:
  topology: default
  name: "{{network_name}}"

setup:
  - docker_op: start
    services: "{{root_nodes}}"
    services: "{{root_nodes}}"
    detach: true
  
  - wait_network: online
    nodes: "{{root_nodes}}"
    nodes: "{{root_nodes}}"
    timeout: 60

test:
  - group: Setup Wallet and Token
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "zerochain"
      node: "{{first_root}}"
      cli:
        chain: "zerochain"
    steps:
      - cli: "wallet new -w arb_owner"
      - cli: "wallet info -addr -w arb_owner"
        save_wallet: owner_addr
      
      - cli: "wallet new -w fee_wallet"
      - cli: "wallet info -addr -w fee_wallet"
        save_wallet: fee_addr

      - cli: "token_decl -token ARB_TEST -total_supply 1000000000000000000 -decimals 18 -signs_emission 1 -signs_total 1 -certs {{network_name}}.root.pvt.0"
        save_hash: token_hash
      
      - cli: "token_emit -token ARB_TEST -emission_value 1000000000000000000 -addr {{owner_addr}} -certs {{network_name}}.root.pvt.0"
        save_hash: emission_hash
      
      - wait_for_datum: "{{emission_hash}}"
        chain: zerochain
        timeout: 60

  - group: Test Arbitrage Creation (Immediate)
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "zerochain"
        token: "ARB_TEST"
        fee: "100"
      node: "{{first_root}}"
      cli:
        chain: "zerochain"
        token: "ARB_TEST"
        fee: "100"
    steps:
      - cli: "tx_create -from_wallet arb_owner -to_addr {{owner_addr}} -value 100 -arbitrage -certs {{network_name}}.root.pvt.0"
        save_hash: arb_tx_hash
        expect: success

      - wait_for_datum: "{{arb_tx_hash}}"
        chain: zerochain
        timeout: 60
