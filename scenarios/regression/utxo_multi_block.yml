name: "Regression - Multiple UTXO Blocking in Single Command"
description: |
  Bug: token_update with two -utxo_blocked_add parameters only processes the first one.
  dap_cli_server_cmd_find_option_val() returns only the first match, silently ignoring
  subsequent -utxo_blocked_add parameters in the same command.

  Expected: Both UTXOs should be blocked after a single token_update command.
  Actual: Only the first UTXO is blocked; the second remains spendable.

  This test FAILS while the bug is present.

includes:
  - common/set_net_default.yml

network:
  topology: default
  name: "{{network_name}}"

setup:
  - docker_op: start
    services: "{{root_nodes}}"
    detach: true

  - wait_network: online
    nodes: "{{root_nodes}}"
    timeout: 60

test:
  - group: Setup Token and Transaction
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "zerochain"
    steps:
      - cli: "wallet new -w mblk_wallet"
      - cli: "wallet info -addr -w mblk_wallet"
        save_wallet: mblk_addr

      - cli: "token_decl -token MBLK -type CF20 -total_supply 2000000000000000000 -decimals 18 -signs_emission 1 -signs_total 1 -certs {{network_name}}.root.pvt.0"
        save_hash: token_hash

      - wait_for_datum: "{{token_hash}}"
        chain: zerochain
        timeout: 60

      - cli: "token_emit -token MBLK -emission_value 2000000000000000000 -addr {{mblk_addr}} -certs {{network_name}}.root.pvt.0"
        save_hash: emission_hash

      - wait_for_datum: "{{emission_hash}}"
        chain: zerochain
        timeout: 60

      - cli: "tx_create -from_wallet mblk_wallet -to_addr {{mblk_addr}} -value 1000000000000000000 -token MBLK -fee 100"
        save_hash: tx_hash

      - wait_for_datum: "{{tx_hash}}"
        chain: zerochain
        timeout: 60

  - group: Block Both UTXOs in Single Command
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "zerochain"
    steps:
      - cli: "token_update -token MBLK -type CF20 -certs {{network_name}}.root.pvt.0 -utxo_blocked_add {{tx_hash}}:0 -utxo_blocked_add {{tx_hash}}:1"
        save_hash: block_hash

      - wait_for_datum: "{{block_hash}}"
        chain: zerochain
        timeout: 60

  - group: Verify Both UTXOs Are Blocked
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "zerochain"
    steps:
      # Wallet should have NO spendable UTXOs if both :0 and :1 are blocked.
      # BUG: Only :0 is blocked, :1 is still spendable → tx_create succeeds.
      - cli: "tx_create -from_wallet mblk_wallet -to_addr {{mblk_addr}} -value 100 -token MBLK -fee 100"
        expect: error
