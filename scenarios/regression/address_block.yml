name: "Regression - Address Blocking via token_update"
description: |
  Bug: Address blocking via -tx_sender_blocked and -tx_receiver_blocked in token_update
  does not take effect. Transactions from blocked senders or to blocked receivers are
  not rejected as expected.

  Expected: After adding an address to the sender/receiver blocklist via token_update,
  transactions from/to that address should be rejected.
  Actual: Transactions pass validation regardless of address blocking.

  This test FAILS while the bug is present.

includes:
  - common/set_net_default.yml

network:
  topology: default
  name: "{{network_name}}"

setup:
  - docker_op: start
    services: "{{root_nodes}}"
    detach: true

  - wait_network: online
    nodes: "{{root_nodes}}"
    timeout: 60

test:
  - group: Setup Token and Wallets
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "zerochain"
    steps:
      - cli: "wallet new -w ablk_sender"
      - cli: "wallet info -addr -w ablk_sender"
        save_wallet: sender_addr

      - cli: "wallet new -w ablk_receiver"
      - cli: "wallet info -addr -w ablk_receiver"
        save_wallet: receiver_addr

      - cli: "wallet new -w ablk_thirdparty"
      - cli: "wallet info -addr -w ablk_thirdparty"
        save_wallet: thirdparty_addr

      - cli: "token_decl -token ABLK -type CF20 -total_supply 4000000000000000000 -decimals 18 -signs_emission 1 -signs_total 1 -certs {{network_name}}.root.pvt.0"
        save_hash: token_hash

      - wait_for_datum: "{{token_hash}}"
        chain: zerochain
        timeout: 60

      - cli: "token_emit -token ABLK -emission_value 2000000000000000000 -addr {{sender_addr}} -certs {{network_name}}.root.pvt.0"
        save_hash: emission_sender_hash

      - wait_for_datum: "{{emission_sender_hash}}"
        chain: zerochain
        timeout: 60

      - cli: "token_emit -token ABLK -emission_value 2000000000000000000 -addr {{thirdparty_addr}} -certs {{network_name}}.root.pvt.0"
        save_hash: emission_thirdparty_hash

      - wait_for_datum: "{{emission_thirdparty_hash}}"
        chain: zerochain
        timeout: 60

  - group: "Test 1: Block Sender Address"
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "zerochain"
    steps:
      - cli: "token_update -token ABLK -type CF20 -certs {{network_name}}.root.pvt.0 -tx_sender_blocked {{sender_addr}}"
        save_hash: sender_block_hash

      - wait_for_datum: "{{sender_block_hash}}"
        chain: zerochain
        timeout: 60

      # Blocked sender should NOT be able to create transactions.
      # BUG: Address blocking not enforced → tx_create SUCCEEDS.
      - cli: "tx_create -from_wallet ablk_sender -to_addr {{receiver_addr}} -value 100 -token ABLK -fee 100"
        expect: error

  - group: "Test 2: Block Receiver Address"
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "zerochain"
    steps:
      - cli: "token_update -token ABLK -type CF20 -certs {{network_name}}.root.pvt.0 -tx_receiver_blocked {{receiver_addr}}"
        save_hash: receiver_block_hash

      - wait_for_datum: "{{receiver_block_hash}}"
        chain: zerochain
        timeout: 60

      # Sending TO a blocked receiver should fail.
      # BUG: Address blocking not enforced → tx_create SUCCEEDS.
      - cli: "tx_create -from_wallet ablk_thirdparty -to_addr {{receiver_addr}} -value 100 -token ABLK -fee 100"
        expect: error
