name: "Regression - Delayed UTXO Blocking via CLI Timestamp"
description: |
  Bug: token_update with -utxo_blocked_add <hash>:<idx>:<future_timestamp> does not
  correctly implement delayed activation. The UTXO is either blocked immediately
  regardless of the timestamp, or the timestamp is not properly propagated through
  the CLI pipeline.

  Expected: A UTXO blocked with a future becomes_effective timestamp should remain
  spendable until the blockchain time reaches that timestamp.

  This test FAILS while the bug is present.

includes:
  - common/set_net_default.yml

network:
  topology: default
  name: "{{network_name}}"

setup:
  - docker_op: start
    services: "{{root_nodes}}"
    detach: true

  - wait_network: online
    nodes: "{{root_nodes}}"
    timeout: 60

test:
  - group: Setup Token and Wallets
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "zerochain"
    steps:
      - cli: "wallet new -w dblk_wallet1"
      - cli: "wallet info -addr -w dblk_wallet1"
        save_wallet: dblk_addr1

      - cli: "wallet new -w dblk_wallet2"
      - cli: "wallet info -addr -w dblk_wallet2"
        save_wallet: dblk_addr2

      - cli: "token_decl -token DBLK -type CF20 -total_supply 4000000000000000000 -decimals 18 -signs_emission 1 -signs_total 1 -certs {{network_name}}.root.pvt.0"
        save_hash: token_hash

      - wait_for_datum: "{{token_hash}}"
        chain: zerochain
        timeout: 60

      - cli: "token_emit -token DBLK -emission_value 2000000000000000000 -addr {{dblk_addr1}} -certs {{network_name}}.root.pvt.0"
        save_hash: emission1_hash

      - wait_for_datum: "{{emission1_hash}}"
        chain: zerochain
        timeout: 60

      - cli: "token_emit -token DBLK -emission_value 2000000000000000000 -addr {{dblk_addr2}} -certs {{network_name}}.root.pvt.0"
        save_hash: emission2_hash

      - wait_for_datum: "{{emission2_hash}}"
        chain: zerochain
        timeout: 60

      - cli: "tx_create -from_wallet dblk_wallet1 -to_addr {{dblk_addr1}} -value 1000000000000000000 -token DBLK -fee 100"
        save_hash: tx1_hash

      - wait_for_datum: "{{tx1_hash}}"
        chain: zerochain
        timeout: 60

      - cli: "tx_create -from_wallet dblk_wallet2 -to_addr {{dblk_addr2}} -value 1000000000000000000 -token DBLK -fee 100"
        save_hash: tx2_hash

      - wait_for_datum: "{{tx2_hash}}"
        chain: zerochain
        timeout: 60

  - group: "Test 1: Block with Future Timestamp — UTXO Should Remain Spendable"
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "zerochain"
    steps:
      - python: |
          import time
          future_ts = str(int(time.time()) + 86400)
          ctx.set_variable('future_ts', future_ts)

      - cli: "token_update -token DBLK -type CF20 -certs {{network_name}}.root.pvt.0 -utxo_blocked_add {{tx1_hash}}:0:{{future_ts}}"
        save_hash: delayed_block_hash

      - wait_for_datum: "{{delayed_block_hash}}"
        chain: zerochain
        timeout: 60

      # UTXO should still be spendable because becomes_effective is 24h in the future.
      # BUG: UTXO is blocked immediately despite future timestamp → tx_create fails.
      - cli: "tx_create -from_wallet dblk_wallet1 -to_addr {{dblk_addr1}} -value 100 -token DBLK -fee 100"
        save_hash: spend1_hash

  - group: "Test 2: Immediate Block + Future Unblock — UTXO Should Stay Blocked"
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "zerochain"
    steps:
      - cli: "token_update -token DBLK -type CF20 -certs {{network_name}}.root.pvt.0 -utxo_blocked_add {{tx2_hash}}:0"
        save_hash: imm_block_hash

      - wait_for_datum: "{{imm_block_hash}}"
        chain: zerochain
        timeout: 60

      - python: |
          import time
          future_unblock_ts = str(int(time.time()) + 86400)
          ctx.set_variable('future_unblock_ts', future_unblock_ts)

      - cli: "token_update -token DBLK -type CF20 -certs {{network_name}}.root.pvt.0 -utxo_blocked_remove {{tx2_hash}}:0:{{future_unblock_ts}}"
        save_hash: delayed_unblock_hash

      - wait_for_datum: "{{delayed_unblock_hash}}"
        chain: zerochain
        timeout: 60

      # UTXO should remain blocked because the unblock is scheduled for the future.
      # BUG: UTXO gets unblocked immediately → tx_create succeeds.
      - cli: "tx_create -from_wallet dblk_wallet2 -to_addr {{dblk_addr2}} -value 100 -token DBLK -fee 100"
        expect: error
