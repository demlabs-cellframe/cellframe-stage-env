name: "Regression - Arbitrage Without Wallet (Cert-Only)"
description: |
  Bug: Arbitrage transactions require -from_wallet, making it impossible to perform
  arbitrage without owning a wallet with funds. Token owners should be able to authorize
  arbitrage operations using only their certificates.

  Expected: tx_create -arbitrage should accept -cert/-certs for owner authorization
  without mandating -from_wallet.
  Actual: CLI mandates -from_wallet; without it the command fails immediately.

  Additionally, even with -from_wallet, the first TX signature (from wallet) is always
  treated as a "wallet" signature and skipped during owner authorization. If the wallet
  IS the owner, the owner signature is wasted as "wallet" and not counted for auth.

  This test FAILS while the bug is present.

includes:
  - common/set_net_default.yml

network:
  topology: default
  name: "{{network_name}}"

setup:
  - docker_op: start
    services: "{{root_nodes}}"
    detach: true

  - wait_network: online
    nodes: "{{root_nodes}}"
    timeout: 60

test:
  - group: Setup Token with Blocked UTXO
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "zerochain"
    steps:
      - cli: "wallet new -w arbnw_holder"
      - cli: "wallet info -addr -w arbnw_holder"
        save_wallet: holder_addr

      - cli: "token_decl -token ARBNW -type CF20 -total_supply 2000000000000000000 -decimals 18 -signs_emission 1 -signs_total 1 -certs {{network_name}}.root.pvt.0"
        save_hash: token_hash

      - wait_for_datum: "{{token_hash}}"
        chain: zerochain
        timeout: 60

      - cli: "token_emit -token ARBNW -emission_value 2000000000000000000 -addr {{holder_addr}} -certs {{network_name}}.root.pvt.0"
        save_hash: emission_hash

      - wait_for_datum: "{{emission_hash}}"
        chain: zerochain
        timeout: 60

      - cli: "tx_create -from_wallet arbnw_holder -to_addr {{holder_addr}} -value 1000000000000000000 -token ARBNW -fee 100"
        save_hash: tx_hash

      - wait_for_datum: "{{tx_hash}}"
        chain: zerochain
        timeout: 60

      - cli: "token_update -token ARBNW -type CF20 -certs {{network_name}}.root.pvt.0 -utxo_blocked_add {{tx_hash}}:0"
        save_hash: block_hash

      - wait_for_datum: "{{block_hash}}"
        chain: zerochain
        timeout: 60

  - group: "Attempt Cert-Only Arbitrage (No Wallet)"
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "zerochain"
    steps:
      # Token owner tries to arbitrage blocked UTXO using ONLY their cert.
      # No -from_wallet is provided because the owner doesn't hold the wallet.
      # BUG: CLI mandates -from_wallet → command fails immediately.
      - cli: "tx_create -arbitrage -value 1000000000000000000 -token ARBNW -certs {{network_name}}.root.pvt.0 -fee 0"
        save_hash: arb_hash

      - wait_for_datum: "{{arb_hash}}"
        chain: zerochain
        timeout: 60
