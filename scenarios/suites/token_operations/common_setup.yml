# Common Setup for Token Operations Suite

name: Token Operations Common Setup
description: Create wallets and initial state for token tests (dynamic topology)

includes:
  - common/set_net_default.yml

# Create test wallets
setup:
  - group: Create test wallets
    defaults:
      node: "{{first_root}}"
    steps:
      - cli: "wallet new -w test_wallet_owner"
        save: owner_addr
        expect: success
      
      - cli: "wallet new -w test_wallet_receiver"
        save: receiver_addr
        expect: success
      
      - cli: "wallet new -w test_wallet_thirdparty"
        save: thirdparty_addr
        expect: success
  
  - wait: 2s

# Verify wallets created
test:
  - group: Verify wallets exist
    defaults:
      node: "{{first_root}}"
    steps:
      - cli: "wallet list"
        contains: "test_wallet_owner"
      
      - cli: "wallet list"
        contains: "test_wallet_receiver"
      
      - cli: "wallet list"
        contains: "test_wallet_thirdparty"
