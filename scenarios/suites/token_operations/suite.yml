# Token Operations Test Suite
# Tests for CF20 token operations
# 
# This suite loads from base topology snapshot and runs all token tests

name: Token Operations Suite
description: Complete test suite for CF20 token operations including creation, emission, transfer, and permissions
author: Stage-Env Team
tags: [tokens, cf20, critical]
version: "1.0"

# Network topology - used for all scenarios in suite
network_topology: default

# Snapshot to restore before running suite
# Default: restore from topology name snapshot (e.g., "default")
# Set to null or remove to skip snapshot restore
restore_snapshot: "{{topology_name}}"

# Scenarios to execute
scenarios:
  - suites/token_operations/01_token_creation.yml
  - suites/token_operations/02_token_emission.yml
  - suites/token_operations/03_token_transfer.yml
  - suites/token_operations/04_token_permissions.yml
  - suites/token_operations/05_token_utxo_blocking.yml

# Common setup (runs once before all scenarios)
common_setup: suites/token_operations/common_setup.yml

# Common cleanup (runs once after all scenarios)
common_cleanup: suites/token_operations/common_cleanup.yml

# Execution options
options:
  stop_on_failure: false
  rebuild_network: false
  cleanup_between_scenarios: true
  parallel_execution: false
  timeout_per_scenario: 300

