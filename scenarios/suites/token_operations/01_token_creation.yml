# Token Creation Test
# Test scenario #1: Create new CF20 token (dynamic topology)

name: Token Creation Test
description: Test token declaration with various parameters
tags: [token, creation]

includes:
  - common/set_net_default.yml

test:
  - group: Test 1 - Simple token
    defaults:
      node: "{{first_root}}"
      cli:
        decimals: "18"
        signs_total: "1"
        signs_emission: "1"
    steps:
      - cli: "token_decl -token TEST1 -total_supply 1000000"
        save: test1_hash
        expect: success
        wait: 3s
      
      - cli: "token info -token TEST1"
        contains: "TEST1"
  
  - group: Test 2 - Token with flags
    defaults:
      node: "{{first_root}}"
      cli:
        decimals: "18"
        signs_total: "1"
    steps:
      - cli: "token_decl -token TEST2 -total_supply 5000000 -flags ALL_SENDER_ALLOWED,ALL_RECEIVER_ALLOWED"
        save: test2_hash
        expect: success
        wait: 3s
      
      - cli: "token info -token TEST2"
        contains: "TEST2"

check:
  - cli: "token list"
    node: "{{first_root}}"
    contains: "TEST1"
  
  - cli: "token list"
    node: "{{first_root}}"
    contains: "TEST2"
