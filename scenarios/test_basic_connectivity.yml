name: Basic Connectivity Test
description: Verify that stagenet nodes are connected and network is operational
author: Stage-Env Team
tags: [connectivity, basic, sanity]
version: "1.0"

includes:
  - common/set_net_default.yml

network:
  name: stagenet

test:
  - group: Check node-1 status
    defaults:
      node: node-1
    steps:
      - cli: "net get status"
        expect: success
        contains: "NET_STATE_ONLINE"
      
      - cli: "node list"
        expect: success
        contains: "Got"
      
      - cli: "version"
        expect: success
        contains: "cellframe-node version"

check:
  - cli: "net get status"
    node: node-2
    contains: "NET_STATE_ONLINE"
  
  - cli: "net get status"
    node: node-3
    contains: "NET_STATE_ONLINE"
