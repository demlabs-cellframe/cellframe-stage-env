name: Basic Connectivity Test
description: Verify that {{network_name}} nodes are connected and network is operational (dynamic topology)
author: Stage-Env Team
tags: [connectivity, basic, sanity]
version: "1.0"

includes:
  - common/set_net_default.yml

network:
  name: "{{network_name}}"

test:
  - group: Check first root node status
    defaults:
      node: "{{first_root}}"
    steps:
      - cli: "net get status"
        expect: success
        contains: "NET_STATE_ONLINE"
      
      - cli: "node list"
        expect: success
        contains: "Got"
      
      - cli: "version"
        expect: success
        contains: "cellframe-node version"
  - group: Check first root node status
    defaults:
      node: "{{first_root}}"
    steps:
      - cli: "net get status"
        expect: success
        contains: "NET_STATE_ONLINE"
      
      - cli: "node list"
        expect: success
        contains: "Got"
      
      - cli: "version"
        expect: success
        contains: "cellframe-node version"

check:
  # Check all root nodes
  - for: node_name
    in: "{{root_nodes}}"
    steps:
      - cli: "net get status"
        node: "{{node_name}}"
        contains: "NET_STATE_ONLINE"
  # Check all root nodes
  - for: node_name
    in: "{{root_nodes}}"
    steps:
      - cli: "net get status"
        node: "{{node_name}}"
        contains: "NET_STATE_ONLINE"
  
  # Check all master nodes
  - for: node_name
    in: "{{master_nodes}}"
    steps:
      - cli: "net get status"
        node: "{{node_name}}"
        contains: "NET_STATE_ONLINE"
  # Check all master nodes
  - for: node_name
    in: "{{master_nodes}}"
    steps:
      - cli: "net get status"
        node: "{{node_name}}"
        contains: "NET_STATE_ONLINE"
