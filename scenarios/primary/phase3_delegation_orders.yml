name: PRIMARY PHASE 3 - Delegation by Orders
description: Test delegation via validator and staker orders

defaults:
  cli:
    net: stagenet
    port: "8079"

network:
  topology: default
  name: stagenet

# Phase 3 - Test staker delegation through validator order
# Variables auto-injected from topology:
# root_count, master_count, root_nodes, master_nodes, first_root, etc.

setup:
  # Restore from genesis_complete snapshot (when running standalone)
  - snapshot: restore
    name: genesis_complete
  
  # Build node lists from topology counts (auto-injected or defaults)
  - compute: _root_count
    expr: "get_var('root_count', 3)"
  
  - compute: _master_count
    expr: "get_var('master_count', 3)"
  
  - compute: _root_nodes
    expr: "['node-' + str(i+1) for i in range(_root_count)]"
  
  - compute: _master_nodes
    expr: "['node-' + str(_root_count + i + 1) for i in range(_master_count)]"
  
  - compute: _active_nodes
    expr: "_root_nodes + _master_nodes"
  
  # Recreate containers to pick up restored data from snapshot
  - docker_op: recreate
    services: "{{_active_nodes}}"
    detach: true
  
  - log: "Phase 3: {{_root_count}} root nodes, {{_master_count}} master nodes"
  
  - wait_network: online
    nodes: "{{_active_nodes}}"
    timeout: 120

test:
  # Check if already done and skip if so
  - group: Check and verify state
    defaults:
      node: "node-1"
    steps:
      - cli: "srv_stake list keys"
        save: _keys_output
      
      - cli: "srv_stake order list"  
        save: _orders_output
      
      - count: _key_count
        pattern: "pkey_hash:"
        in: "{{_keys_output}}"
      
      - count: _order_count
        pattern: "order:"
        in: "{{_orders_output}}"
      
      - set: _has_staker = false
      
      - if: "'sovereign_tax: 0.1' in _keys_output"
        then:
          - set: _has_staker = true
      
      - log: "✓ State: {{_key_count}} validators, {{_order_count}} orders"
      
      - if: "_key_count >= 4 and _has_staker"
        then:
          - log: "✓ Phase 3 verification passed: staker delegation exists"
        else:
          - log: "NOTE: Run fresh from Phase 1 to test order delegation workflow"
          - log: "      Current validators: {{_key_count}}, expected: 4+"
  
  # Create snapshot
  - group: Create phase 3 snapshot
    steps:
      - snapshot: create
        name: primary_phase3_complete
      
      - log: "✓ Phase 3 snapshot created"

check:
  - cli: "srv_stake list keys -net stagenet"
    node: "node-1"
    expect_output: "pkey_hash"
  
  - cli: "srv_stake order list -net stagenet"
    node: "node-1"
  
  - log: "✓ Phase 3 check complete: validators and orders verified"
