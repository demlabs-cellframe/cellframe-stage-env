name: PRIMARY PHASE 4 - Transfers and Batch Transactions
description: Test regular transfers and batch transactions with time locks

includes:
  - ../common/set_net_default.yml

network:
  topology: default
  name: stagenet

# This scenario tests:
# - Regular token transfers between wallets
# - Batch transactions with time-locked outputs
# Variables auto-injected from topology:
# root_count, master_count, root_nodes, master_nodes, first_root, etc.

setup:
  # Restore from genesis_complete snapshot (when running standalone)
  - snapshot: restore
    name: genesis_complete
  
  # Build node lists from topology counts (auto-injected or defaults)
  - compute: _root_count
    expr: "get_var('root_count', 3)"
  
  - compute: _master_count
    expr: "get_var('master_count', 3)"
  
  - compute: _full_count
    expr: "get_var('full_count', 2)"
  
  - compute: _root_nodes
    expr: "['node-' + str(i+1) for i in range(_root_count)]"
  
  - compute: _master_nodes
    expr: "['node-' + str(_root_count + i + 1) for i in range(_master_count)]"
  
  - compute: _active_nodes
    expr: "_root_nodes + _master_nodes"
  
  # Recreate containers to pick up restored data from snapshot
  - docker_op: recreate
    services: "{{_active_nodes}}"
    detach: true
  
  - log: "Phase 4: {{_root_count}} root, {{_master_count}} master, {{_full_count}} full nodes"
  
  - wait_network: online
    nodes: "{{_active_nodes}}"
    timeout: 120

test:
  # Get wallet addresses for transfers
  - group: Get wallet addresses
    defaults:
      node: "{{first_root}}"
    steps:
      - cli: "wallet info -w stagenet_root_0"
        save_wallet: root_0_addr
      
      - set: _second_root_node = "node-2"
      
      - cli: "wallet info -w stagenet_root_1"
        node: "{{_second_root_node}}"
        save_wallet: root_1_addr
      
      - compute: _master_node_num
        expr: "_root_count + 1"
      
      - set: _master_node
        value: "node-{{_master_node_num}}"
      
      - cli: "wallet info -w stagenet_master_0"
        node: "{{_master_node}}"
        save_wallet: master_0_addr
      
      - compute: _full_node_num
        expr: "_root_count + _master_count + 1"
      
      - set: _full_node
        value: "node-{{_full_node_num}}"
      
      - cli: "wallet info -w stagenet_full_0"
        node: "{{_full_node}}"
        save_wallet: full_0_addr

  # ============================================================
  # TEST 1: Regular Token Transfer
  # Simple transfer from root wallet to another wallet
  # ============================================================
  
  - group: Regular transfer test
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "main"
        token: "TCELL"
    steps:
      # Get initial balance
      - cli: "wallet info -w stagenet_root_1"
        node: "{{_second_root_node}}"
        save: initial_balance_root_1
      
      # Transfer tokens
      - cli: "tx_create -from_wallet stagenet_root_0 -value 1000.0e+18 -to_addr {{root_1_addr}} -fee 5.0e+18"
        save_hash: regular_transfer_hash
      
      # Wait for transfer to be finalized
      - wait: finalized
        datum: "{{regular_transfer_hash}}"
        node: "node-1"
        chain: "main"
        timeout: 90
      
      # Verify transfer in ledger
      - cli: "ledger info -hash {{regular_transfer_hash}}"
        expect_output: "datum_tx_hash"
      
      # Check transaction history
      - cli: "tx_history -addr {{root_1_addr}}"
        expect_output: "ACCEPTED"
      
      # Verify balance changed
      - cli: "wallet info -w stagenet_root_1"
        node: "{{_second_root_node}}"
        save: final_balance_root_1

  # ============================================================
  # TEST 2: Multiple Transfers in Sequence
  # Tests transaction throughput
  # ============================================================
  
  - group: Multiple transfers test
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "main"
        token: "TCELL"
    steps:
      # Transfer 1
      - cli: "tx_create -from_wallet stagenet_root_0 -value 100.0e+18 -to_addr {{master_0_addr}} -fee 5.0e+18"
        save_hash: multi_transfer_1
      
      # Wait for transfer to be finalized
      - wait: finalized
        datum: "{{multi_transfer_1}}"
        node: "node-1"
        chain: "main"
        timeout: 90
      
      # Transfer 2
      - cli: "tx_create -from_wallet stagenet_root_0 -value 200.0e+18 -to_addr {{master_0_addr}} -fee 5.0e+18"
        save_hash: multi_transfer_2
      
      # Wait for transfer to be finalized
      - wait: finalized
        datum: "{{multi_transfer_2}}"
        node: "node-1"
        chain: "main"
        timeout: 90
      
      # Transfer 3
      - cli: "tx_create -from_wallet stagenet_root_0 -value 300.0e+18 -to_addr {{master_0_addr}} -fee 5.0e+18"
        save_hash: multi_transfer_3
      
      # Wait for transfer to be finalized
      - wait: finalized
        datum: "{{multi_transfer_3}}"
        node: "node-1"
        chain: "main"
        timeout: 90
      
      # Verify all transfers
      - cli: "tx_history -addr {{master_0_addr}}"
        save: master_tx_history

  # ============================================================
  # TEST 3: Batch Transaction with Time Locks
  # Single transaction with multiple outputs locked until specific times
  # ============================================================
  
  - group: Batch transaction with time locks
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "main"
        token: "TCELL"
    steps:
      # Create batch of addresses for multiple outputs
      # Full node address will receive 3 locked outputs
      - set: _batch_addrs
        value: "{{full_0_addr}},{{full_0_addr}},{{full_0_addr}}"
      
      # Amount for each output
      - set: _batch_amounts = "1.0e+18,2.0e+18,3.0e+18"
      
      # Lock times (YYMMDD format) - 3 different unlock dates
      - set: _batch_locks = "300101,310202,320303"
      
      - log: "Batch amounts: 1.0e+18, 2.0e+18, 3.0e+18"
      - log: "Lock times: 2030-01-01, 2031-02-02, 2032-03-03"
      
      # Create batch transaction with time-locked outputs
      - cli: "tx_create -from_wallet stagenet_root_0 -value {{_batch_amounts}} -to_addr {{_batch_addrs}} -fee 5.0e+18 -lock_before {{_batch_locks}}"
        save_hash: batch_tx_hash
      
      # Wait for batch transaction to be finalized
      - wait: finalized
        datum: "{{batch_tx_hash}}"
        node: "node-1"
        chain: "main"
        timeout: 90
      
      # Verify batch transaction in ledger
      - cli: "ledger info -hash {{batch_tx_hash}}"
        expect_output: "datum_tx_hash"
      
      # Check transaction details
      - cli: "tx_history -addr {{full_0_addr}}"
        save: full_tx_history

  # ============================================================
  # TEST 4: Transfer to Multiple Recipients
  # Single transaction to different addresses
  # ============================================================
  
  - group: Multi-recipient transfer
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "main"
        token: "TCELL"
    steps:
      # Multiple different recipients
      - set: _multi_addrs
        value: "{{root_1_addr}},{{master_0_addr}},{{full_0_addr}}"
      
      - set: _multi_amounts = "10.0e+18,20.0e+18,30.0e+18"
      
      - cli: "tx_create -from_wallet stagenet_root_0 -value {{_multi_amounts}} -to_addr {{_multi_addrs}} -fee 5.0e+18"
        save_hash: multi_recipient_tx_hash
      
      # Wait for multi-recipient transaction to be finalized
      - wait: finalized
        datum: "{{multi_recipient_tx_hash}}"
        node: "node-1"
        chain: "main"
        timeout: 90
      
      # Verify transaction
      - cli: "ledger info -hash {{multi_recipient_tx_hash}}"
        expect_output: "datum_tx_hash"

  # Final balance verification
  - group: Verify final balances
    defaults:
      node: "{{first_root}}"
    steps:
      - cli: "wallet info -w stagenet_root_0"
        save: final_root_0_balance
      
      - cli: "wallet info -w stagenet_root_1"
        node: "{{_second_root_node}}"
        save: final_root_1_balance
      
      - cli: "wallet info -w stagenet_master_0"
        node: "{{_master_node}}"
        save: final_master_0_balance
      
      - cli: "wallet info -w stagenet_full_0"
        node: "{{_full_node}}"
        save: final_full_0_balance
      
      - log: "✓ All transfers completed and verified"
  
  # Create final snapshot
  - group: Create final snapshot
    steps:
      - snapshot: create
        name: primary_complete
      
      - log: "✓ Primary test snapshot created: primary_complete"

check:
  # Verify all transactions were processed
  - cli: "block list -chain main"
    node: "{{first_root}}"
    expect_output: "have blocks:"
  
  # Network should be operational
  - cli: "net get status"
    node: "{{first_root}}"
    expect_output: "NET_STATE_ONLINE"
