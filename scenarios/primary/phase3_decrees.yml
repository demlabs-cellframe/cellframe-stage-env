name: PRIMARY PHASE 3 - Network Decrees
description: Configure network parameters via decrees (fee, reward, min_validators)

includes:
  - common/set_net_default.yml

network:
  topology: default
  name: stagenet

# This scenario sets up network parameters via decrees:
# - Network fee configuration
# - Block reward value
# - Minimum validators count

setup:
  - python: |
      root_nodes = ctx.get('root_nodes')
      master_nodes = ctx.get('master_nodes')
      ctx.set_variable('_active_nodes', root_nodes + master_nodes)
  
  - wait_network: online
    nodes: "{{_active_nodes}}"
    timeout: 60

test:
  # Prepare decree signing certificates
  - group: Prepare decree signing
    defaults:
      node: "{{first_root}}"
    steps:
      - python: |
          root_count = ctx.get('root_count')
          certs = [f"stagenet.root.pvt.{i}" for i in range(root_count)]
          ctx.set_variable('_poa_certs', ",".join(certs))
          print(f"POA certs for decree signing: {','.join(certs)}")
  
  # ============================================================
  # DECREE 1: Network Fee Configuration
  # Sets up network fee collection address
  # ============================================================
  
  - group: Create network fee wallet
    defaults:
      node: "{{first_root}}"
    steps:
      # Create dedicated wallet for network fees
      - cli: "wallet new -w network_fee_wlt -sign sig_dil"
        save: network_fee_wallet_create
      
      - cli: "wallet info -w network_fee_wlt"
        save_wallet: network_fee_addr
  
  - group: Decree - Network Fee
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "zerochain"
    steps:
      # Create decree for network fee
      - cli: "decree create common -decree_chain main -certs {{_poa_certs}} -fee 0.05e+18 -to_addr {{network_fee_addr}}"
        save_hash: decree_fee_hash
      
      - wait: "5s"
      
      # Process decree in mempool
      - cli: "mempool proc -datum {{decree_fee_hash}}"
        save: decree_fee_proc_result
      
      - wait: "60s"
      
      # Verify decree was processed
      - cli: "dag event last -chain zerochain"
        save_hash: decree_fee_event

  # ============================================================
  # DECREE 2: Block Reward Value
  # Sets the reward validators receive for creating blocks
  # ============================================================
  
  - group: Decree - Block Reward
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "zerochain"
    steps:
      # Set block reward value
      - cli: "block reward set -poa_cert {{_poa_certs}} -value 1.5e+18 -chain main"
        save_hash: decree_reward_hash
      
      - wait: "5s"
      
      # Process decree
      - cli: "mempool proc -datum {{decree_reward_hash}}"
        save: decree_reward_proc_result
      
      - wait: "60s"
      
      # Verify decree was processed
      - cli: "dag event last -chain zerochain"
        save_hash: decree_reward_event

  # ============================================================
  # DECREE 3: Minimum Validators Count
  # Sets the minimum number of validators required for consensus
  # ============================================================
  
  - group: Decree - Minimum Validators Count
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "zerochain"
    steps:
      # Set minimum validators count to 2
      - cli: "esbocs min_validators_count set -chain main -cert {{_poa_certs}} -val_count 2"
        save_hash: decree_val_count_hash
      
      - wait: "5s"
      
      # Process decree
      - cli: "mempool proc -datum {{decree_val_count_hash}}"
        save: decree_val_count_proc_result
      
      - wait: "60s"
      
      # Verify decree was processed
      - cli: "dag event last -chain zerochain"
        save_hash: decree_val_count_event

  # ============================================================
  # ANCHOR: Create anchors for decrees in mainchain
  # Required for decrees to take effect across network
  # ============================================================
  
  - group: Create decree anchors
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "main"
    steps:
      # Create anchor for fee decree
      - cli: "decree anchor -datum {{decree_fee_hash}} -certs stagenet.root.pvt.0"
        save_hash: anchor_fee_hash
      
      - wait: "60s"
      
      # Create anchor for reward decree
      - cli: "decree anchor -datum {{decree_reward_hash}} -certs stagenet.root.pvt.0"
        save_hash: anchor_reward_hash
      
      - wait: "60s"
      
      # Create anchor for val_count decree
      - cli: "decree anchor -datum {{decree_val_count_hash}} -certs stagenet.root.pvt.0"
        save_hash: anchor_val_count_hash
      
      - wait: "60s"

  # Restart nodes to apply decree changes
  - group: Apply decree changes
    steps:
      - docker_op: restart
        services: "{{_active_nodes}}"
      
      - wait_network: online
        nodes: "{{_active_nodes}}"
        timeout: 60
      
      - wait: "20s"

check:
  # Verify network is operational after decrees
  - cli: "net get status"
    node: "{{first_root}}"
    expect_output: "NET_STATE_ONLINE"
  
  # Verify decrees in zerochain
  - cli: "dag event list -chain zerochain"
    node: "{{first_root}}"
    not_contains: "No events"
  
  # Verify blocks are being created (with new reward)
  - cli: "block list -chain main"
    node: "{{first_root}}"
    expect_output: "have blocks:"

