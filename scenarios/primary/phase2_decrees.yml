name: PRIMARY PHASE 2 - Network Decrees
description: Setup network fee, block reward, and other decree operations

defaults:
  cli:
    net: stagenet
    port: "8079"

network:
  topology: default
  name: stagenet

setup:
  - python: |
      root_count = ctx.get('root_count') or 4
      master_count = ctx.get('master_count') or 5
      
      ctx.set_variable('root_count', root_count)
      ctx.set_variable('master_count', master_count)
      
      root_nodes = [f"node-{i+1}" for i in range(root_count)]
      master_nodes = [f"node-{root_count + i + 1}" for i in range(master_count)]
      
      ctx.set_variable('root_nodes', root_nodes)
      ctx.set_variable('master_nodes', master_nodes)
      ctx.set_variable('first_root', root_nodes[0])
      ctx.set_variable('second_root', root_nodes[1])
      ctx.set_variable('_active_nodes', root_nodes + master_nodes)
      print(f"Phase 2: {root_count} root nodes, {master_count} master nodes")
  
  - wait_network: online
    nodes: "{{_active_nodes}}"
    timeout: 60

test:
  # === PART 1: Setup network fee ===
  - group: Create network fee decree
    defaults:
      node: "{{first_root}}"
    steps:
      - cli: "wallet new -w network_fee_wlt -sign sig_dil"
        allow_fail: true
      
      - cli: "wallet info -w network_fee_wlt"
        save_wallet: network_fee_addr
      
      # Step 1: Create fee decree (first signature)
      - cli: "decree create common -chain zerochain -decree_chain main -certs stagenet.root.pvt.0 -fee 0.05e+18 -to_addr {{network_fee_addr}}"
        save_hash: decree_fee_hash
      
      # Step 2: Sign decree with second root
      - cli: "decree sign -datum {{decree_fee_hash}} -chain zerochain -certs stagenet.root.pvt.1"
        node: "{{second_root}}"
        save_hash: decree_fee_signed
      
      # Step 3: Process decree in DAG
      - cli: "mempool proc -datum {{decree_fee_signed}} -chain zerochain"
      
      # Wait for decree to be processed in DAG
      - wait: mempool
        datum: "{{decree_fee_signed}}"
        node: "node-1"
        chain: "zerochain"
        timeout: 30
      
      # Step 4: Create anchor in mainchain
      - cli: "decree anchor -datum {{decree_fee_signed}} -chain main -certs stagenet.root.pvt.0"
        save_hash: decree_fee_anchor
      
      # Wait for anchor to be finalized
      - wait: finalized
        datum: "{{decree_fee_anchor}}"
        node: "node-1"
        chain: "main"
        timeout: 90
      
      - python: |
          print("✓ Network fee decree created and anchored")

  # === PART 2: Setup block reward ===
  - group: Create block reward decree
    defaults:
      node: "{{first_root}}"
    steps:
      - cli: "block reward set -poa_cert stagenet.root.pvt.0 -value 1.5e+18 -chain main"
        save_hash: decree_reward_hash
      
      - cli: "decree sign -datum {{decree_reward_hash}} -chain zerochain -certs stagenet.root.pvt.1"
        node: "{{second_root}}"
        save_hash: decree_reward_signed
      
      - cli: "mempool proc -datum {{decree_reward_signed}} -chain zerochain"
      
      # Wait for decree to be processed in DAG
      - wait: mempool
        datum: "{{decree_reward_signed}}"
        node: "node-1"
        chain: "zerochain"
        timeout: 30
      
      - cli: "decree anchor -datum {{decree_reward_signed}} -chain main -certs stagenet.root.pvt.0"
        save_hash: decree_reward_anchor
      
      # Wait for anchor to be finalized
      - wait: finalized
        datum: "{{decree_reward_anchor}}"
        node: "node-1"
        chain: "main"
        timeout: 90
      
      - python: |
          print("✓ Block reward decree created and anchored")

  # === PART 3: Setup min_validators_count ===
  - group: Set min_validators_count decree
    defaults:
      node: "{{first_root}}"
    steps:
      - python: |
          # Keep min_validators_count at 2 for network stability
          # (in case one validator crashes, network can still produce blocks)
          new_min = 2
          ctx.set_variable('_new_min_validators', new_min)
          print(f"Setting min_validators_count to {new_min}")
      
      # Create decree with esbocs command (not decree create common)
      - cli: "esbocs min_validators_count set -chain main -val_count {{_new_min_validators}} -cert stagenet.root.pvt.0"
        save_hash: decree_min_val_hash
      
      # Sign decree with second root
      - cli: "decree sign -datum {{decree_min_val_hash}} -chain zerochain -certs stagenet.root.pvt.1"
        node: "{{second_root}}"
        save_hash: decree_min_val_signed
      
      - cli: "mempool proc -datum {{decree_min_val_signed}} -chain zerochain"
      
      # Wait for decree to be processed in DAG
      - wait: mempool
        datum: "{{decree_min_val_signed}}"
        node: "node-1"
        chain: "zerochain"
        timeout: 30
      
      - cli: "decree anchor -datum {{decree_min_val_signed}} -chain main -certs stagenet.root.pvt.0"
        save_hash: decree_min_val_anchor
      
      # Wait for anchor to be finalized
      - wait: finalized
        datum: "{{decree_min_val_anchor}}"
        node: "node-1"
        chain: "main"
        timeout: 90
      
      # Verify the value was set
      - cli: "esbocs min_validators_count show"
        save: _min_val_result
      
      - python: |
          result = ctx.get('_min_val_result', '')
          print(f"✓ min_validators_count decree applied: {result[:100]}")
  
  # Create snapshot
  - group: Create phase 2 snapshot
    steps:
      - snapshot: create
        name: primary_phase2_complete
      
      - python: |
          print("✓ Phase 2 snapshot created")

check:
  - python: |
      print("✓ Phase 2 completed: Network fee and block reward decrees applied")
