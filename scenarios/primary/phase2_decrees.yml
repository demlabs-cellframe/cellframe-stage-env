name: PRIMARY PHASE 2 - Network Decrees
description: Setup network fee, block reward, and other decree operations

defaults:
  cli:
    net: stagenet
    port: "8079"

network:
  topology: default
  name: stagenet

# Restore from phase1 snapshot when running standalone
# When running sequentially after phase1, this is skipped if containers are already running
restore_snapshot: primary_phase1_complete
# Skip genesis flow - snapshot already contains complete genesis state
run_genesis_flow: false

# Variables auto-injected from topology:
# root_count, master_count, root_nodes, master_nodes, first_root, etc.

setup:
  # Build node lists from topology counts
  - compute: _root_count
    expr: "get_var('root_count', 3)"
  
  - compute: _master_count
    expr: "get_var('master_count', 3)"
  
  - compute: _root_nodes
    expr: "['node-' + str(i+1) for i in range(_root_count)]"
  
  - compute: _master_nodes
    expr: "['node-' + str(_root_count + i + 1) for i in range(_master_count)]"
  
  - compute: _active_nodes
    expr: "_root_nodes + _master_nodes"
  
  - log: "Phase 2: {{_root_count}} root nodes, {{_master_count}} master nodes"
  
  - wait_network: online
    nodes: "{{_active_nodes}}"
    timeout: 120

test:
  # === PART 1: Setup network fee ===
  - group: Create network fee decree
    defaults:
      node: "{{first_root}}"
    steps:
      - cli: "wallet new -w network_fee_wlt -sign sig_dil"
        ignore_error: true
      
      - cli: "wallet info -w network_fee_wlt"
        save_wallet: network_fee_addr
      
      # Step 1: Create fee decree (first signature)
      - cli: "decree create common -chain zerochain -decree_chain main -certs stagenet.root.pvt.0 -fee 0.05e+18 -to_addr {{network_fee_addr}}"
        save_hash: decree_fee_hash
      
      # Step 2: Sign decree with second root
      - cli: "decree sign -datum {{decree_fee_hash}} -chain zerochain -certs stagenet.root.pvt.1"
        node: "node-2"
        save_hash: decree_fee_signed
      
      # Step 3: Process decree in DAG
      - cli: "mempool proc -datum {{decree_fee_signed}} -chain zerochain"
      
      # Wait for decree to be finalized in DAG (not just mempool!)
      # Decree must be in DAG event before anchor can reference it
      - wait: finalized
        datum: "{{decree_fee_signed}}"
        node: "node-1"
        chain: "zerochain"
        timeout: 60
      
      - log: "✓ Fee decree finalized in zerochain DAG, creating anchor..."
      
      # Step 4: Create anchor in mainchain
      - cli: "decree anchor -datum {{decree_fee_signed}} -chain main -certs stagenet.root.pvt.0"
        save_hash: decree_fee_anchor
      
      # Wait for anchor to be finalized
      - wait: finalized
        datum: "{{decree_fee_anchor}}"
        node: "node-1"
        chain: "main"
        timeout: 90
      
      - log: "✓ Network fee decree created and anchored"

  # === PART 2: Setup block reward ===
  - group: Create block reward decree
    defaults:
      node: "{{first_root}}"
    steps:
      - cli: "block reward set -poa_cert stagenet.root.pvt.0 -value 1.5e+18 -chain main"
        save_hash: decree_reward_hash
      
      - cli: "decree sign -datum {{decree_reward_hash}} -chain zerochain -certs stagenet.root.pvt.1"
        node: "node-2"
        save_hash: decree_reward_signed
      
      - cli: "mempool proc -datum {{decree_reward_signed}} -chain zerochain"
      
      # Wait for decree to be finalized in DAG (not just mempool!)
      # Decree must be in DAG event before anchor can reference it
      - wait: finalized
        datum: "{{decree_reward_signed}}"
        node: "node-1"
        chain: "zerochain"
        timeout: 60
      
      - log: "✓ Decree finalized in zerochain DAG, creating anchor..."
      
      - cli: "decree anchor -datum {{decree_reward_signed}} -chain main -certs stagenet.root.pvt.0"
        save_hash: decree_reward_anchor
      
      # Wait for anchor to be finalized
      - wait: finalized
        datum: "{{decree_reward_anchor}}"
        node: "node-1"
        chain: "main"
        timeout: 90
      
      - log: "✓ Block reward decree created and anchored"

  # === PART 3: Test min_validators_count decree ===
  # After Phase 1: we have 3 validators (2 PoA + 1 delegated)
  # Genesis had min_validators_count = 2
  # We change it to 3 to verify decree actually works
  - group: Test min_validators_count decree (2 -> 3)
    defaults:
      node: "{{first_root}}"
    steps:
      # First, verify current value is 2 (from genesis)
      - cli: "esbocs min_validators_count show"
        save: _min_val_before
      
      - log: "Current min_validators_count (before decree): {{_min_val_before}}"
      
      # Set new value = 3 (different from genesis value 2)
      - set: _new_min_validators = 3
      
      - log: "Changing min_validators_count from 2 to {{_new_min_validators}}"
      
      # Create decree with esbocs command
      - cli: "esbocs min_validators_count set -chain main -val_count {{_new_min_validators}} -cert stagenet.root.pvt.0"
        save_hash: decree_min_val_hash
      
      # Sign decree with second root
      - cli: "decree sign -datum {{decree_min_val_hash}} -chain zerochain -certs stagenet.root.pvt.1"
        node: "node-2"
        save_hash: decree_min_val_signed
      
      - cli: "mempool proc -datum {{decree_min_val_signed}} -chain zerochain"
      
      # Wait for decree to be finalized in DAG (not just mempool!)
      # Decree must be in DAG event before anchor can reference it
      - wait: finalized
        datum: "{{decree_min_val_signed}}"
        node: "node-1"
        chain: "zerochain"
        timeout: 60
      
      - log: "✓ Decree finalized in zerochain DAG, creating anchor..."
      
      - cli: "decree anchor -datum {{decree_min_val_signed}} -chain main -certs stagenet.root.pvt.0"
        save_hash: decree_min_val_anchor
      
      # Wait for anchor to be finalized
      - wait: finalized
        datum: "{{decree_min_val_anchor}}"
        node: "node-1"
        chain: "main"
        timeout: 90
      
      # Verify the value was changed
      - cli: "esbocs min_validators_count show"
        save: _min_val_after
      
      - log: "New min_validators_count (after decree): {{_min_val_after}}"
      
      # Extract the actual value from output
      - extract: _min_val_value
        from: "{{_min_val_after}}"
        pattern: "min_validators_count[:\\s]+([0-9]+)"
        group: 1
        default: "0"
      
      - log: "Extracted min_validators_count value: {{_min_val_value}}"
      
      # Assert the value changed to 3
      - assert: "int(_min_val_value) == 3"
        message: "min_validators_count decree failed: expected 3, got {{_min_val_value}}"
      
      - log: "✓ min_validators_count decree verified: changed from 2 to 3"
  
  # Create snapshot
  - group: Create phase 2 snapshot
    steps:
      - snapshot: create
        name: primary_phase2_complete
      
      - log: "✓ Phase 2 snapshot created"

check:
  - log: "✓ Phase 2 completed: Network fee and block reward decrees applied"
