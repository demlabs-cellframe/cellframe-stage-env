name: PRIMARY PHASE 1 - Validator Delegation Setup
description: Setup delegated token mTCELL, network fee, and add new validators via delegation

defaults:
  cli:
    net: stagenet
    port: "8079"

network:
  topology: default
  name: stagenet

# This scenario runs after Genesis (which sets up 2/2 initial validators)
# It adds remaining validators (MASTER[2], MASTER[3], MASTER[4]) via delegation

setup:
  - python: |
      # Get from context or use defaults for stagenet (4 root, 5 master, 1 full)
      root_count = ctx.get('root_count') or 4
      master_count = ctx.get('master_count') or 5
      full_count = ctx.get('full_count') or 1
      initial_validator_count = 2
      
      ctx.set_variable('root_count', root_count)
      ctx.set_variable('master_count', master_count)
      ctx.set_variable('full_count', full_count)
      ctx.set_variable('initial_validator_count', initial_validator_count)
      
      root_nodes = [f"node-{i+1}" for i in range(root_count)]
      master_nodes = [f"node-{root_count + i + 1}" for i in range(master_count)]
      
      ctx.set_variable('root_nodes', root_nodes)
      ctx.set_variable('master_nodes', master_nodes)
      ctx.set_variable('first_root', root_nodes[0])
      ctx.set_variable('first_master', master_nodes[0])
      ctx.set_variable('_active_nodes', root_nodes + master_nodes)
      
      # New validators to add (indices 2, 3, 4 = node-7, node-8, node-9)
      new_validator_indices = list(range(initial_validator_count, master_count))
      ctx.set_variable('_new_validator_indices', new_validator_indices)
      print(f"New validators to add: indices {new_validator_indices}")
  
  - wait_network: online
    nodes: "{{_active_nodes}}"
    timeout: 60
  
  - wait: "5s"

test:
  # === PART 1: Declare mTCELL token ===
  - group: Declare mTCELL token
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "zerochain"
    steps:
      - python: |
          root_count = ctx.get('root_count')
          certs = [f"stagenet.root.pvt.{i}" for i in range(root_count)]
          ctx.set_variable('_root_certs', ",".join(certs))
      
      - cli: "token_decl -token mTCELL -delegated_token_from TCELL -total_supply 0 -decimals 18 -signs_emission {{root_count}} -signs_total {{root_count}} -type CF20 -certs {{_root_certs}}"
        save_hash: mtcell_decl_hash
      
      - wait: "3s"
      
      - cli: "mempool proc -datum {{mtcell_decl_hash}}"
      
      - wait: "32s"
      
      - cli: "token info -name mTCELL"
        contains: "token_name: mTCELL"

  # === PART 2: Setup network fee ===
  - group: Setup network fee
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "zerochain"
    steps:
      - cli: "wallet new -w network_fee_wlt -sign sig_dil"
        ignore_error: true
      
      - cli: "wallet info -w network_fee_wlt"
        save_wallet: network_fee_addr
      
      - python: |
          root_count = ctx.get('root_count')
          certs = [f"stagenet.root.pvt.{i}" for i in range(root_count)]
          ctx.set_variable('_poa_certs', ",".join(certs))
      
      - cli: "decree create common -decree_chain main -certs {{_poa_certs}} -fee 0.05e+18 -to_addr {{network_fee_addr}}"
        save_hash: decree_fee_hash
      
      - wait: "3s"
      
      - cli: "mempool proc -datum {{decree_fee_hash}}"
      
      - wait: "32s"

  # === PART 3: Setup block reward ===
  - group: Setup block reward
    defaults:
      node: "{{first_root}}"
      cli:
        chain: "main"
    steps:
      - python: |
          root_count = ctx.get('root_count')
          certs = [f"stagenet.root.pvt.{i}" for i in range(root_count)]
          ctx.set_variable('_poa_certs', ",".join(certs))
      
      - cli: "block reward set -poa_cert {{_poa_certs}} -value 1.5e+18"
        save_hash: decree_reward_hash
      
      - wait: "3s"
      
      - cli: "mempool proc -datum {{decree_reward_hash}} -chain zerochain"
      
      - wait: "32s"

  # === PART 4: Add validator 2 (node-7) ===
  - group: Add validator 2 (node-7)
    defaults:
      node: "{{first_root}}"
    steps:
      - python: |
          root_count = ctx.get('root_count')
          val_idx = 2
          node_num = root_count + val_idx + 1
          ctx.set_variable('_val_node', f"node-{node_num}")
          ctx.set_variable('_val_wallet', f"stagenet_master_{val_idx}")
          ctx.set_variable('_val_cert', f"stagenet.master.pvt.{val_idx}")
          print(f"Setting up validator {val_idx}: node-{node_num}")
      
      - cli: "wallet info -w {{_val_wallet}}"
        node: "{{_val_node}}"
        save_wallet: _val2_addr
      
      - cli: "tx_create -from_wallet stagenet_root_0 -value 1000000.0e+18 -to_addr {{_val2_addr}} -token TCELL -fee 5.0e+18 -chain main"
        save_hash: transfer_2
      
      - wait: "60s"
      
      - cli: "stake_lock hold -token TCELL -w {{_val_wallet}} -value 10000.0e+18 -time_staking 501231 -fee 5.0e+18"
        node: "{{_val_node}}"
        save_hash: stake_lock_2
      
      - wait: "60s"
      
      - cli: "srv_stake delegate -w {{_val_wallet}} -value 2.0e+18 -cert {{_val_cert}} -fee 5.0e+18"
        node: "{{_val_node}}"
        save_hash: delegate_2
      
      - wait: "60s"
      
      - python: |
          root_count = ctx.get('root_count')
          certs = [f"stagenet.root.pvt.{i}" for i in range(root_count)]
          ctx.set_variable('_poa_certs', ",".join(certs))
      
      - cli: "srv_stake approve -tx {{delegate_2}} -poa_cert {{_poa_certs}}"
        save_hash: approve_2
      
      - wait: "3s"
      
      - cli: "mempool proc -datum {{approve_2}} -chain zerochain"
      
      - wait: "60s"
      
      - cli: "srv_stake order create -value 0.05e+18 -cert {{_val_cert}}"
        node: "{{_val_node}}"
        ignore_error: true

  # === PART 5: Add validator 3 (node-8) ===
  - group: Add validator 3 (node-8)
    defaults:
      node: "{{first_root}}"
    steps:
      - python: |
          root_count = ctx.get('root_count')
          val_idx = 3
          node_num = root_count + val_idx + 1
          ctx.set_variable('_val_node', f"node-{node_num}")
          ctx.set_variable('_val_wallet', f"stagenet_master_{val_idx}")
          ctx.set_variable('_val_cert', f"stagenet.master.pvt.{val_idx}")
          print(f"Setting up validator {val_idx}: node-{node_num}")
      
      - cli: "wallet info -w {{_val_wallet}}"
        node: "{{_val_node}}"
        save_wallet: _val3_addr
      
      - cli: "tx_create -from_wallet stagenet_root_0 -value 1000000.0e+18 -to_addr {{_val3_addr}} -token TCELL -fee 5.0e+18 -chain main"
        save_hash: transfer_3
      
      - wait: "60s"
      
      - cli: "stake_lock hold -token TCELL -w {{_val_wallet}} -value 10000.0e+18 -time_staking 501231 -fee 5.0e+18"
        node: "{{_val_node}}"
        save_hash: stake_lock_3
      
      - wait: "60s"
      
      - cli: "srv_stake delegate -w {{_val_wallet}} -value 2.0e+18 -cert {{_val_cert}} -fee 5.0e+18"
        node: "{{_val_node}}"
        save_hash: delegate_3
      
      - wait: "60s"
      
      - python: |
          root_count = ctx.get('root_count')
          certs = [f"stagenet.root.pvt.{i}" for i in range(root_count)]
          ctx.set_variable('_poa_certs', ",".join(certs))
      
      - cli: "srv_stake approve -tx {{delegate_3}} -poa_cert {{_poa_certs}}"
        save_hash: approve_3
      
      - wait: "3s"
      
      - cli: "mempool proc -datum {{approve_3}} -chain zerochain"
      
      - wait: "60s"
      
      - cli: "srv_stake order create -value 0.05e+18 -cert {{_val_cert}}"
        node: "{{_val_node}}"
        ignore_error: true

  # === PART 6: Add validator 4 (node-9) ===
  - group: Add validator 4 (node-9)
    defaults:
      node: "{{first_root}}"
    steps:
      - python: |
          root_count = ctx.get('root_count')
          val_idx = 4
          node_num = root_count + val_idx + 1
          ctx.set_variable('_val_node', f"node-{node_num}")
          ctx.set_variable('_val_wallet', f"stagenet_master_{val_idx}")
          ctx.set_variable('_val_cert', f"stagenet.master.pvt.{val_idx}")
          print(f"Setting up validator {val_idx}: node-{node_num}")
      
      - cli: "wallet info -w {{_val_wallet}}"
        node: "{{_val_node}}"
        save_wallet: _val4_addr
      
      - cli: "tx_create -from_wallet stagenet_root_0 -value 1000000.0e+18 -to_addr {{_val4_addr}} -token TCELL -fee 5.0e+18 -chain main"
        save_hash: transfer_4
      
      - wait: "60s"
      
      - cli: "stake_lock hold -token TCELL -w {{_val_wallet}} -value 10000.0e+18 -time_staking 501231 -fee 5.0e+18"
        node: "{{_val_node}}"
        save_hash: stake_lock_4
      
      - wait: "60s"
      
      - cli: "srv_stake delegate -w {{_val_wallet}} -value 2.0e+18 -cert {{_val_cert}} -fee 5.0e+18"
        node: "{{_val_node}}"
        save_hash: delegate_4
      
      - wait: "60s"
      
      - python: |
          root_count = ctx.get('root_count')
          certs = [f"stagenet.root.pvt.{i}" for i in range(root_count)]
          ctx.set_variable('_poa_certs', ",".join(certs))
      
      - cli: "srv_stake approve -tx {{delegate_4}} -poa_cert {{_poa_certs}}"
        save_hash: approve_4
      
      - wait: "3s"
      
      - cli: "mempool proc -datum {{approve_4}} -chain zerochain"
      
      - wait: "60s"
      
      - cli: "srv_stake order create -value 0.05e+18 -cert {{_val_cert}}"
        node: "{{_val_node}}"
        ignore_error: true

check:
  - cli: "token info -name mTCELL"
    node: "{{first_root}}"
    contains: "token_name: mTCELL"
  
  - cli: "srv_stake list keys"
    node: "{{first_root}}"
    contains: "pkey_hash"
  
  - python: |
      import subprocess
      result = subprocess.run(
          ["docker", "exec", "cellframe-stage-node-1", "cellframe-node-cli", 
           "srv_stake", "list", "keys", "-net", "stagenet"],
          capture_output=True, text=True
      )
      pkey_count = result.stdout.count('pkey_hash:')
      print(f"✓ Total validators: {pkey_count} (expected 5)")
