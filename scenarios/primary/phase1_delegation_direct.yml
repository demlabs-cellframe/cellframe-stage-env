name: PRIMARY PHASE 1 - Direct Delegation and Revoke
description: "Declare mTCELL token, delegate 2 keys, revoke 1 key (final: 2 PoA + 1 delegated = 3 keys)"

defaults:
  cli:
    net: stagenet
    port: "8079"

network:
  topology: default
  name: stagenet

# Restore from genesis_complete snapshot when running standalone
restore_snapshot: genesis_complete
# Skip genesis flow - snapshot already contains complete genesis state
run_genesis_flow: false

# Phase 1 workflow:
# Topology: 3 root + 5 master + 2 full = 10 nodes
# Genesis creates 2 PoA keys on master_0 (node-4) and master_1 (node-5)
# Each node can have only ONE registered key, so we use free master nodes:
# - master_2 (node-6), master_3 (node-7), master_4 (node-8) are available
#
# Steps:
# 1. Start with 2 PoA keys (genesis validators on master_0, master_1)
# 2. Declare mTCELL token (required for staking)
# 3. Delegate key on master_2 (node-6) - no key yet
# 4. Delegate key on master_3 (node-7) - no key yet  
# 5. Revoke key on master_3 (test revocation)
# Final state: 3 keys (2 PoA + 1 delegated on master_2)

# Variables auto-injected from topology (ScenarioGlobalContext):
# root_count, master_count, full_count, root_nodes, master_nodes, full_nodes, all_nodes
# native_ticker (auto-resolved from network config)

setup:
  # CRITICAL: Stop containers BEFORE restore to avoid file conflicts
  - docker_op: stop
    services: "{{all_nodes}}"
  
  # Restore from genesis_complete snapshot (when running standalone)
  - snapshot: restore
    name: genesis_complete
  
  # Build active nodes list (root + master, no full nodes needed for this test)
  - compute: _active_nodes
    expr: "root_nodes + master_nodes"
  
  # Start containers
  - docker_op: start
    services: "{{_active_nodes}}"
    detach: true
  
  - log: "Phase 1: {{root_count}} root, {{master_count}} master nodes"
  - log: "Will delegate on: master_2 and master_3, then revoke master_3"
  
  - wait_network: online
    nodes: "{{_active_nodes}}"
    timeout: 120

test:
  # === PART 1: Check initial state (should have 2 PoA keys) ===
  - group: Check initial validators
    defaults:
      node: "{{root_nodes[0]}}"
    steps:
      - cli: "srv_stake list keys"
        save: _initial_keys
      
      - count: _initial_key_count
        pattern: "pkey_hash:"
        in: "{{_initial_keys}}"
      
      - log: "Initial validators: {{_initial_key_count}} (expected: 2 PoA)"
      
      - assert: _initial_key_count == 2
        message: "Expected 2 initial validators"

  # === PART 2: Declare mTCELL (delegated token) ===
  - group: Declare mTCELL token
    defaults:
      node: "{{root_nodes[0]}}"
      cli:
        chain: "zerochain"
    steps:
      - cli: "token info -name mTCELL"
        save: _mtcell_check
        ignore_error: true
      
      - set: _mtcell_exists = false
      
      - if: "'token_name: mTCELL' in _mtcell_check"
        then:
          - set: _mtcell_exists = true
          - log: "✓ mTCELL already declared"
        else:
          - log: "mTCELL not found - will declare"
      
      - if: "not _mtcell_exists"
        then:
          # Build certs string dynamically
          - join: _root_certs
            template: "stagenet.root.pvt.{i}"
            range: "{{root_count}}"
            separator: ","
          
          - cli: "token_decl -token mTCELL -delegated_token_from TCELL -total_supply 0 -decimals 18 -signs_emission {{root_count}} -signs_total {{root_count}} -type CF20 -certs {{_root_certs}}"
            save_hash: mtcell_decl_hash
          
          - cli: "mempool proc -datum {{mtcell_decl_hash}}"
          
          # Wait for token declaration to be finalized in DAG
          - wait: finalized
            datum: "{{mtcell_decl_hash}}"
            node: "{{root_nodes[0]}}"
            chain: zerochain
            timeout: 60
      
      - cli: "token info -name mTCELL"
        expect_output: "token_name: mTCELL"

  # === PART 3: Delegate validator on last master (no key yet) ===
  # Genesis creates PoA keys on master_0, master_1 (indices 0, 1)
  # So we use master_2 (index 2) which has no key
  - group: Delegate validator on master_2
    defaults:
      node: "{{root_nodes[0]}}"
    steps:
      # Use index 2 for third master (last one without PoA key)
      - set: _val2_idx = 2
      
      # Get node from master_nodes list
      - compute: _val2_node
        expr: "master_nodes[_val2_idx]"
      
      # Wallet and cert names match the index
      - set: _val2_wallet = "stagenet_master_{{_val2_idx}}"
      - set: _val2_cert = "stagenet.master.pvt.{{_val2_idx}}"
      
      - log: "Delegating validator: master_{{_val2_idx}} on {{_val2_node}}"
      
      - cli: "wallet info -w {{_val2_wallet}}"
        node: "{{_val2_node}}"
        save_wallet: _val2_addr
      
      # Transfer TCELL and wait for finalization
      - cli: "tx_create -from_wallet stagenet_root_0 -value 1000000.0e+18 -to_addr {{_val2_addr}} -token TCELL -fee 5.0e+18 -chain main"
        save_hash: transfer_val2
      
      - wait: finalized
        datum: "{{transfer_val2}}"
        node: "{{root_nodes[0]}}"
        chain: "main"
        timeout: 90
      
      # Stake lock and wait for finalization
      - cli: "stake_lock hold -token TCELL -w {{_val2_wallet}} -value 10000.0e+18 -time_staking 501231 -fee 5.0e+18"
        node: "{{_val2_node}}"
        save_hash: stake_lock_val2
      
      - wait: finalized
        datum: "{{stake_lock_val2}}"
        node: "{{root_nodes[0]}}"
        chain: "main"
        timeout: 90
      
      # Delegate and wait for finalization
      - cli: "srv_stake delegate -w {{_val2_wallet}} -value 2.0e+18 -cert {{_val2_cert}} -fee 5.0e+18"
        node: "{{_val2_node}}"
        save_hash: delegate_val2
      
      - wait: finalized
        datum: "{{delegate_val2}}"
        node: "{{root_nodes[0]}}"
        chain: "main"
        timeout: 90
      
      # Approve delegation decree
      - cli: "srv_stake approve -tx {{delegate_val2}} -poa_cert stagenet.root.pvt.0"
        save_hash: approve_val2
      
      - cli: "decree sign -datum {{approve_val2}} -chain zerochain -certs stagenet.root.pvt.1"
        node: "{{root_nodes[1]}}"
        save_hash: approve_val2_signed
      
      - cli: "mempool proc -datum {{approve_val2_signed}} -chain zerochain"
      
      # Wait for decree to be finalized in DAG (not just mempool!)
      - wait: finalized
        datum: "{{approve_val2_signed}}"
        node: "{{root_nodes[0]}}"
        chain: "zerochain"
        timeout: 60
      
      - log: "✓ Validator approve decree finalized in DAG, creating anchor..."
      
      - cli: "decree anchor -datum {{approve_val2_signed}} -chain main -certs stagenet.root.pvt.0"
        save_hash: approve_val2_anchor
      
      # Wait for anchor to be finalized
      - wait: finalized
        datum: "{{approve_val2_anchor}}"
        node: "{{root_nodes[0]}}"
        chain: "main"
        timeout: 90
      
      - log: "✓ Validator master_2 ({{_val2_node}}) delegated"

  # === PART 4: Delegate validator on fourth master node ===
  - group: Delegate validator on master_3
    defaults:
      node: "{{root_nodes[0]}}"
    steps:
      # Use index 3 for fourth master (0-based: master_0,1 have PoA, master_2 delegated above)
      - set: _val3_idx = 3
      
      # Get node from master_nodes list
      - compute: _val3_node
        expr: "master_nodes[_val3_idx]"
      
      # Wallet and cert names match the index
      - set: _val3_wallet = "stagenet_master_{{_val3_idx}}"
      - set: _val3_cert = "stagenet.master.pvt.{{_val3_idx}}"
      
      - log: "Delegating validator: master_{{_val3_idx}} on {{_val3_node}}"
      
      - cli: "wallet info -w {{_val3_wallet}}"
        node: "{{_val3_node}}"
        save_wallet: _val3_addr
      
      # Transfer TCELL and wait for finalization
      - cli: "tx_create -from_wallet stagenet_root_0 -value 1000000.0e+18 -to_addr {{_val3_addr}} -token TCELL -fee 5.0e+18 -chain main"
        save_hash: transfer_val3
      
      - wait: finalized
        datum: "{{transfer_val3}}"
        node: "{{root_nodes[0]}}"
        chain: "main"
        timeout: 90
      
      # Stake lock and wait for finalization
      - cli: "stake_lock hold -token TCELL -w {{_val3_wallet}} -value 10000.0e+18 -time_staking 501231 -fee 5.0e+18"
        node: "{{_val3_node}}"
        save_hash: stake_lock_val3
      
      - wait: finalized
        datum: "{{stake_lock_val3}}"
        node: "{{root_nodes[0]}}"
        chain: "main"
        timeout: 90
      
      # Delegate and wait for finalization
      - cli: "srv_stake delegate -w {{_val3_wallet}} -value 2.0e+18 -cert {{_val3_cert}} -fee 5.0e+18"
        node: "{{_val3_node}}"
        save_hash: delegate_val3
      
      - wait: finalized
        datum: "{{delegate_val3}}"
        node: "{{root_nodes[0]}}"
        chain: "main"
        timeout: 90
      
      # Approve delegation decree
      - cli: "srv_stake approve -tx {{delegate_val3}} -poa_cert stagenet.root.pvt.0"
        save_hash: approve_val3
      
      - cli: "decree sign -datum {{approve_val3}} -chain zerochain -certs stagenet.root.pvt.1"
        node: "{{root_nodes[1]}}"
        save_hash: approve_val3_signed
      
      - cli: "mempool proc -datum {{approve_val3_signed}} -chain zerochain"
      
      # Wait for decree to be finalized in DAG (not just mempool!)
      - wait: finalized
        datum: "{{approve_val3_signed}}"
        node: "{{root_nodes[0]}}"
        chain: "zerochain"
        timeout: 60
      
      - log: "✓ Validator approve decree finalized in DAG, creating anchor..."
      
      - cli: "decree anchor -datum {{approve_val3_signed}} -chain main -certs stagenet.root.pvt.0"
        save_hash: approve_val3_anchor
      
      # Wait for anchor to be finalized
      - wait: finalized
        datum: "{{approve_val3_anchor}}"
        node: "{{root_nodes[0]}}"
        chain: "main"
        timeout: 90
      
      - log: "✓ Validator master_3 ({{_val3_node}}) delegated"

  # === PART 5: Verify 4 keys before revoke ===
  - group: Verify 4 keys (2 PoA + 2 delegated)
    defaults:
      node: "{{root_nodes[0]}}"
    steps:
      - cli: "srv_stake list keys"
        save: _keys_before_revoke
      
      - count: _key_count_before
        pattern: "pkey_hash:"
        in: "{{_keys_before_revoke}}"
      
      - log: "Validators before revoke: {{_key_count_before}} (expected: 4)"
      
      - assert: _key_count_before == 4
        message: "Expected 4 validators before revoke"

  # === PART 6: Revoke validator on master_3 ===
  - group: Revoke validator on master_3
    defaults:
      node: "{{root_nodes[0]}}"
    steps:
      # Get node address for master_3
      - cli: "net get status"
        node: "{{_val3_node}}"
        save: _val3_status
      
      - extract: _val3_node_addr
        from: "{{_val3_status}}"
        pattern: "current_addr:\\s*([A-F0-9:]+)"
        group: 1
      
      - log: "master_3 ({{_val3_node}}) address: {{_val3_node_addr}}"
      
      # Get keys in table format (-h) where node_addr is first column
      - cli: "srv_stake list keys -h"
        save: _all_keys_table
      
      # Extract pkey_hash for specific node_addr (table format: "node_addr | pkey_hash | ...")
      - extract: _val3_pkey_hash
        from: "{{_all_keys_table}}"
        pattern: "{{_val3_node_addr}}\\s*\\|\\s*(0x[A-Fa-f0-9]+)"
        group: 1
      
      - log: "Found pkey_hash for {{_val3_node_addr}}: {{_val3_pkey_hash}}"
      
      # Revoke the delegation using invalidate command
      - cli: "srv_stake invalidate -poa_cert stagenet.root.pvt.0 -signing_pkey_hash {{_val3_pkey_hash}} -signing_pkey_type sig_dil"
        save_hash: revoke_val3
      
      - cli: "decree sign -datum {{revoke_val3}} -chain zerochain -certs stagenet.root.pvt.1"
        node: "{{root_nodes[1]}}"
        save_hash: revoke_val3_signed
      
      - cli: "mempool proc -datum {{revoke_val3_signed}} -chain zerochain"
      
      # Wait for revoke decree to be finalized in DAG (not just mempool!)
      - wait: finalized
        datum: "{{revoke_val3_signed}}"
        node: "{{root_nodes[0]}}"
        chain: "zerochain"
        timeout: 60
      
      - log: "✓ Validator revoke decree finalized in DAG, creating anchor..."
      
      - cli: "decree anchor -datum {{revoke_val3_signed}} -chain main -certs stagenet.root.pvt.0"
        save_hash: revoke_val3_anchor
      
      # Wait for anchor to be finalized
      - wait: finalized
        datum: "{{revoke_val3_anchor}}"
        node: "{{root_nodes[0]}}"
        chain: "main"
        timeout: 180
      
      - log: "✓ Validator master_3 ({{_val3_node}}) revoked"

  # === PART 7: Final verification - 3 keys ===
  - group: Verify final state (3 keys)
    defaults:
      node: "{{root_nodes[0]}}"
    steps:
      - cli: "srv_stake list keys"
        save: _final_keys
      
      - count: _final_key_count
        pattern: "pkey_hash:"
        in: "{{_final_keys}}"
      
      - log: "Final validators: {{_final_key_count}} (expected: 3 = 2 PoA + 1 delegated)"
      
      - assert: _final_key_count == 3
        message: "Expected 3 final validators"
      
      # Create stake order for remaining delegated validator
      - cli: "srv_stake order create -value 0.05e+18 -cert stagenet.master.pvt.2"
        node: "{{_val2_node}}"

  # === Create snapshot ===
  - group: Create phase 1 snapshot
    steps:
      - snapshot: create
        name: primary_phase1_complete

check:
  - cli: "token info -name mTCELL -net stagenet"
    node: "{{root_nodes[0]}}"
    expect_output: "token_name: mTCELL"
  
  - cli: "srv_stake list keys -net stagenet"
    node: "{{root_nodes[0]}}"
    expect_output: "pkey_hash"
  
  - log: "✓ Phase 1 check complete: mTCELL declared, validators configured"
