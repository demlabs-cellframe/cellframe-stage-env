name: PRIMARY PHASE 1 - Direct Delegation and Revoke
description: "Declare mTCELL token, delegate 2 keys, revoke 1 key (final: 2 PoA + 1 delegated = 3 keys)"

defaults:
  cli:
    net: stagenet
    port: "8079"

network:
  topology: default
  name: stagenet

# Phase 1 workflow:
# 1. Start with 2 PoA keys (genesis validators on node-5, node-6)
# 2. Declare mTCELL token
# 3. Delegate key on node-7 (master_2)
# 4. Delegate key on node-8 (master_3)
# 5. Revoke key on node-8 (test revocation)
# Final state: 3 keys (2 PoA + 1 delegated)

# Variables auto-injected from topology:
# root_count, master_count, root_nodes, master_nodes, first_root, first_master, etc.

setup:
  # Restore from genesis_complete snapshot (when running standalone)
  - snapshot: restore
    name: genesis_complete
  
  # Build node lists from topology counts (auto-injected or defaults)
  # Default topology: 3 root, 3 master, 2 full = 8 nodes
  - compute: _root_count
    expr: "get_var('root_count', 3)"
  
  - compute: _master_count
    expr: "get_var('master_count', 3)"
  
  - compute: _root_nodes
    expr: "['node-' + str(i+1) for i in range(_root_count)]"
  
  - compute: _master_nodes
    expr: "['node-' + str(_root_count + i + 1) for i in range(_master_count)]"
  
  - compute: _active_nodes
    expr: "_root_nodes + _master_nodes"
  
  # Recreate containers to pick up restored data from snapshot
  - docker_op: recreate
    services: "{{_active_nodes}}"
    detach: true
  
  - log: "Phase 1: {{_root_count}} root nodes, {{_master_count}} master nodes"
  - log: "Will delegate: master_2, master_3; Will revoke: master_3"
  
  - wait_network: online
    nodes: "{{_active_nodes}}"
    timeout: 120

test:
  # === PART 1: Check initial state (should have 2 PoA keys) ===
  - group: Check initial validators
    defaults:
      node: "node-1"
    steps:
      - cli: "srv_stake list keys"
        save: _initial_keys
      
      - count: _initial_key_count
        pattern: "pkey_hash:"
        in: "{{_initial_keys}}"
      
      - log: "Initial validators: {{_initial_key_count}} (expected: 2 PoA)"
      
      - assert: _initial_key_count == 2
        message: "Expected 2 initial validators"

  # === PART 2: Declare mTCELL (delegated token) ===
  - group: Declare mTCELL token
    defaults:
      node: "node-1"
      cli:
        chain: "zerochain"
    steps:
      - cli: "token info -name mTCELL"
        save: _mtcell_check
        ignore_error: true
      
      - set: _mtcell_exists = false
      
      - if: "'token_name: mTCELL' in _mtcell_check"
        then:
          - set: _mtcell_exists = true
          - log: "✓ mTCELL already declared"
        else:
          - log: "mTCELL not found - will declare"
      
      - if: "not _mtcell_exists"
        then:
          # Build certs string dynamically
          - join: _root_certs
            template: "stagenet.root.pvt.{i}"
            range: "{{_root_count}}"
            separator: ","
          
          - cli: "token_decl -token mTCELL -delegated_token_from TCELL -total_supply 0 -decimals 18 -signs_emission {{_root_count}} -signs_total {{_root_count}} -type CF20 -certs {{_root_certs}}"
            save_hash: mtcell_decl_hash
          
          - cli: "mempool proc -datum {{mtcell_decl_hash}}"
          
          # DAG-PoA consensus needs time
          - wait: "15s"
      
      - cli: "token info -name mTCELL"
        expect_output: "token_name: mTCELL"

  # === PART 3: Delegate validator on node-7 (master_2) ===
  - group: Delegate validator on node-7 (master_2)
    defaults:
      node: "node-1"
    steps:
      - compute: _val2_node_num
        expr: "_root_count + 2 + 1"
      
      - set: _val2_node
        value: "node-{{_val2_node_num}}"
      
      - set: _val2_wallet = "stagenet_master_2"
      - set: _val2_cert = "stagenet.master.pvt.2"
      
      - log: "Delegating validator: master_2 on {{_val2_node}}"
      
      - cli: "wallet info -w {{_val2_wallet}}"
        node: "{{_val2_node}}"
        save_wallet: _val2_addr
      
      # Transfer TCELL and wait for finalization
      - cli: "tx_create -from_wallet stagenet_root_0 -value 1000000.0e+18 -to_addr {{_val2_addr}} -token TCELL -fee 5.0e+18 -chain main"
        save_hash: transfer_val2
      
      - wait: finalized
        datum: "{{transfer_val2}}"
        node: "node-1"
        chain: "main"
        timeout: 90
      
      # Stake lock and wait for finalization
      - cli: "stake_lock hold -token TCELL -w {{_val2_wallet}} -value 10000.0e+18 -time_staking 501231 -fee 5.0e+18"
        node: "{{_val2_node}}"
        save_hash: stake_lock_val2
      
      - wait: finalized
        datum: "{{stake_lock_val2}}"
        node: "node-1"
        chain: "main"
        timeout: 90
      
      # Delegate and wait for finalization
      - cli: "srv_stake delegate -w {{_val2_wallet}} -value 2.0e+18 -cert {{_val2_cert}} -fee 5.0e+18"
        node: "{{_val2_node}}"
        save_hash: delegate_val2
      
      - wait: finalized
        datum: "{{delegate_val2}}"
        node: "node-1"
        chain: "main"
        timeout: 90
      
      # Approve delegation decree
      - cli: "srv_stake approve -tx {{delegate_val2}} -poa_cert stagenet.root.pvt.0"
        save_hash: approve_val2
      
      - cli: "decree sign -datum {{approve_val2}} -chain zerochain -certs stagenet.root.pvt.1"
        node: "node-2"
        save_hash: approve_val2_signed
      
      - cli: "mempool proc -datum {{approve_val2_signed}} -chain zerochain"
      
      # Wait for decree to be processed in DAG
      - wait: mempool
        datum: "{{approve_val2_signed}}"
        node: "node-1"
        chain: "zerochain"
        timeout: 30
      
      - cli: "decree anchor -datum {{approve_val2_signed}} -chain main -certs stagenet.root.pvt.0"
        save_hash: approve_val2_anchor
      
      # Wait for anchor to be finalized
      - wait: finalized
        datum: "{{approve_val2_anchor}}"
        node: "node-1"
        chain: "main"
        timeout: 90
      
      - log: "✓ Validator master_2 ({{_val2_node}}) delegated"

  # === PART 4: Delegate validator on node-8 (master_3) ===
  - group: Delegate validator on node-8 (master_3)
    defaults:
      node: "node-1"
    steps:
      - compute: _val3_node_num
        expr: "_root_count + 3 + 1"
      
      - set: _val3_node
        value: "node-{{_val3_node_num}}"
      
      - set: _val3_wallet = "stagenet_master_3"
      - set: _val3_cert = "stagenet.master.pvt.3"
      
      - log: "Delegating validator: master_3 on {{_val3_node}}"
      
      - cli: "wallet info -w {{_val3_wallet}}"
        node: "{{_val3_node}}"
        save_wallet: _val3_addr
      
      # Transfer TCELL and wait for finalization
      - cli: "tx_create -from_wallet stagenet_root_0 -value 1000000.0e+18 -to_addr {{_val3_addr}} -token TCELL -fee 5.0e+18 -chain main"
        save_hash: transfer_val3
      
      - wait: finalized
        datum: "{{transfer_val3}}"
        node: "node-1"
        chain: "main"
        timeout: 90
      
      # Stake lock and wait for finalization
      - cli: "stake_lock hold -token TCELL -w {{_val3_wallet}} -value 10000.0e+18 -time_staking 501231 -fee 5.0e+18"
        node: "{{_val3_node}}"
        save_hash: stake_lock_val3
      
      - wait: finalized
        datum: "{{stake_lock_val3}}"
        node: "node-1"
        chain: "main"
        timeout: 90
      
      # Delegate and wait for finalization
      - cli: "srv_stake delegate -w {{_val3_wallet}} -value 2.0e+18 -cert {{_val3_cert}} -fee 5.0e+18"
        node: "{{_val3_node}}"
        save_hash: delegate_val3
      
      - wait: finalized
        datum: "{{delegate_val3}}"
        node: "node-1"
        chain: "main"
        timeout: 90
      
      # Approve delegation decree
      - cli: "srv_stake approve -tx {{delegate_val3}} -poa_cert stagenet.root.pvt.0"
        save_hash: approve_val3
      
      - cli: "decree sign -datum {{approve_val3}} -chain zerochain -certs stagenet.root.pvt.1"
        node: "node-2"
        save_hash: approve_val3_signed
      
      - cli: "mempool proc -datum {{approve_val3_signed}} -chain zerochain"
      
      # Wait for decree to be processed in DAG
      - wait: mempool
        datum: "{{approve_val3_signed}}"
        node: "node-1"
        chain: "zerochain"
        timeout: 30
      
      - cli: "decree anchor -datum {{approve_val3_signed}} -chain main -certs stagenet.root.pvt.0"
        save_hash: approve_val3_anchor
      
      # Wait for anchor to be finalized
      - wait: finalized
        datum: "{{approve_val3_anchor}}"
        node: "node-1"
        chain: "main"
        timeout: 90
      
      - log: "✓ Validator master_3 ({{_val3_node}}) delegated"

  # === PART 5: Verify 4 keys before revoke ===
  - group: Verify 4 keys (2 PoA + 2 delegated)
    defaults:
      node: "node-1"
    steps:
      - cli: "srv_stake list keys"
        save: _keys_before_revoke
      
      - count: _key_count_before
        pattern: "pkey_hash:"
        in: "{{_keys_before_revoke}}"
      
      - log: "Validators before revoke: {{_key_count_before}} (expected: 4)"
      
      - assert: _key_count_before == 4
        message: "Expected 4 validators before revoke"

  # === PART 6: Revoke validator on node-8 (master_3) ===
  - group: Revoke validator on node-8 (master_3)
    defaults:
      node: "node-1"
    steps:
      # Get node address for master_3 (node-8)
      - cli: "net get status"
        node: "{{_val3_node}}"
        save: _val3_status
      
      - extract: _val3_node_addr
        from: "{{_val3_status}}"
        pattern: "current_addr:\\s*([A-F0-9:]+)"
        group: 1
      
      - log: "Node-8 address: {{_val3_node_addr}}"
      
      # Get all keys to find pkey_hash by node_addr
      - cli: "srv_stake list keys"
        save: _all_keys
      
      # Extract pkey_hash for the node to revoke
      # Note: We need to find pkey_hash associated with node-8
      # Since the validator was just created, we use the last pkey_hash
      - extract: _val3_pkey_hash
        from: "{{_all_keys}}"
        pattern: "pkey_hash:\\s*(0x[A-Fa-f0-9]+)"
        group: 1
        match_index: -1
      
      - log: "Found pkey_hash for revoke: {{_val3_pkey_hash}}"
      
      # Revoke the delegation using invalidate command
      - cli: "srv_stake invalidate -poa_cert stagenet.root.pvt.0 -signing_pkey_hash {{_val3_pkey_hash}} -signing_pkey_type sig_dil"
        save_hash: revoke_val3
      
      - cli: "decree sign -datum {{revoke_val3}} -chain zerochain -certs stagenet.root.pvt.1"
        node: "node-2"
        save_hash: revoke_val3_signed
      
      - cli: "mempool proc -datum {{revoke_val3_signed}} -chain zerochain"
      
      # Wait for decree in zerochain
      - wait: mempool
        datum: "{{revoke_val3_signed}}"
        node: "node-1"
        chain: "zerochain"
        timeout: 30
      
      - cli: "decree anchor -datum {{revoke_val3_signed}} -chain main -certs stagenet.root.pvt.0"
        save_hash: revoke_val3_anchor
      
      # Wait for anchor to be finalized
      - wait: finalized
        datum: "{{revoke_val3_anchor}}"
        node: "node-1"
        chain: "main"
        timeout: 90
      
      - log: "✓ Validator master_3 ({{_val3_node}}) revoked"

  # === PART 7: Final verification - 3 keys ===
  - group: Verify final state (3 keys)
    defaults:
      node: "node-1"
    steps:
      - cli: "srv_stake list keys"
        save: _final_keys
      
      - count: _final_key_count
        pattern: "pkey_hash:"
        in: "{{_final_keys}}"
      
      - log: "Final validators: {{_final_key_count}} (expected: 3 = 2 PoA + 1 delegated)"
      
      - assert: _final_key_count == 3
        message: "Expected 3 final validators"
      
      # Create stake order for remaining delegated validator
      - cli: "srv_stake order create -value 0.05e+18 -cert stagenet.master.pvt.2"
        node: "{{_val2_node}}"

  # === Create snapshot ===
  - group: Create phase 1 snapshot
    steps:
      - snapshot: create
        name: primary_phase1_complete

check:
  - cli: "token info -name mTCELL -net stagenet"
    node: "node-1"
    expect_output: "token_name: mTCELL"
  
  - cli: "srv_stake list keys -net stagenet"
    node: "node-1"
    expect_output: "pkey_hash"
  
  - log: "✓ Phase 1 check complete: mTCELL declared, validators configured"
