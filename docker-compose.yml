x-cf-node-template:
  build: &id001
    context: .
    dockerfile: Dockerfile.cellframe
    args:
      CELLFRAME_VERSION: ${CELLFRAME_VERSION:-latest}
      BUILD_TYPE: ${BUILD_TYPE:-debug}
      DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
      TOOLS_BASE_URL: ${TOOLS_BASE_URL:-https://pub.cellframe.net}
  image: cf-node:${BUILD_TYPE:-debug}-${CELLFRAME_VERSION:-latest}
  container_name: ${COMPOSE_PROJECT_NAME:-cellframe}-${NODE_TYPE:-node}-${NODE_ID:-1}
  hostname: ${COMPOSE_PROJECT_NAME:-cellframe}-${NODE_TYPE:-node}-${NODE_ID:-1}
  networks: &id002
    stagenet:
      ipv4_address: ${NODE_IP:-172.20.0.10}
  ports: &id003
  - ${HTTP_PORT:-8079}:8079
  volumes: &id004
  - ./cache/configs/node${NODE_ID:-1}/cellframe-node.cfg:/opt/cellframe-node/etc/cellframe-node.cfg
  - ./cache/configs/node${NODE_ID:-1}/cellframe-node.cfg.d:/opt/cellframe-node/etc/cellframe-node.cfg.d
  - ./cache/configs/node${NODE_ID:-1}/network:/opt/cellframe-node/etc/network
  - ./cache/data/node${NODE_ID:-1}:/opt/cellframe-node/var
  - ./cache/configs/shared/ca:/opt/cellframe-node/share/ca:ro
  - ./cache/crash-artifacts/node${NODE_ID:-1}:/crash-artifacts/node-${NODE_ID:-1}
  - ./cache/cellframe-packages:/var/cache/cellframe-packages
  ulimits: &id005
    core: -1
  # STAGE-CRIT-1: no full privileged mode. Curated capabilities only:
  # SYS_PTRACE (debugger attach for crash artifacts), NET_ADMIN/NET_RAW
  # (p2p sockets + genesis network config), SYS_RESOURCE (core dumps via
  # ulimit). If a node needs something else, add the specific cap instead
  # of restoring privileged.
  cap_add: &id006
  - SYS_PTRACE
  - NET_ADMIN
  - NET_RAW
  - SYS_RESOURCE
  environment: &id007
    NODE_ID: ${NODE_ID:-1}
    NODE_ROLE: ${NODE_ROLE:-root}
    NODE_TYPE: ${NODE_TYPE:-node}
    NODE_IP: ${NODE_IP:-172.20.0.10}
    NETWORK_NAME: ${NETWORK_NAME:-stagenet}
    DAP_DEBUG: ${DAP_DEBUG:-1}
    CELLFRAME_DEBUG: ${CELLFRAME_DEBUG:-1}
  stop_grace_period: 60s
  restart: 'no'
  healthcheck: &id008
    test:
    - CMD
    - sh
    - -c
    - pgrep -f cellframe-node > /dev/null
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 30s
services:
  cf-node:
    build: *id001
    image: cf-node:${BUILD_TYPE:-debug}-${CELLFRAME_VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-cellframe}-${NODE_TYPE:-node}-${NODE_ID:-1}
    hostname: ${COMPOSE_PROJECT_NAME:-cellframe}-${NODE_TYPE:-node}-${NODE_ID:-1}
    networks: *id002
    ports: *id003
    volumes: *id004
    ulimits: *id005
    cap_add: *id006
    environment: *id007
    restart: 'no'
    healthcheck: *id008
  prometheus:
    image: prom/prometheus:latest
    container_name: cf-prometheus
    ports:
    - 9090:9090
    volumes:
    - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus-data:/prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --web.console.libraries=/etc/prometheus/console_libraries
    - --web.console.templates=/etc/prometheus/consoles
    - --storage.tsdb.retention.time=200h
    - --web.enable-lifecycle
    networks:
    - stagenet
    profiles:
    - monitoring
  grafana:
    image: grafana/grafana:latest
    container_name: stagenet-grafana
    ports:
    - 3000:3000
    volumes:
    - grafana-data:/var/lib/grafana
    - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
    # H-STAGE-1: no committed default password. Set in .env:
    #   GF_SECURITY_ADMIN_PASSWORD=<strong-password>
    # If unset, Grafana gets an empty value and admin login fails closed —
    # monitoring is opt-in (--profile monitoring) so this only affects
    # operators who enable it without configuring a password.
    - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-}
    - GF_USERS_ALLOW_SIGN_UP=false
    networks:
    - stagenet
    profiles:
    - monitoring
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.tests
    container_name: stagenet-runner
    volumes:
    - ./tests:/tests:ro
    - ./results:/results
    # STAGE-CRIT-2: docker.sock mount removed — the referenced entrypoint
    # scripts (discover_nodes.py / run_all.py) do not exist in this repo,
    # so the service was non-functional while exposing a host-compromise
    # path. Node discovery now runs inside the stage-env orchestrator
    # (src/cli/test_commands.py), not from inside this container.
    environment:
    - NETWORK_NAME=${NETWORK_NAME:-stagenet}
    - NODE_DISCOVERY=docker
    - COMPOSE_PROJECT=${COMPOSE_PROJECT_NAME:-stagenet}
    networks:
    - stagenet
    profiles:
    - tests
    command:
    - sh
    - -c
    - echo "test-runner is legacy — run tests via stage_env.py instead"
networks:
  stagenet:
    driver: bridge
    ipam:
      config:
      - subnet: ${DOCKER_SUBNET:-172.20.0.0/16}
        gateway: ${DOCKER_GATEWAY:-172.20.0.1}
volumes:
  prometheus-data: null
  grafana-data: null
