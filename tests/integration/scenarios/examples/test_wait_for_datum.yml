# Example: Wait-for-Datum Helper
# Demonstrates monitoring datum processing through all network stages

name: Wait-for-Datum Example
description: Intelligent waiting for datum lifecycle (mempool → block → propagation)
tags: [example, wait_for_datum, monitoring]
version: "1.0"

network:
  topology: default

includes:
  - ../common/set_net_default.yml
  - ../common/set_root_cert.yml

defaults:
  node: node1
  wait: 2s

setup:
  - cli: wallet new -w test_wallet
  
  - cli: wallet info -w test_wallet -net {{network_name}}
    save_wallet: wallet_addr

test:
  # Create and emit token (needs ROOT certs for zerochain)
  - cli: token_decl -token WAITDEMO -total_supply 1000000 -decimals 18 -signs_total 2 -signs_emission 2 -certs {{root_certs}} -chain zerochain
    save_hash: token_hash
  
  - wait_for_datum: "{{token_hash}}"
    chain: zerochain
  
  - cli: token_emit -token WAITDEMO -emission_value 10000 -addr {{wallet_addr}} -certs {{root_certs}} -chain zerochain
    save_hash: emission_hash
  
  # MODERN: Intelligent waiting - monitors actual datum lifecycle
  # Replaces: wait: 30s (guessing how long to wait)
  - wait_for_datum: "{{emission_hash}}"
    chain: zerochain
    # All defaults are optimal - no need to override!
    # Timeouts: 0.5s mempool → 30s block → 60s propagation
    save_status: emission_status

check:
  # Verify emission succeeded
  - cli: token info -name WAITDEMO -net {{network_name}}
    contains: "WAITDEMO"
  
  # Status should be 'propagated' or 'in_blocks'
  - python: |
      status = ctx.get_variable('emission_status')
      assert status.status.value in ['propagated', 'in_blocks'], f"Expected success, got {status.status.value}"

---

# Example 2: Transaction with explicit timeouts (NOT recommended - use defaults!)
name: Transaction Wait with Custom Timeouts
description: Shows how to override timeouts (but you usually shouldn't)
tags: [example, transaction, wait_for_datum, custom_timeouts]

network:
  topology: default

includes:
  - ../common/set_net_default.yml
  - ../common/set_root_cert.yml

setup:
  - cli: wallet new -w sender
  - cli: wallet new -w receiver
  
  - cli: wallet info -w sender -net {{network_name}}
    save_wallet: sender_addr
  
  - cli: wallet info -w receiver -net {{network_name}}
    save_wallet: receiver_addr
  
  # Prepare tokens (needs ROOT certs for zerochain)
  - cli: token_decl -token TXDEMO -total_supply 1000000 -decimals 18 -signs_total 2 -signs_emission 2 -certs {{root_certs}} -chain zerochain
    save_hash: declaration_hash

  - wait_for_datum: "{{declaration_hash}}"
    chain: zerochain

  - cli: token_emit -token TXDEMO -emission_value 10000 -addr {{sender_addr}} -certs {{root_certs}} -chain zerochain
    save_hash: emission_hash

  - wait_for_datum: "{{emission_hash}}"
    chain: zerochain

test:
  # Create transaction (goes to main chain)
  - cli: tx create -token TXDEMO -from_emission {{emission_hash}} -to_addr {{receiver_addr}} -value 5000 -fee 0.1 -cert {{root_cert_single}}
    save_hash: tx_hash
  
  # Monitor transaction with custom timeouts (usually NOT needed!)
  - wait_for_datum: "{{tx_hash}}"
    timeout_total: 90       # Override default 300s
    timeout_in_blocks: 60   # Override default 180s
    check_interval: 1       # Check every second instead of 2s

check:
  - cli: tx_history -tx {{tx_hash}} -net {{network_name}}
    contains: "{{tx_hash}}"

---

# Example 3: Multiple datums (recommended pattern)
name: Multiple Datums Wait
description: Monitor multiple datums efficiently
tags: [example, multiple, wait_for_datum]

network:
  topology: default

includes:
  - ../common/set_net_default.yml
  - ../common/set_root_cert.yml
  - ../common/wallets/create_wallet.yml  # Provides wallet_addr

test:
  # Create multiple tokens (needs ROOT certs for zerochain)
  - cli: token_decl -token BATCH1 -total_supply 1000000 -decimals 18 -signs_total 2 -signs_emission 2 -certs {{root_certs}} -chain zerochain
    save_hash: token1
  
  - cli: token_decl -token BATCH2 -total_supply 2000000 -decimals 18 -signs_total 2 -signs_emission 2 -certs {{root_certs}} -chain zerochain
    save_hash: token2
  
  # Wait for BOTH tokens to be processed on zerochain
  - wait_for_datum:
      - "{{token1}}"
      - "{{token2}}"
    chain: zerochain
    # Monitors both concurrently - returns when BOTH are done!

  # Now emit from both tokens
  - cli: token_emit -token BATCH1 -emission_value 1000 -addr {{wallet_addr}} -certs {{root_certs}} -chain zerochain
    save_hash: emit1
  
  - cli: token_emit -token BATCH2 -emission_value 2000 -addr {{wallet_addr}} -certs {{root_certs}} -chain zerochain
    save_hash: emit2
  
  # Wait for both emissions on zerochain
  - wait_for_datum: ["{{emit1}}", "{{emit2}}"]
    chain: zerochain

check:
  - cli: token list -net {{network_name}}
    contains: "BATCH1"
  
  - cli: token list -net {{network_name}}
    contains: "BATCH2"

---

# Example 4: MINIMAL syntax (recommended!)
name: Minimal Wait-for-Datum
description: Simplest possible usage - just the hash
tags: [example, minimal, best_practice]

network:
  topology: default

includes:
  - ../common/set_net_default.yml
  - ../common/set_root_cert.yml
  - ../common/wallets/create_wallet.yml

test:
  # Note: zerochain requires ROOT certs for authorization
  - cli: token_decl -token MINIMAL -total_supply 1000000 -decimals 18 -signs_total 2 -signs_emission 2 -certs {{root_certs}} -chain zerochain
    save_hash: hash
  
  # ✅ BEST PRACTICE: Minimal syntax - all defaults are optimal!
  - wait_for_datum: "{{hash}}"
    chain: zerochain
  
  # That's it! No timeout overrides, no extra params.
  # Fails fast (0.5s) if datum not created
  # Returns immediately when done
  # Default timeouts are tuned for real network behavior

check:
  - cli: token info -name MINIMAL -net {{network_name}}
    contains: "MINIMAL"

