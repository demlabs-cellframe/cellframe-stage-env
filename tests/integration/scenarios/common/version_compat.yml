# Version compatibility layer for CLI commands
# Include this file to get version-aware command variables
#
# This file sets command variables that work across different versions:
#   - 5.x: Uses underscore commands (tx_create, tx_history, etc.)
#   - 6.x: Uses space commands (tx create, tx history, etc.)
#
# To override version detection, set 'node_version_major' variable before including this file.
#
# Available variables after including this file:
#   {{tx_create_cmd}}  - "tx_create" (5.x) or "tx create" (6.x)
#   {{tx_history_cmd}} - "tx_history" (5.x) or "tx history" (6.x)
#   {{ledger_list_cmd}} - "ledger list coins" (5.x) or "token info" (6.x)

setup:
  # Set version-specific command names based on node_version_major
  # Default to 6.x (current development version)
  - python: |
      # Check if version is explicitly set, otherwise default to 6
      try:
          major_str = ctx.get_variable('node_version_major')
          major = int(major_str) if major_str else 6
      except:
          major = 6
      
      # Set version-specific command names
      if major >= 6:
          # 6.x uses space-separated subcommands
          ctx.set_variable('tx_create_cmd', 'tx create')
          ctx.set_variable('tx_history_cmd', 'tx history')
          ctx.set_variable('tx_verify_cmd', 'tx verify')
          ctx.set_variable('ledger_list_cmd', 'token info')
      else:
          # 5.x uses underscore commands
          ctx.set_variable('tx_create_cmd', 'tx_create')
          ctx.set_variable('tx_history_cmd', 'tx_history')
          ctx.set_variable('tx_verify_cmd', 'tx_verify')
          ctx.set_variable('ledger_list_cmd', 'ledger list coins')
    description: "Set version-specific CLI command variables"
