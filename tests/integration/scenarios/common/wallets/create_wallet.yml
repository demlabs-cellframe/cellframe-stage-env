# Common: Create test wallet on node 1
# Shared component for creating a test wallet

# Variables exported by this include:
#   wallet_name: "test_wallet" - name of the created wallet
#   wallet_addr: wallet address string

variables:
  wallet_name: "test_wallet"

setup:
  - cli: wallet new -w test_wallet
    node: node1
    save: wallet_created
    wait: 1s
    description: "Create test wallet"
  
  # Extract wallet address with built-in validation
  # Note: -net is required for wallet info to show addresses
  - cli: wallet info -w test_wallet -net {{network_name}}
    node: node1
    expect: success
    save_wallet: wallet_addr
    description: "Get wallet address with validation"
