# Common: Set ROOT certificates for zerochain operations
# 
# IMPORTANT: For zerochain (DAG-PoA), datums must be signed by authorized ROOT certificates.
# The auth_certs_number_verify parameter determines minimum required signatures.
# Default topology: 2 ROOT nodes → auth_certs_number_verify = 2 (need 2 signatures)
#
# After genesis, all private ROOT certs are available on node1.
#
# Usage: Include this file and use -certs {{root_certs}} in token_decl, token_emit, etc.
# Variables are set dynamically based on network_name from the network topology.

setup:
  # Dynamically set root certificate variables based on network_name
  # Falls back to 'stagenet' if network_name not yet available
  - python: |
      try:
          net = ctx.get_variable('network_name')
      except:
          net = 'stagenet'
      if not net:
          net = 'stagenet'
      ctx.set_variable('root_certs', f"{net}.root.pvt.0,{net}.root.pvt.1")
      ctx.set_variable('root_cert_single', f"{net}.root.pvt.0")
    description: "Set root certificates for network"
