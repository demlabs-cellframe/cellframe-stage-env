# Common: Set ROOT certificates for zerochain operations
# 
# IMPORTANT: For zerochain (DAG-PoA), datums must be signed by authorized ROOT certificates.
# The auth_certs_number_verify parameter determines minimum required signatures.
# Default topology: 2 ROOT nodes → auth_certs_number_verify = 2 (need 2 signatures)
#
# After genesis, all private ROOT certs are available on node1.
#
# Usage: Include this file and use -certs {{root_certs}} in token_decl, token_emit, etc.
# Note: Network name is hardcoded as 'stagenet' since this is the test environment.

variables:
  # Both ROOT certificates for auth_certs_number_verify=2 (default topology)
  # Both certs are on node1 after genesis
  root_certs: "stagenet.root.pvt.0,stagenet.root.pvt.1"
  
  # Single ROOT cert (only works if auth_certs_number_verify=1)
  root_cert_single: "stagenet.root.pvt.0"
  
  # All 3 ROOT certificates (for TCELL which requires 3 signatures)
  root_certs_tcell: "stagenet.root.pvt.0,stagenet.root.pvt.1,stagenet.root.pvt.2"
