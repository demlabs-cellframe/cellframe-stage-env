[pytest]
minversion = 7.4

testpaths =
    unit
    integration
    regression
    e2e

addopts =
    -ra
    -v
    --strict-markers
    --strict-config
    --tb=short
    --cov=src
    --cov-branch
    --cov-report=term-missing
    --cov-report=html
    --cov-config=../.coveragerc
    --durations=10
    --timeout=300
    --color=yes
    --code-highlight=yes

python_files = test_*.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto

markers =
    unit: Unit tests that do not require external resources (fast, < 100ms)
    integration: Integration tests that may use Docker/network (< 5s)
    e2e: End-to-end tests using full system lifecycle (< 60s)
    regression: Regression tests for specific bug fixes
    slow: Slow tests that take > 5 seconds
    smoke: Smoke tests for quick validation
    docker: Tests that require Docker daemon
    network: Tests that require network access
    filesystem: Tests that require filesystem access
    privileged: Tests that require elevated privileges (sudo)
    skipci: Tests to skip in CI/CD environment
    flaky: Tests known to be flaky (will be fixed)

norecursedirs =
    .git
    .tox
    .venv
    venv
    env
    __pycache__
    .pytest_cache
    .mypy_cache
    .ruff_cache
    htmlcov
    dist
    build
    *.egg-info
    node_modules

console_output_style = progress

log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s:%(lineno)d - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:docker

env =
    STAGE_ENV_TEST_MODE=1
    PYTEST_RUNNING=1
