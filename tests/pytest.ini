[pytest]
minversion = 6.0
addopts = -ra -q
testpaths =
    unit
    integration
    regression
markers =
    unit: Unit tests that do not require external resources (fast)
    integration: Integration tests that simulate end-to-end flow
    regression: Regression tests for specific bugs
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

