[pytest]
# Minimum pytest version
minversion = 7.4

# Test paths
testpaths =
    unit
    integration
    e2e

# Default options
addopts =
    -ra
    -v
    --strict-markers
    --tb=short
    --color=yes

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for categorizing tests
markers =
    unit: Unit tests that do not require external resources (fast)
    integration: Integration tests between modules
    e2e: End-to-end tests using full system (slow)
    slow: Tests that take significant time to run
    docker: Tests that require Docker daemon
    network: Tests that involve network operations

# Asyncio mode
asyncio_mode = auto

# Logging
log_cli_level = INFO
log_file_level = DEBUG
