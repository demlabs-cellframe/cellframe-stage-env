# Enable {{ network_name | default('stagenet') }} for testing
# This configuration enables only the test network

[{{ network_name | default('stagenet') }}]
enabled=true

# Role-specific configurations for master nodes
[role-master]
# Chains that master nodes should process
proc_chains=[0x0000000000000001]  # Process main chain (ESBocs consensus)
mempool_autoproc=true

[role-root]
mempool_autoproc=true

[role-full]
# Full nodes sync all data but don't participate in consensus
